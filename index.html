  font-variant-numeric:tabular-nums;color:var(--text);
}
.popover.fin-editor .cpp-amount-input:focus{
  outline:none;border-color:#F4B432;background:#FDF8E0;
}
.popover.fin-editor .cpp-actions{
  display:flex;gap:10px;justify-content:flex-end;margin-top:14px;
}
.popover.fin-editor .cpp-btn{
  padding:10px 22px;font-size:15px;font-weight:700;
  border:2px solid #2A1810;border-radius:10px;cursor:pointer;
  font-family:inherit;transition:all .12s;letter-spacing:.5px;
  min-width:96px;text-align:center;
}
.popover.fin-editor .cpp-cancel{
  background:#fff;color:var(--text);
  box-shadow:2px 2px 0 0 #2A1810;
}
.popover.fin-editor .cpp-cancel:hover{
  background:#F0EDE5;transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 0 #2A1810;
}
.popover.fin-editor .cpp-cancel:active{
  transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810;
}
.popover.fin-editor .cpp-apply{
  background:#F4D85A;color:#5C2C0F;
  box-shadow:3px 3px 0 0 #2A1810;
}
.popover.fin-editor .cpp-apply:hover{
  background:#F4B432;color:#2A1810;
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 0 #2A1810;
}
.popover.fin-editor .cpp-apply:active{
  transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810;
}

.insert-menu{
  position:fixed;z-index:60;
  background:#fff;border:1px solid var(--border);

}
.insert-menu.show{display:block}
.insert-menu button{

}

.insert-menu .icon{color:var(--text-2);width:16px;height:16px}

.mention-tab.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.mention-search-input{

}

.mention-search-results{padding:0 2px}

  display:flex;align-items:flex-start;gap:8px;
}
.mention-item:hover,.mention-item.active{background:var(--accent-soft);color:var(--accent)}
.mention-item .icon{width:14px;height:14px;color:var(--text-2)}
.mention-item.active .icon{color:var(--accent)}

.doc-side{

}
@media (max-width:900px){.doc-side{grid-template-columns:1fr}}
.side-card{

.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

.backlinks-list{display:flex;flex-direction:column;gap:6px}
.backlink-item{

}
.backlink-item:hover{background:var(--accent-soft);color:var(--accent)}

.empty-course{
  background:#fff;border:1px dashed var(--border);
  border-radius:var(--r);padding:var(--s8) var(--s5);
  text-align:center;
}

.version-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.version-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;

}
.version-item .v-time{flex:1;color:var(--text-2)}
.version-item button{font-size:11px;padding:2px 8px;border-radius:6px;background:#fff;border:1px solid var(--border);color:var(--text-2);cursor:pointer}
.version-item button:hover{color:var(--accent);border-color:var(--accent)}

@media (max-width:640px){
  .editor-body{padding:var(--s4) var(--s3) var(--s10)}

  .doc-grid{grid-template-columns:1fr}
  .editor-toolbar{padding:4px 6px;gap:0;flex-wrap:wrap;overflow-x:visible}
  .tb-btn{width:28px;height:28px}
  .tb-btn .icon{width:14px;height:14px}
  .tb-color, .tb-hl, .tb-color-custom{width:18px;height:18px}
  .tb-group{padding:0 2px;gap:0}
  .tb-color-row{flex-wrap:wrap;row-gap:2px}
  .tb-select{height:28px;font-size:11px;padding:0 4px}
  .editor-head{padding:var(--s3) var(--s3)}
  .editor-head .doc-meta-row{flex-wrap:wrap;gap:4px 6px}
  .editor-head .doc-meta-row > span:not(.save-status){font-size:11px}
  .editor-head .btn{padding:4px 8px;font-size:11px}
  .doc-title-input{font-size:20px}
  /* note/quote 内容不溢出 */
  .note-block, .block-quote{word-break:break-word;overflow-wrap:anywhere}
  .note-content, .note-label{word-break:break-word}
  /* img/video 在小屏自适应 */
  .block-img img{max-width:100%;height:auto}
  .vid-embed iframe{width:100%;height:auto;aspect-ratio:16/9}
}

/* ============================================================
   状态（LocalStorage 持久化）
   ============================================================ */
const STORAGE_KEY = 'mavis-workbench-v1';
let STATE;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      STATE = JSON.parse(raw);
      if(STATE && STATE.meta){
        // 老版本 < 3：补 profile 字段，保留用户已有数据
        if(!STATE.profile){
          const fresh = seed();
          STATE.profile = fresh.profile;
          STATE.meta.version = 3;
          saveState();
        }
        // 迁移 v3 → v3.1：把 fmt.color 应用到块文本，包 inline span，清掉 fmt.color 字段
        if(STATE.meta.version < 4){
          migrateColorsToInlineSpan();
          STATE.meta.version = 4;
          saveState();
        }
        // 兼容老版本：检测 course 是不是新版块结构
        if(STATE.meta.version < 2){
          STATE = seed();
          saveState();
          return;
        }
        // v4 → v5：Python 刷题新结构（progress / variants / pyodideReady）
        if(!STATE.python || !STATE.python.progress){
          STATE.python = {
            problems: PY_PROBLEMS,
            progress:{solved:{},streakDays:0,totalSolved:0,lastSolvedDate:null,weakness:{},today:null,difficulty:'beginner',source:'builtin',aiCache:{}},
            variants:[],pyodideReady:false,pyodideLoading:false,
          };
          STATE.meta.version = 5;
          saveState();
        }
        // v5 → v6：增加 difficulty / source / aiCache 字段
        if(!STATE.python.progress.difficulty){
          STATE.python.progress.difficulty = 'beginner';
          STATE.python.progress.source = 'builtin';
          STATE.python.progress.aiCache = {};
          STATE.meta.version = 6;
          saveState();
        }
        return;
      }
    }
  }catch(e){}
  STATE = seed();
  saveState();
}

// 把每个 block 的 fmt.color 应用到 text，包装 inline span，然后清掉 fmt.color
function migrateColorsToInlineSpan(){
  const docs = [];
  Object.keys(STATE.course||{}).forEach(k => (STATE.course[k]||[]).forEach(d => docs.push(d)));
  docs.forEach(doc => {
    (doc.blocks||[]).forEach(b => {
      if(!b.fmt || !b.fmt.color) return;
      const c = COLOR_PALETTE.find(x => x.k === b.fmt.color);
      if(!c) return;
      const colorVal = c.v;
      const cur = String(b.text||'');
      // 仅当 text 里还没 inline color span 时包
      if(!/style=["'][^"']*color/i.test(cur)){
        b.text = `<span style="color:${colorVal}">${cur}</span>`;
      }
      delete b.fmt.color;
      // _selectionHasColor 是工具栏用的旧标志位，清掉
      delete b.fmt._selectionHasColor;
      delete b.fmt._selectionHasHl;
    });
  });
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  }catch(e){
    if(e && e.name === 'QuotaExceededError'){
      console.error('[saveState] localStorage 写入失败：超限（>5MB）', e);
      toast('本地存储已满，图片可能无法保存。建议先导出备份并清理旧文档。');
    } else {
      console.error('[saveState] 失败：', e);
    }
  }
}

  return {
    id: uid(),
    course, title,
    blocks: blocks.map(b => ({id: bid(), ...b})),
    tags: tags || [],
    createdAt: updatedAt,
    updatedAt,
    version: 1,
    history: [],
    defaults: { size:'M', color:'text', bold:false },   // 文档级默认格式
  };
}

/* ============================================================
   顶部导航 / 侧边栏 / 底部导航
   ============================================================ */
function renderNav(){
  const topnav = document.getElementById('topnav');
  const topItems = ['today','course','python','english'];
  topnav.innerHTML = topItems.map(k=>{
    const r = ROUTES[k];
    return `<a class="topnav-item" data-route="${k}">${r.title}</a>`;
  }).join('') + `<a class="topnav-item topnav-more" data-route="more">更多</a>`;

  const groups = {core:[],module:[],system:[]};
  Object.entries(ROUTES).forEach(([k,r])=>{
    if(r.nav && groups[r.nav]) groups[r.nav].push({k, ...r});
  });
  const renderList = items => items.filter(r=>!r.hidden).map(r=>{
    const badge = (k)=> k==='inbox' && STATE.inbox.filter(i=>i.status==='pending').length
      ? `<span class="badge">${STATE.inbox.filter(i=>i.status==='pending').length}</span>` : '';
    return `<li><a class="side-item" data-route="${r.k||r}"><span class="icon">${icon(r.icon||ROUTES[r].icon, 'icon-sm')}</span><span>${r.title||ROUTES[r].title}</span>${badge(r.k||r)}</a></li>`;
  }).join('');

  document.getElementById('side-core').innerHTML = renderList(groups.core);
  document.getElementById('side-modules').innerHTML = renderList(groups.module);
  document.getElementById('side-system').innerHTML = renderList(groups.system);

  // 顶部用户卡（侧栏）
  const p = STATE.profile || {};
  const av = document.getElementById('side-avatar');
  const nm = document.getElementById('side-name');
  const rl = document.getElementById('side-role');
  const dt = document.getElementById('side-status-date');
  const stBox = document.getElementById('side-status');
  if(av) av.src = p.avatar || './assets/char-sponge.png';
  if(nm) nm.textContent = p.nickname || '我';
  if(rl) rl.textContent = p.role || '';
  if(dt){
    const now = new Date();
    const w = ['日','一','二','三','四','五','六'][now.getDay()];
    dt.textContent = `${now.getMonth()+1}/${now.getDate()} · 周${w}`;
  }
  // 状态条：工作中 / 休息中 / 离线
  if(stBox){
    const status = p.status || '工作中';
    stBox.classList.remove('s-working','s-resting','s-offline');
    stBox.classList.add(`s-${statusToKey(status)}`);
    const lbl = stBox.querySelector('.side-status-label');
    if(lbl) lbl.textContent = status;
  }

  const bnavItems = ['today','course','python','more'];
  document.getElementById('bnav').innerHTML = bnavItems.map(k=>{
    const r = ROUTES[k];
    return `<a class="bnav-item" data-route="${k}">${icon(r.icon)}<span>${r.title}</span></a>`;
  }).join('');

  // 浮动 fab 仅移动端
  if(window.innerWidth <= 640) document.querySelector('.fab').style.display='flex';
  else document.querySelector('.fab').style.display='none';
}
function highlightNav(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    const r = el.dataset.route;
    el.classList.toggle('active', r===currentRoute);
  });
}

/* ============================================================
   经期记录（最小可用版）
   ============================================================ */
function renderPeriod(){
  const r = ROUTES.period;
  const s = periodStats();
  const today = s.today;

  // 当前显示月（默认本月；用户可切）
  if(typeof window._periodViewMonth !== 'number') window._periodViewMonth = today.getMonth();
  if(typeof window._periodViewYear !== 'number') window._periodViewYear = today.getFullYear();
  const vm = window._periodViewMonth, vy = window._periodViewYear;
  const firstDow = new Date(vy, vm, 1).getDay(); // 0=周日
  const daysOfMonth = new Date(vy, vm+1, 0).getDate();

  // 当前状态文字
  let statusTitle = '', statusDesc = '', statusColor = '#E9A8CF';
  if(s.inPeriod){
    const dl = s.inPeriod.daysLeft;
    statusTitle = `经期第 ${s.inPeriod.dayIdx} 天`;
    statusDesc = dl === null ? '还没填结束日期，点下方 + 补一条' :
      (dl > 0 ? `预计还剩 ${dl} 天` : (dl === 0 ? '今天是预计结束日' : `已过预计结束 ${-dl} 天，记得补一条`));
  } else if(s.nextStart){
    if(s.daysUntilNext > 0){
      statusTitle = `距下次经期还有 ${s.daysUntilNext} 天`;
      statusDesc = `预计 ${fmtDateObj(s.nextStart)}（基于你的 ${s.cycleDays} 天周期）`;
    } else if(s.daysUntilNext === 0){
      statusTitle = '预计今天开始';
      statusDesc = `基于你的 ${s.cycleDays} 天周期，记得点 + 记一下`;
    } else {
      statusTitle = `预计已过 ${-s.daysUntilNext} 天`;
      statusDesc = `上次是 ${fmtDateObj(parseDate(s.records[s.records.length-1].start))}，超出周期了，点 + 补一条`;
    }
  } else {
    statusTitle = '还没有记录';
    statusDesc = '点下方 + 加第一次经期开始日期';
  }

  // 日历格子（前面补空格对齐周几）
  const periodDateSet = new Set();   // 实际经期日
  const predictedSet = new Set();    // 预测日（未记录的）
  s.records.forEach(r => {
    if(!r.start) return;
    const ls = parseDate(r.start);
    const le = r.end ? parseDate(r.end) : ls;
    for(let d = new Date(ls.getTime()); d <= le; d.setDate(d.getDate()+1)){
      periodDateSet.add(fmtDateObj(d));
    }
  });
  // 预测（从最后一条 start + 1*cycleDays 起；本视图月范围内）
  if(s.nextStart && s.records.length){
    const last = s.records[s.records.length-1];
    const predStart = addDays(parseDate(last.start), s.cycleDays);
    const periodDays = s.avgPeriodDays || 5;
    for(let d = 0; d < periodDays; d++){
      const dd = addDays(predStart, d);
      const ds = fmtDateObj(dd);
      // 只标本月 + 不覆盖实际记录
      if(dd.getFullYear() === vy && dd.getMonth() === vm && !periodDateSet.has(ds)){
        predictedSet.add(ds);
      }
    }
  }

  const todayStrVal = todayStr();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('');
  for(let d=1; d<=daysOfMonth; d++){
    const ds = `${vy}-${String(vm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isPeriod = periodDateSet.has(ds);
    const isPred = predictedSet.has(ds);
    const isToday = ds === todayStrVal;
    cells.push(`<div class="period-cell${isPeriod?' is-period':''}${isPred?' is-pred':''}${isToday?' is-today':''}" data-period-date="${ds}">${d}${isToday?'<span class="dot"></span>':''}</div>`);
  }

  return `
    <section class="page" data-page="period">
      <div class="greeting">
        <div class="greeting-text">
          <h1>${r.title}</h1>
          <p>轻量记录，暖色提示，不做医学建议</p>
        </div>
        ${helpBtn('period')}
      </div>

      <!-- 当前状态卡 -->
      <div class="card period-status" style="border-left:4px solid ${statusColor}">
        <header class="card-head">
          <h2 class="card-title" style="color:${statusColor}">${escapeHtml(statusTitle)}</h2>
        </header>
        <p style="margin:6px 0 12px;color:var(--text-2);font-size:14px">${escapeHtml(statusDesc)}</p>
        <div class="period-cycle-set">
          <span class="muted">我的周期</span>
          <button class="period-step" data-action="period-cycle-delta" data-delta="-1">−</button>
          <span class="period-cycle-num" id="period-cycle-num">${s.cycleDays}</span>
          <span class="muted">天</span>
          <button class="period-step" data-action="period-cycle-delta" data-delta="1">+</button>
          ${s.avgPeriodDays ? `<span class="muted" style="margin-left:auto">平均经期 ${s.avgPeriodDays} 天</span>` : ''}
        </div>
      </div>

      <!-- 月历 -->
      <div class="card period-cal">
        <header class="card-head">
          <button class="period-nav" data-action="period-month-prev" aria-label="上一月">‹</button>
          <h2 class="card-title" style="flex:1;text-align:center">${vy} 年 ${String(vm+1).padStart(2,'0')} 月</h2>
          <button class="period-nav" data-action="period-month-next" aria-label="下一月">›</button>
        </header>
        <div class="period-week">
          ${['日','一','二','三','四','五','六'].map(w=>`<div class="period-week-cell">${w}</div>`).join('')}
        </div>
        <div class="period-grid">
          ${cells.join('')}
        </div>
        <div class="period-legend">
          <span><i class="dot-period"></i> 经期</span>
          <span><i class="dot-pred"></i> 预测</span>
          <span><i class="dot-today"></i> 今天</span>
        </div>
      </div>

      <!-- 历史记录 -->
      <div class="card">
        <header class="card-head">
          <h2 class="card-title">历史记录</h2>
          <span class="card-meta">${s.records.length} 次</span>
        </header>
        ${s.records.length === 0 ? `
          <div class="empty-state" style="padding:24px 0">
            <p>还没有记录，点右下 + 加第一条</p>
          </div>
        ` : `
          <div class="period-history">
            ${s.records.slice().reverse().map((r, idx, arr) => {
              const ls = parseDate(r.start);
              const le = r.end ? parseDate(r.end) : null;
              const days = le ? (daysBetween(ls, le) + 1) : '?';
              // 间隔 = 与前一条的 start 相差
              const origIdx = s.records.length - 1 - idx;
              const prev = origIdx > 0 ? s.records[origIdx-1] : null;
              const gap = prev ? daysBetween(parseDate(prev.start), ls) : null;
              return `
                <div class="period-row" data-period-row="${r.id}">
                  <div class="period-row-main">
                    <div class="period-row-date">${escapeHtml(r.start)}${r.end ? ` → ${escapeHtml(r.end)}` : ' → 至今'}</div>
                    <div class="period-row-meta">
                      <span>${days} 天</span>
                      ${gap !== null ? `<span class="muted">· 间隔 ${gap} 天</span>` : ''}
                      ${r.note ? `<span class="muted">· ${escapeHtml(r.note)}</span>` : ''}
                    </div>
                  </div>
                  <div class="period-row-actions">
                    <button class="btn-icon" data-action="period-edit" data-id="${r.id}" title="编辑">编辑</button>
                    <button class="btn-icon" data-action="period-del" data-id="${r.id}" title="删除">删除</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `}
      </div>

      <!-- 浮动 + 按钮 -->
      <button class="fab-add" data-action="period-add" title="记录一条经期">+</button>
    </section>
  `;
}

// ===== 经期模块交互 =====
function periodAdjustCycle(delta){
  const cur = STATE.period.cycleDays || 28;
  const v = Math.max(20, Math.min(45, cur + delta));
  STATE.period.cycleDays = v;
  saveState();
  renderRoute();
}
function periodShiftMonth(delta){
  let m = window._periodViewMonth + delta;
  let y = window._periodViewYear;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  window._periodViewMonth = m;
  window._periodViewYear = y;
  renderRoute();
}
function openPeriodEditor(existingId){
  const rec = existingId ? STATE.period.records.find(r => r.id === existingId) : null;
  // 弹窗
  closeNotePopover(); // 复用通用弹窗逻辑（如果有的话）
  // 直接做个小弹窗
  let pop = document.getElementById('period-editor-pop');
  if(pop) pop.remove();
  pop = document.createElement('div');
  pop.id = 'period-editor-pop';
  pop.className = 'popover period-editor';
  const start = rec ? rec.start : todayStr();
  const end = rec && rec.end ? rec.end : '';
  const note = rec ? (rec.note||'') : '';
  pop.innerHTML = `
    <div class="cpp-title">${rec ? '编辑经期记录' : '记录一条经期'}</div>
    <div class="cpp-row">
      <label>开始</label>
      <input type="date" id="pe-start" value="${start}" />
    </div>
    <div class="cpp-row">
      <label>结束</label>
      <input type="date" id="pe-end" value="${end}" placeholder="还在继续则留空" />
    </div>
    <div class="cpp-row">
      <label>备注</label>
      <input type="text" id="pe-note" value="${escapeHtml(note)}" placeholder="可选：症状、强度…" maxlength="40" />
    </div>
    <div class="cpp-actions">
      <button class="cpp-btn cpp-cancel" id="pe-cancel">取消</button>
      <button class="cpp-btn cpp-apply" id="pe-save">${rec ? '保存' : '记下来'}</button>
    </div>
  `;
  document.body.appendChild(pop);
  // 定位（屏幕中央偏下）
  pop.style.position = 'fixed';
  pop.style.left = '50%';
  pop.style.top = '180px';
  pop.style.transform = 'translateX(-50%)';
  pop.style.zIndex = 130;

  const cleanup = () => { pop.remove(); };
  pop.querySelector('#pe-cancel').onclick = cleanup;
  pop.querySelector('#pe-save').onclick = () => {
    const s = pop.querySelector('#pe-start').value;
    const e = pop.querySelector('#pe-end').value;
    const n = pop.querySelector('#pe-note').value.trim();
    if(!s){ toast('请选开始日期'); return; }
    if(e && e < s){ toast('结束日期不能早于开始'); return; }
    if(rec){
      rec.start = s;
      rec.end = e || '';
      rec.note = n;
    } else {
      STATE.period.records.push({ id: uid(), start: s, end: e || '', note: n });
    }
    saveState();
    cleanup();
    toast('已保存');
    renderRoute();
  };
  // 点外面关掉
  setTimeout(() => {
    const close = (ev) => {
      if(pop.contains(ev.target)) return;
      cleanup();
      document.removeEventListener('mousedown', close, true);
    };
    document.addEventListener('mousedown', close, true);
  }, 0);
}
function periodDelete(id){
  const rec = STATE.period.records.find(r => r.id === id);
  if(!rec) return;
  if(!confirm(`删除 ${rec.start}${rec.end ? ' → '+rec.end : ''} 这条记录？`)) return;
  STATE.period.records = STATE.period.records.filter(r => r.id !== id);
  saveState();
  toast('已删除');
  renderRoute();
}

// ===== 存钱账本模块 =====
const FIN_INCOME_CATS  = ['课时','兼职','家人给','退款','其他'];
const FIN_EXPENSE_CATS = ['餐饮','交通','购物','居家','学习','医疗','娱乐','其他'];

function financeStats(){
  const entries = (STATE.finance.entries||[])
    .filter(e => e && typeof e.date === 'string' && e.date)
    .slice()
    .sort((a,b)=> b.date.localeCompare(a.date));   // 新的在前

  // 全局余额：从全部 entries 算（替代 seed 写死的 balance）
  let balance = 0;
  entries.forEach(e => {
    if(e.type === 'income') balance += Number(e.amount)||0;
    else if(e.type === 'expense') balance -= Number(e.amount)||0;
  });

  // 本月窗口
  const today = parseDate(todayStr());
  const ym = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  let monthIn = 0, monthOut = 0;
  entries.forEach(e => {
    if(!e.date.startsWith(ym)) return;
    if(e.type === 'income') monthIn += Number(e.amount)||0;
    else if(e.type === 'expense') monthOut += Number(e.amount)||0;
  });
  const monthNet = monthIn - monthOut;

  return {
    entries, balance, goal: STATE.finance.goal || 20000,
    monthIn, monthOut, monthNet, monthLabel: ym,
  };
}

function renderFinance(){
  const r = ROUTES.finance;

    if(!e.date.startsWith(s.monthLabel)) return;
    catCount[e.category] = (catCount[e.category]||0) + 1;

  const topCats = Object.entries(catCount)

        </div>
      </div>

      <!-- 本月汇总 -->
      <div class="card">
        <header class="card-head">
          <h2 class="card-title">本月汇总</h2>
          <span class="card-meta">${s.monthLabel}</span>

        <div class="fin-summary">
          <div class="fin-sum-cell in">

/* ============================================================
   Python 刷题（Pyodide 沙箱 + 内置题库 + AI 变体）
   ============================================================ */
const PY_PYODIDE_VERSION = 'v0.26.2';
const PY_PYODIDE_BASE = `https://cdn.jsdelivr.net/pyodide/${PY_PYODIDE_VERSION}/full/`;

async function ensurePyodide(){
  if(STATE.python.pyodideReady) return STATE.python.pyodide;
  if(STATE.python.pyodideLoading) return STATE.python.pyodideLoading;
  STATE.python.pyodideLoading = new Promise((resolve, reject) => {
    const onLoad = () => {
      window.loadPyodide({ indexURL: PY_PYODIDE_BASE }).then(py => {
        STATE.python.pyodide = py;
        STATE.python.pyodideReady = true;
        resolve(py);
      }).catch(reject);
    };
    if(typeof window.loadPyodide === 'function'){
      onLoad();
      return;
    }
    const s = document.createElement('script');
    s.src = PY_PYODIDE_BASE + 'pyodide.js';
    s.onload = onLoad;
    s.onerror = () => reject(new Error('Pyodide 加载失败（请检查网络）'));
    document.head.appendChild(s);
  });
  return STATE.python.pyodideLoading;
}

async function runPythonCases(code, cases){
  const py = await ensurePyodide();
  const results = [];
  for(const c of cases){
    let stdout = '';
    py.setStdout({ batched: (s) => { stdout += s + '\n'; }});
    py.setStderr({ batched: (s) => { stdout += s + '\n'; }});
    try{
      let program = code;
      if(c.stdin){
        program = `import sys, io
sys.stdin = io.StringIO(${JSON.stringify(c.stdin)})
${code}
`;
      }
      await py.runPythonAsync(program);
      const got = stdout.replace(/\n+$/, '');
      const pass = got.trim() === c.expected.trim();
      results.push({ name:c.name, pass, got, expected:c.expected });
    }catch(e){
      results.push({ name:c.name, pass:false, error:String(e.message || e), got: stdout });
    }
  }
  py.setStdout({ batched: () => {} });
  py.setStderr({ batched: () => {} });
  return results;
}

function pyGetProblemById(id){
  // 内置题库
  const builtin = PY_PROBLEMS_BY_ID[id];
  if(builtin) return builtin;
  // AI 变体
  return STATE.python.variants.find(v => v.id === id);
}

/* 扫 STATE.course.Python 所有文档，提取纯文本作为 AI 出题素材 */
function pyExtractNotes(){
  const docs = (STATE.course && STATE.course.Python) || [];
  if(!docs.length) return '';
  const parts = [];
  for(const d of docs){
    const blocks = d.blocks || [];
    const texts = [];
    for(const b of blocks){
      if(['h1','h2','h3','p','list','code'].includes(b.type)){
        const t = String(b.text||'').replace(/<[^>]+>/g,'').trim();
        if(t) texts.push(t);
      }
    }
    if(texts.length){
      parts.push(`《${d.title || '未命名'}》\n${texts.join('\n')}`);
    }
  }
  return parts.join('\n\n');
}

function pyAllProblems(){
  return [...PY_PROBLEMS, ...STATE.python.variants];

function pyTodayKey(){
  return new Date().toISOString().slice(0,10);
}

function pyTodayProgress(){
  // 防御：旧 localStorage 没有 progress 字段
  if(!STATE.python.progress){
    STATE.python.progress = {solved:{},streakDays:0,totalSolved:0,lastSolvedDate:null,weakness:{},today:null,difficulty:'beginner',source:'builtin',aiCache:{}};
  }
  const today = STATE.python.progress.today;
  const k = pyTodayKey();
  if(!today || today.date !== k){
    // 每日 5 题：按难度档位从内置库里抽
    const diff = STATE.python.progress.difficulty || 'beginner';
    const levelSet = diff === 'beginner' ? [1,1,1,2,2] : diff === 'intermediate' ? [1,2,2,3,3] : [1,2,3,4,5];
    const ids = [];
    for(const lv of levelSet){
      // 优先从未做过的抽
      let candidatePool = PY_PROBLEMS.filter(p => p.level === lv && !ids.includes(p.id) && !STATE.python.progress.solved[p.id]);
      if(candidatePool.length === 0) candidatePool = PY_PROBLEMS.filter(p => p.level === lv && !ids.includes(p.id));
      if(candidatePool.length === 0) continue;
      ids.push(candidatePool[Math.floor(Math.random()*candidatePool.length)].id);
    }
    // 不足 5 道就允许重复
    while(ids.length < 5){
      const pool = PY_PROBLEMS.filter(p => !ids.includes(p.id));
      if(pool.length === 0) break;
      ids.push(pool[Math.floor(Math.random()*pool.length)].id);
    }
    STATE.python.progress.today = { date:k, problemIds:ids, results:ids.map(()=>({status:'pending', code:'', attempts:0})) };
    STATE.python.progress.source = 'builtin';
    saveState();
  }
  return STATE.python.progress.today;
}

function pyStreakUpdate(){
  const k = pyTodayKey();
  const last = STATE.python.progress.lastSolvedDate;
  const solved = STATE.python.progress.today.results.filter(r => r.status==='solved').length;
  if(solved === 0) return;
  if(last === k) return;  // 当日已计过
  if(!last){
    STATE.python.progress.streakDays = 1;
  } else {
    const lastD = new Date(last);
    const todayD = new Date(k);
    const diff = Math.round((todayD - lastD) / 86400000);
    STATE.python.progress.streakDays = diff === 1 ? STATE.python.progress.streakDays + 1 : 1;
  }
  STATE.python.progress.lastSolvedDate = k;
}

async function pySubmit(){
  const t = pyTodayProgress();
  const idx = t._activeIdx ?? 0;
  const problem = pyGetProblemById(t.problemIds[idx]);
  const code = document.getElementById('py-code').value;
  const resultEl = document.getElementById('py-result');

  resultEl.innerHTML = '<div class="py-result-pending">正在沙箱中运行代码…</div>';
  try{

    const allPass = cases.every(c => c.pass);
    t.results[idx] = { status: allPass ? 'solved':'failed', code, attempts: (t.results[idx].attempts||0)+1, lastCases: cases };
    if(allPass){

      (problem.tags||[]).forEach(tag => {

2. 中文题目，标点用全角中文
3. 每道题配 3-4 个测试用例（含边界）
4. 难度符合档位要求（入门：变量/输入输出/if/for；基础：字典/列表/函数；进阶：递归/算法）

严格返回 JSON 数组（不要 Markdown 包裹、不要任何解释文字）：
[
  {
    "title": "...",
    "prompt": "...",
    "starterCode": "...",
    "referenceSolution": "...",
    "judgeCases": [{"name":"...", "stdin":"...", "expected":"..."}],
    "hint": "...",
    "explanation": "...",
    "level": 1,
    "tags": ["..."]
  },
  ... 共 5 道
]`;
    const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': 'Bearer '+cfg.apiKey },
      body: JSON.stringify({
        model:'deepseek-chat',
        messages:[
          {role:'system', content:'你是 Python 出题老师。严格按 JSON 数组返回 5 道题，无任何多余文字。'},
          {role:'user', content:prompt},
        ],
        temperature:0.6,
      }),
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    let text = data.choices[0].message.content.trim();
    text = text.replace(/^```(?:json)?\s*/i,'').replace(/```$/,'').trim();
    let arr;
    try{ arr = JSON.parse(text); }
    catch(e){ throw new Error('返回格式不合法：'+text.slice(0,200)); }
    if(!Array.isArray(arr) || arr.length === 0) throw new Error('返回不是数组');

    // 存到 variants，给每道题加 id 和 meta
    const newIds = [];
    const ts = Date.now();
    arr.slice(0,5).forEach((q, i) => {
      const id = 'n_' + ts.toString(36) + '_' + i;
      const problem = {
        id,
        level: Number(q.level) || (diff==='beginner'?1:diff==='intermediate'?2:3),
        tags: Array.isArray(q.tags) ? q.tags : ['AI生成'],
        time: 10,
        title: q.title || `AI 题 ${i+1}`,
        prompt: q.prompt || '',
        starterCode: q.starterCode || '',
        referenceSolution: q.referenceSolution || '',
        judgeCases: Array.isArray(q.judgeCases) ? q.judgeCases : [],
        hint: q.hint || '',
        explanation: q.explanation || '',
        aiGenerated: true,
        generatedAt: ts,
      };
      STATE.python.variants.unshift(problem);
      newIds.push(id);
    });
    // 替换今日 5 题
    STATE.python.progress.today = {
      date: todayKey,
      problemIds: newIds,
      results: newIds.map(()=>({status:'pending', code:'', attempts:0})),
    };
    STATE.python.progress.source = 'notes';
    STATE.python.progress.aiCache = STATE.python.progress.aiCache || {};
    STATE.python.progress.aiCache[todayKey] = true;
    STATE.python.progress.today._activeIdx = 0;
    saveState();
    toast('已基于备课生成 ' + newIds.length + ' 道题');
    renderRoute();
  }catch(e){
    toast('生成失败：'+String(e.message||e));
  }
}

function openFinanceEditor(existingId, presetType){
  const rec = existingId ? STATE.finance.entries.find(e => e.id === existingId) : null;
  closeNotePopover();
  let pop = document.getElementById('fin-editor-pop');
  if(pop) pop.remove();
  pop = document.createElement('div');
  pop.id = 'fin-editor-pop';
  pop.className = 'popover fin-editor';
  const initialType = rec ? rec.type : (presetType || 'expense');
  const cats = initialType === 'income' ? FIN_INCOME_CATS : FIN_EXPENSE_CATS;
  const title = rec
    ? '编辑账目'
    : (initialType === 'income' ? '记一笔收入' : '记一笔支出');
  pop.innerHTML = `
    <div class="cpp-title">${title}</div>
    <div class="cpp-type">
      <button class="cpp-type-btn in ${initialType==='income'?'on':''}" data-type="income">收入</button>
      <button class="cpp-type-btn out ${initialType==='expense'?'on':''}" data-type="expense">支出</button>
    </div>
    <div class="cpp-row">
      <label>金额</label>
      <input class="cpp-amount-input" id="fe-amount" type="number" min="0" step="0.01"
             value="${rec?rec.amount:''}" placeholder="0.00"/>
    </div>
    <div class="cpp-row">
      <label>分类</label>
      <select class="select" id="fe-cat">
        ${cats.map(c=>`<option value="${escapeHtml(c)}" ${rec&&rec.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="cpp-row">
      <label>日期</label>
      <input type="date" id="fe-date" value="${rec ? rec.date : todayStr()}"/>
    </div>
    <div class="cpp-row">
      <label>备注</label>
      <input type="text" id="fe-note" value="${escapeHtml(rec?(rec.note||''):'')}" maxlength="40" placeholder="可选"/>
    </div>
    <div class="cpp-actions">
      <button class="cpp-btn cpp-cancel" id="fe-cancel">取消</button>
      <button class="cpp-btn cpp-apply" id="fe-save">${rec?'保存':'记一笔'}</button>
    </div>
  `;
  document.body.appendChild(pop);
  pop.style.position = 'fixed';
  pop.style.left = '50%';
  pop.style.top = '140px';
  pop.style.transform = 'translateX(-50%)';
  pop.style.zIndex = '130';

  const cleanup = () => { pop.remove(); };
  // 类型切换：换分类下拉
  pop.querySelectorAll('.cpp-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = btn.dataset.type;
      if(t === rec?.type) return;
      pop.querySelectorAll('.cpp-type-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      const newCats = t === 'income' ? FIN_INCOME_CATS : FIN_EXPENSE_CATS;
      const sel = pop.querySelector('#fe-cat');
      sel.innerHTML = newCats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    });
  });

  pop.querySelector('#fe-cancel').onclick = cleanup;
  pop.querySelector('#fe-save').onclick = () => {
    const t = pop.querySelector('.cpp-type-btn.on').dataset.type;
    const amount = parseFloat(pop.querySelector('#fe-amount').value);
    const cat = pop.querySelector('#fe-cat').value;
    const date = pop.querySelector('#fe-date').value;
    const note = pop.querySelector('#fe-note').value.trim();
    if(!amount || amount <= 0){ toast('请填金额'); return; }
    if(!date){ toast('请选日期'); return; }
    if(rec){
      rec.type = t;
      rec.amount = amount;
      rec.category = cat;
      rec.date = date;
      rec.note = note;
    } else {
      STATE.finance.entries.unshift({ id: uid(), type: t, amount, category: cat, date, note });
    }
    saveState();
    cleanup();
    toast(rec?'已保存':'已记一笔');
    renderRoute();
  };

  setTimeout(() => {
    const close = (ev) => {
      if(pop.contains(ev.target)) return;
      cleanup();
      document.removeEventListener('mousedown', close, true);
    };
    document.addEventListener('mousedown', close, true);
  }, 0);

  // 自动聚焦金额框
  setTimeout(() => {
    const a = pop.querySelector('#fe-amount');
    if(a) a.focus();
  }, 50);
}

function financeDelete(id){
  const rec = STATE.finance.entries.find(e => e.id === id);
  if(!rec) return;
  const when = rec.date;
  const tag = rec.type === 'income' ? '收' : '支';
  if(!confirm(`删除这笔「${tag} · ${rec.category} · ¥${Number(rec.amount||0)} · ${when}」？`)) return;
  STATE.finance.entries = STATE.finance.entries.filter(e => e.id !== id);
  saveState();
  toast('已删除');
  renderRoute();
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// ===== 日期工具（经期模块用）=====
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate(str){
  // 'YYYY-MM-DD' → Date (本地零点)
  if(!str) return null;
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function fmtDateObj(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(d, n){
  const x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  return x;
}
function daysBetween(d1, d2){
  // 按"日历日"差，不按时间戳
  const a = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
  const b = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
  return Math.round((b - a) / 86400000);
}

// ===== 经期数据统计（基于 records + 用户周期）=====
function periodStats(){
  // 防御：跳过 start 不是字符串的脏记录（旧 seed 数字时间戳残留 / 用户编辑损坏）
  const records = (STATE.period.records||[])
    .filter(r => r && typeof r.start === 'string' && r.start)
    .slice()
    .sort((a,b)=> a.start.localeCompare(b.start));
  const cycleDays = STATE.period.cycleDays || 28;
  const today = parseDate(todayStr());

  // 距下次/当前在经期判断
  let inPeriod = null;        // {record, dayIdx, daysLeft}
  let nextStart = null;       // 预测下次起始 Date
  let daysUntilNext = null;

  // 当前是否在经期（看最后一条记录，start <= 今天 <= end）
  if(records.length){
    const last = records[records.length-1];
    const ls = parseDate(last.start);
    const le = last.end ? parseDate(last.end) : null;
    if(ls <= today && (!le || le >= today)){
      // 在经期
      inPeriod = {
        record: last,
        dayIdx: daysBetween(ls, today) + 1,
        daysLeft: le ? daysBetween(today, le) : null, // 还没填结束日
      };
    }
  }

  if(!inPeriod && records.length){
    const last = records[records.length-1];
    const ls = parseDate(last.start);
    nextStart = addDays(ls, cycleDays);
    daysUntilNext = daysBetween(today, nextStart);
  }

  // 平均天数（最近 3 条）
  let avgPeriodDays = null;
  const lenRecs = records.filter(r => r.end).slice(-3);
  if(lenRecs.length){
    const total = lenRecs.reduce((s,r) => s + (daysBetween(parseDate(r.start), parseDate(r.end))+1), 0);
    avgPeriodDays = Math.round(total / lenRecs.length);
  }

  return {
    records, cycleDays, today,
    inPeriod, nextStart, daysUntilNext,
    avgPeriodDays,
  };
}
function formatDate(s){
  const d = new Date(s);
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 周${w}`;
}
function formatShortDate(s){
  const d = new Date(s);
  if(isNaN(d.getTime())) return s;
  const today = new Date();
  if(d.toDateString()===today.toDateString()) return '今天';
  const tomorrow = new Date(today.getTime()+86400000);
  if(d.toDateString()===tomorrow.toDateString()) return '明天';
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function greetingWord(){
  const h = new Date().getHours();
  if(h<5) return '夜深了，记得休息';
  if(h<9) return '新的一天，从简单的事开始';
  if(h<12) return '早间节奏，做最有难度的那件';
  if(h<14) return '午饭时间，适当放空';
  if(h<18) return '下午推进，把待确认处理掉';
  if(h<22) return '晚上收尾，给明天留 1 件小事';
  return '夜深了，早点睡';
}
function relativeTime(t){
  const s = Math.floor((Date.now()-t)/1000);
  if(s<60) return '刚刚';
  if(s<3600) return `${Math.floor(s/60)} 分钟前`;
  if(s<86400) return `${Math.floor(s/3600)} 小时前`;
  if(s<7*86400) return `${Math.floor(s/86400)} 天前`;
  return new Date(t).toLocaleDateString('zh-CN');
}
function dataSize(){
  const s = JSON.stringify(STATE).length;
  if(s<1024) return s + ' B';
  if(s<1024*1024) return (s/1024).toFixed(1) + ' KB';
  return (s/1024/1024).toFixed(2) + ' MB';
}
function toast(msg, ms=1800){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

function importData(file){
  const r = new FileReader();
  r.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.meta) throw new Error('不是有效的工作台备份');
      if(!confirm('导入会覆盖当前所有数据，确定？建议先点"导出 JSON"备份当前数据。')) return;
      STATE = data; saveState(); renderAll(); toast('已导入');
    }catch(err){ toast('导入失败：' + err.message); }
  };
  r.readAsText(file);
}

function doDeleteCourse(code){
  const docs = STATE.course[code] || [];

  if(courseMultiSelected.size === 0){ toast('还没选文档'); return; }
  const docs = (STATE.course[activeCourse] || []).filter(d => courseMultiSelected.has(d.id));
  if(!docs.length){ toast('没有有效文档'); return; }
  // 按 Markdown 格式导出（合并成一个 .md 文件，标题分隔）
  const md = docs.map(d => `# ${d.title || '未命名'}\n\n${docToMarkdown(d)}`).join('\n\n---\n\n');
  const stamp = new Date().toISOString().slice(0,10);
  const blob = new Blob([md], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${activeCourse}_批量导出_${docs.length}份_${stamp}.md`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  toast(`已导出 ${docs.length} 份文档到 Markdown`);
}

      </div>
    </section>
  `;
}

// ============= 课程备课 · 导入外部文件（HTML / PDF / Word） =============
function pickAndImportDocFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.html,.htm,.docx,.doc,.txt,.md';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    importDocFile(f);
  };
  inp.click();
}

async function importDocFile(file){
  const name = file.name;
  const ext = (name.split('.').pop()||'').toLowerCase();
  try{
    let blocks = [];
    let title = name.replace(/\.[^.]+$/, '');
    if(ext === 'html' || ext === 'htm'){
      const html = await file.text();
      const r = importHtmlToBlocks(html);
      blocks = r.blocks;
      if(r.title) title = r.title;
    } else if(ext === 'md' || ext === 'txt'){
      const md = await file.text();
      // 提取首行 H1 作为标题（# 开头）
      const firstH1 = md.split(/\r?\n/).find(l => /^#\s/.test(l.trim()));
      if(firstH1 && (!title || title === name.replace(/\.[^.]+$/, ''))){
        title = firstH1.replace(/^#\s*/, '').slice(0, 60);
      }
      blocks = importMarkdownToBlocks(md);
    } else if(ext === 'docx'){
      try{
        const buf = await file.arrayBuffer();
        toast('正在解析 Word（首次需联网加载解析器）…');
        blocks = await importDocxToBlocks(buf);
      }catch(e){
        toast('Word 解析失败：' + (e.message||e));
        return;
      }
    } else if(ext === 'doc'){
      toast('旧版 .doc 二进制不支持，请用 Word 打开后另存为 .docx 或 HTML');
      return;
    } else {
      toast('不支持的文件类型：' + ext);
      return;
    }
    if(!blocks.length){
      toast('文件里没识别到正文内容');
      return;
    }
    // 创建文档
    const doc = {
      id: 'd_'+Math.random().toString(36).slice(2,9),
      course: activeCourse,
      title,
      blocks,
      tags: ['导入'],
      createdAt: Date.now(),
      updatedAt: Date.now(),
      version: 1,
      defaults: {},
    };
    STATE.course[activeCourse] = STATE.course[activeCourse] || [];
    STATE.course[activeCourse].unshift(doc);
    saveState();
    activeDocId = doc.id;
    renderRoute();
    // 调试提示：告知用户图片数 / blocks 数
    const dbg = window._lastImportDebug || {};
    const debugInfo = (ext === 'docx' && dbg.docx)
      ? `（mammoth 回调 ${dbg.docx.imageCalled} 次 / HTML 含 ${dbg.docx.imgTags} 个 img / 最终生成 ${dbg.docx.imageBlocks} 个图片块）`
      : '';
    console.log('[import result]', { ext, title, blocks: blocks.length, debug: dbg });
    toast(`已导入 ${blocks.length} 块到「${title}」${debugInfo}`, 8000);
  }catch(e){
    console.error('[import]', e);
    toast('导入失败：' + (e.message||e));
  }
}

// HTML → blocks
function importHtmlToBlocks(html){
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  // 提取标题
  let title = '';
  const h1 = doc.querySelector('h1, h2, title');
  if(h1) title = (h1.textContent||'').trim().slice(0, 60);
  // 预处理：把 <p> 里嵌套的 <img> 提升为顶级元素（mammoth 会把图片包在 <p> 里）
  doc.querySelectorAll('p').forEach(p => {
    if(!p.querySelector('img')) return;
    const parent = p.parentNode;
    if(!parent) return;
    const newNodes = [];
    let buf = document.createElement('p');
    Array.from(p.childNodes).forEach(node => {
      if(node.nodeType === 1 && node.tagName.toUpperCase() === 'IMG'){
        if(buf.childNodes.length){ newNodes.push(buf); buf = document.createElement('p'); }
        newNodes.push(node); // img 元素直接推到顶级
      } else {
        buf.appendChild(node.cloneNode(true));
      }
    });
    if(buf.childNodes.length) newNodes.push(buf);
    newNodes.forEach(n => parent.insertBefore(n, p));
    parent.removeChild(p);
  });
  // 遍历 body 内容
  const blocks = [];
  const root = doc.body || doc.documentElement;
  function inlineToHtml(el){
    // 把一个元素的内联格式转 inline span 字符串
    if(!el) return '';
    if(el.nodeType === 3) return escapeHtml(el.textContent);
    if(el.nodeType !== 1) return '';
    const tag = el.tagName.toUpperCase();
    if(tag === 'BR') return '<br>';
    const children = Array.from(el.childNodes).map(inlineToHtml).join('');
    if(tag === 'B' || tag === 'STRONG') return `<span style="font-weight:700">${children}</span>`;
    if(tag === 'I' || tag === 'EM') return `<span style="font-style:italic">${children}</span>`;
    if(tag === 'U') return `<span style="text-decoration:underline">${children}</span>`;
    if(tag === 'A'){
      const href = el.getAttribute('href')||'';
      const txt = children || escapeHtml(el.textContent);
      return `<a href="${escapeAttr(href)}" target="_blank" rel="noopener">${txt}</a>`;
    }
    if(tag === 'SPAN' && el.style && el.style.color){
      const c = el.style.color.replace(/"/g,'');
      return `<span style="color:${c}">${children}</span>`;
    }
    if(tag === 'CODE') return `<code>${children}</code>`;
    return children;  // 其他标签保留子内容
  }
  function walk(el){
    if(!el) return;
    const tag = el.tagName ? el.tagName.toUpperCase() : '';
    if(/^H[1-6]$/.test(tag)){
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type: tag.toLowerCase(), text: inlineToHtml(el).replace(/^<[^>]+>|<\/[^>]+>$/g,'')});
      return;
    }
    if(tag === 'P'){
      const txt = inlineToHtml(el);
      if(txt.trim()) blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'p', text: txt});
      return;
    }
    if(tag === 'UL' || tag === 'OL'){
      const ordered = tag === 'OL';
      el.querySelectorAll(':scope > li').forEach(li => {
        blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'list', ordered, text: inlineToHtml(li)});
      });
      return;
    }
    if(tag === 'BLOCKQUOTE'){
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'quote', text: inlineToHtml(el)});
      return;
    }
    if(tag === 'PRE'){
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'code', text: el.textContent});
      return;
    }
    if(tag === 'IMG'){
      const src = el.getAttribute('src')||'';
      const alt = el.getAttribute('alt')||'';
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'image', src, alt, text: alt});
      return;
    }
    if(tag === 'A' && el.children.length === 0){
      // 裸链接：作为 link 块
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'link', href: el.getAttribute('href')||'', title: el.textContent.trim(), text: el.textContent});
      return;
    }
    // 容器（div/section/article）：递归
    if(el.children){
      Array.from(el.children).forEach(walk);
    } else if(el.textContent && el.textContent.trim()){
      blocks.push({id:'b_'+Math.random().toString(36).slice(2,8), type:'p', text: escapeHtml(el.textContent.trim())});
    }
  }
  Array.from(root.children).forEach(walk);
  return {title, blocks};
}

// Markdown → blocks（完整版：标题/列表/任务/引用/代码/分割线/表格/inline 格式）
function importMarkdownToBlocks(md){
  const blocks = [];
  const lines = md.split(/\r?\n/);
  let i = 0;
  while(i < lines.length){
    const line = lines[i];
    const t = line.trim();
    if(!t){ i++; continue; }

    // 代码块（```）
    if(/^```/.test(t)){
      const code = [];
      const lang = t.replace(/^```/, '').trim();
      i++;
      while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      blocks.push({id:bid(), type:'code', text: code.join('\n'), lang: lang||''});
      i++;
      continue;
    }

    // 标题 # ## ###
    if(/^#{1,6}\s/.test(t)){
      const level = t.match(/^(#{1,6})/)[1].length;
      blocks.push({id:bid(), type:'h'+Math.min(level,3), text: t.replace(/^#+\s/, '')});
      i++;
      continue;
    }

    // 分割线 ---
    if(/^[-*_]{3,}$/.test(t)){
      blocks.push({id:bid(), type:'p', text:'———'});
      i++;
      continue;
    }

    // 任务列表 - [ ] / - [x]
    if(/^[-*]\s+\[[ xX]\]\s/.test(t)){
      const done = /\[[xX]\]/.test(t);
      blocks.push({id:bid(), type:'list', ordered:false, text: t.replace(/^[-*]\s+\[[ xX]\]\s/, ''), checked: done});
      i++;
      continue;
    }

    // 无序列表 - / *
    if(/^[-*]\s/.test(t)){
      blocks.push({id:bid(), type:'list', ordered:false, text: inlineMdToHtml(t.replace(/^[-*]\s/, ''))});
      i++;
      continue;
    }

    // 有序列表 1. 2.
    if(/^\d+\.\s/.test(t)){
      blocks.push({id:bid(), type:'list', ordered:true, text: inlineMdToHtml(t.replace(/^\d+\.\s/, ''))});
      i++;
      continue;
    }

    // 引用 > （多行连续）
    if(/^>\s/.test(t)){
      const quoteLines = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){
        quoteLines.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      blocks.push({id:bid(), type:'quote', text: inlineMdToHtml(quoteLines.join('\n'))});
      continue;
    }

    // 表格 | col1 | col2 |
    if(/^\|.*\|$/.test(t) && i+1 < lines.length && /^\|?[\s:|-]+\|?$/.test(lines[i+1].trim())){
      const tableLines = [t];
      i++;
      while(i < lines.length && /^\|.*\|$/.test(lines[i])){ tableLines.push(lines[i]); i++; }
      blocks.push({id:bid(), type:'table', rows: parseMdTable(tableLines)});
      continue;
    }

    // 块级图片 ![alt](url) —— 整行只有图片声明
    const imgMatch = t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    if(imgMatch){
      const alt = imgMatch[1] || '';
      const url = imgMatch[2];
      // 远程 URL / data URL 直接用；本地相对路径提示用户改用 data URL 或上传
      const isRemote = /^(https?:\/\/|data:)/.test(url);
      blocks.push({
        id: bid(),
        type:'image',
        src: isRemote ? url : '',
        alt,
        url: isRemote ? url : url,
        pendingUpload: !isRemote,
      });
      i++;
      continue;
    }

    // 普通段落（合并连续非空非特殊行）
    const paraLines = [line];
    i++;
    while(i < lines.length){
      const nx = lines[i];
      const ntx = nx.trim();
      if(!ntx) break;
      if(/^[#>\-*`|\d+\.|```]/.test(ntx)) break;
      paraLines.push(nx);
      i++;
    }
    blocks.push({id:bid(), type:'p', text: inlineMdToHtml(paraLines.join('\n'))});
  }
  return blocks;
}

// 行内 Markdown → HTML span
function inlineMdToHtml(s){
  if(!s) return '';
  // 1. 先把行内图片替换成占位（避免 escapeHtml 转义 URL 里的 & 等）
  let h = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) => {
    return `\x00IMG${btoa(unescape(encodeURIComponent(JSON.stringify({alt,url}))))}\x00`;
  });
  // 2. escape
  h = escapeHtml(h);
  // 3. inline 格式
  h = h.replace(/`([^`]+)`/g, (_, x) => `<code>${x}</code>`);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (_, txt, url) => `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, (_, x) => `<span style="font-weight:700">${x}</span>`);
  h = h.replace(/(^|[^*])\*([^*]+)\*/g, (_, p, x) => `${p}<span style="font-style:italic">${x}</span>`);
  h = h.replace(/~~([^~]+)~/g, (_, x) => `<span style="text-decoration:line-through">${x}</span>`);
  // 4. 把图片占位还原
  h = h.replace(/\x00IMG([A-Za-z0-9+/=]+)\x00/g, (_, enc) => {
    try{
      const obj = JSON.parse(decodeURIComponent(escape(atob(enc))));
      return `<img src="${escapeAttr(obj.url)}" alt="${escapeAttr(obj.alt)}" style="max-width:100%;max-height:240px;display:inline-block;vertical-align:middle;margin:0 4px;border-radius:6px">`;
    }catch(e){ return ''; }
  });
  return h;
}

// Markdown 表格 → 行/列二维数组
function parseMdTable(lines){
  const rows = [];
  let isHeader = true;
  for(let k = 0; k < lines.length; k++){
    const ln = lines[k].trim();
    if(/^\|?[\s:|-]+\|?$/.test(ln)){ isHeader = false; continue; }  // 分隔行
    const cells = ln.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    rows.push(cells);
  }
  return rows;
}

// .docx 解析（本地 mammoth.js → 文本 → blocks）
// 文件已下载到同目录（避免 file:// 协议拦截 CDN）
const MAMMOTH_PATH = 'mammoth.browser.min.js';
let _mammothLoading = null;
async function loadMammoth(){
  if(typeof window.mammoth !== 'undefined') return window.mammoth;
  if(_mammothLoading) return _mammothLoading;
  _mammothLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = MAMMOTH_PATH;
    s.onload = () => resolve(window.mammoth);
    s.onerror = () => reject(new Error('mammoth.browser.min.js 加载失败（请确认该文件在同目录下）'));
    document.head.appendChild(s);
  });
  return _mammothLoading;
}
async function importDocxToBlocks(buf){
  const mammoth = await loadMammoth();
  let imageCount = 0;
  let imageErrors = 0;
  const result = await mammoth.convertToHtml(
    { arrayBuffer: buf },
    {
      convertImage: mammoth.images.imgElement(async (image) => {
        imageCount++;
        try{
          const dataBuffer = await image.read('base64');
          if(!dataBuffer){ imageErrors++; return { src: '' }; }
          return { src: 'data:' + image.contentType + ';base64,' + dataBuffer };
        }catch(e){
          console.warn('[import-docx] 图片提取失败:', e);
          imageErrors++;
          return { src: '' };
        }
      }),
    }
  );
  // 收集 debug 信息到 doc（用户可看）
  window._lastImportDebug = window._lastImportDebug || {};
  window._lastImportDebug.docx = {
    imgTags: (result.value.match(/<img /g)||[]).length,
    imageCalled: imageCount,
    imageErrors: imageErrors,
    warnings: (result.messages||[]).slice(0, 5).map(m => m.message || String(m)),
  };
  if(!result.value || !result.value.trim()) throw new Error('docx 文件里没识别到正文');
  const html = '<div>' + result.value + '</div>';
  const r = importHtmlToBlocks(html);
  window._lastImportDebug.docx.imageBlocks = r.blocks.filter(b=>b.type==='image').length;
  window._lastImportDebug.docx.imageBlocksWithSrc = r.blocks.filter(b=>b.type==='image' && b.src).length;
  if(!r.blocks.length) throw new Error('docx 文件里没识别到正文');
  return r.blocks;
}

              <span>v${h.version}</span>

function renderBlock(b, doc){
  const def = doc.defaults || {};
  const fmt = b.fmt || {};
  const cls = ['block', `block-${b.type}`];
  if(fmt.bold || (b.type==='p' && def.bold)) cls.push('bold');
  if(fmt.italic) cls.push('italic');
  if(fmt.underline) cls.push('underline');
  // 颜色全部走 inline span（b.text 内的 <span style>），不再用 fmt.color 整块上色
  // 字号也走 inline span，但 fmt.size 仍 push class 作 fallback（兼容旧数据 + 选区格式）
  if(fmt.size && fmt.size!=='M') cls.push('s-'+fmt.size);
  const sizeVal = fmt.size || def.size || 'M';
  // 兼容旧 v2 数据：fmt.size 加 inline font-size
  const styleParts = [];
  if(fmt.size) styleParts.push(`font-size:${sizeVal==='S'?'13px':sizeVal==='L'?'18px':sizeVal==='XL'?'22px':'15px'}`);
  const style = styleParts.length ? ` style="${styleParts.join(';')}"` : '';

  const editAttr = (b.type==='p' || b.type==='h1' || b.type==='h2' || b.type==='h3' || b.type==='list' || b.type==='quote') ? 'true' : 'false';
  const placeholder = b.type==='h1'?'标题 1':b.type==='h2'?'标题 2':b.type==='h3'?'标题 3':b.type==='list'?'列表项':b.type==='quote'?'引用':b.type==='code'?'代码...':b.type==='note'?'备注内容...':'段落...';

  let inner = '';
  if(b.type==='note'){
    const m = NOTE_META[b.level||'tip'];
    // label 单独存（支持 inline 格式）；content 存 b.text（已支持 inline span）
    const labelHTML = b.label != null ? b.label : m.label;
    inner = `<div class="note-block note-${b.level||'tip'}">
      <div class="note-icon">${icon(m.icon)}</div>
      <div class="note-body">
        <div class="note-label">${icon(m.icon,'icon-sm')} <span data-block-text="label">${labelHTML}</span> <span style="margin-left:auto;cursor:pointer;opacity:.6" data-action="cycle-note-level" data-id="${b.id}">↻ 换等级</span></div>
        <div class="note-content" contenteditable="true" data-block-id="${b.id}" data-block-text data-placeholder="${placeholder}">${b.text||''}</div>
      </div>
    </div>`;
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="${cls.join(' ')}" data-block-id="${b.id}" data-block-type="note"${style}>
        ${inner}
      </div>
    </div>`;
  }
  if(b.type==='image'){
    // debug 标签：显示 src 长度（用 data-src-len 隐藏）
    const srcLen = b.src ? b.src.length : 0;
    const debugTag = srcLen > 0
      ? `<div style="position:absolute;top:2px;right:2px;background:#E8836E;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;z-index:2;pointer-events:none">img ${Math.round(srcLen/1024)}KB</div>`
      : `<div style="position:absolute;top:2px;right:2px;background:#9AA0A6;color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;z-index:2;pointer-events:none">empty</div>`;
    inner = b.src
      ? `<div class="block-img" style="position:relative">
          ${debugTag}
          <img src="${escapeAttr(b.src)}" alt="${escapeAttr(b.alt||'')}"/>
          <div class="img-caption" data-block-id="${b.id}" data-action="edit-image-caption" data-id="${b.id}" style="cursor:pointer">${b.alt ? escapeHtml(b.alt) : '<span style="color:#9AA0A6;font-style:italic">点击添加图片说明…</span>'}</div>
        </div>`
      : `<div style="padding:32px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer;position:relative" data-action="upload-image" data-id="${b.id}">
          ${debugTag}
          <div style="margin-bottom:8px">${icon('image','icon-lg')}</div>
          <div>点此上传图片（或将图片拖到这里）</div>
          <div style="font-size:11px;margin-top:4px">建议 ≤ 2MB，自动转 base64 存到本地</div>
        </div>`;
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="${cls.join(' ')}" data-block-id="${b.id}" data-block-type="image"${style}>
        ${inner}
      </div>
    </div>`;
  }
  if(b.type==='video'){
    if(b.url){
      const isEmbed = /youtube\.com|youtu\.be|bilibili\.com|v\.qq\.com/.test(b.url);
      const embedUrl = isEmbed ? toEmbedUrl(b.url) : null;
      inner = embedUrl
        ? `<div class="block-video"><div class="vid-embed"><iframe src="${escapeAttr(embedUrl)}" allowfullscreen></iframe></div><div class="vid-caption">${escapeHtml(b.caption||b.url)}</div></div>`
        : `<div class="block-video"><video src="${escapeAttr(b.url)}" controls></video><div class="vid-caption" contenteditable="true" data-block-id="${b.id}" data-cap-field="caption" data-placeholder="视频说明...">${escapeHtml(b.caption||'')}</div></div>`;
    } else {
      inner = `<div style="padding:24px;text-align:center;color:var(--text-3);font-size:13px;cursor:pointer" data-action="set-video" data-id="${b.id}">
        <div style="margin-bottom:8px">${icon('video','icon-lg')}</div>
        <div>点此填视频链接（YouTube / B 站 / 腾讯视频 / 或本地 .mp4 链接）</div>
        <div style="font-size:11px;margin-top:4px">本地视频：把视频传到当前文件夹后填相对路径</div>
      </div>`;
    }
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="${cls.join(' ')}" data-block-id="${b.id}" data-block-type="video"${style}>
        ${inner}
      </div>
    </div>`;
  }
  if(b.type==='link'){
    inner = `<a class="block-link" href="${escapeAttr(b.url||'#')}" target="_blank" rel="noopener" data-action="edit-link" data-id="${b.id}">
      <span class="icon">${icon('link')}</span>
      <div class="block-link-text">
        <div class="link-title">${escapeHtml(b.title||b.url||'链接（点编辑）')}</div>
        <div class="link-url">${escapeHtml(b.url||'')}</div>
      </div>
    </a>`;
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="${cls.join(' ')}" data-block-id="${b.id}" data-block-type="link"${style}>
        ${inner}
      </div>
    </div>`;
  }
  if(b.type==='code'){
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <pre class="block block-code" data-block-id="${b.id}" data-block-type="code"${style}><code contenteditable="true" data-block-id="${b.id}" data-code-content>${escapeHtml(b.text||'')}</code></pre>
    </div>`;
  }
  if(b.type==='table'){
    const rows = b.rows || [];
    const headerCount = rows[0] ? rows[0].length : 0;
    const html = `<table class="block-table" data-block-id="${b.id}" data-block-type="table"${style}>
      ${rows.map((row, ri) => {
        const tag = ri === 0 ? 'th' : 'td';
        return '<tr>' + row.map(cell => {
          const align = /^:.*:$/.test(cell) ? 'center' : '';
          return `<${tag} style="${align?'text-align:center':''}">${inlineMdToHtml(cell.replace(/^:|:$/g,''))}</${tag}>`;
        }).join('') + '</tr>';
      }).join('')}
    </table>`;
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="block block-table-wrap" data-block-id="${b.id}" data-block-type="table"${style}>
        ${html}
      </div>
    </div>`;
  }
  if(b.type==='divider'){
    return `<div class="block-row" data-block-row="${b.id}">
      <div class="block-gutter">
        <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
      </div>
      <div class="block" data-block-id="${b.id}" data-block-type="divider" style="padding:14px 0"><hr style="border:0;border-top:1px solid var(--border)"/></div>
    </div>`;
  }
  // text 块
  // 列表序号：如果是 ordered 列表（fmt 有 ordered=true），按在文档中的位置计数
  let bullet = '';
  let ordinal = '';
  if(b.type==='list'){
    if(b.ordered){
      // 统计同 ordered 段（连续的 ordered 块）的位置
      let n = 1;
      const blocks = doc.blocks || [];
      const idx = blocks.indexOf(b);
      // 向前数连续 ordered
      for(let i=idx-1;i>=0;i--){
        if(blocks[i].type==='list' && blocks[i].ordered){ n++; } else break;
      }
      ordinal = String(n);
      bullet = `<span class="bullet bullet-ord">${ordinal}.</span>`;
    } else {
      bullet = '<span class="bullet">•</span>';
    }
  }
  return `<div class="block-row" data-block-row="${b.id}">
    <div class="block-gutter">
      <button data-action="block-menu" data-id="${b.id}" title="操作">${icon('drag')}</button>
    </div>
    <div class="${cls.join(' ')} ${b.type==='list'?'block-list':''}" data-block-id="${b.id}" data-block-type="${b.type}"${style}>
      ${bullet}
      <div contenteditable="true" data-block-id="${b.id}" data-block-text data-placeholder="${placeholder}" style="flex:1;outline:0;min-width:0">${b.text||''}</div>
    </div>
  </div>`;
}

function toEmbedUrl(url){
  if(/youtube\.com\/watch/.test(url)) return url.replace('/watch?v=','/embed/');
  if(/youtu\.be\//.test(url)) return 'https://www.youtube.com/embed/' + url.split('/').pop();
  if(/bilibili\.com\/video\//.test(url)){
    const id = url.split('/video/')[1]?.split('?')[0];
    return id ? `https://player.bilibili.com/player.html?bvid=${id}` : url;
  }
  if(/v\.qq\.com\//.test(url)){
    return url.replace('/x/cover/','/iframe/').replace('/x/page/','/iframe/page.html?');
  }
  return null;
}

function escapeAttr(s){return String(s||'').replace(/"/g,'&quot;');}

  const all = getAllCourseDocs();
  return all.filter(d => d.id!==doc.id && JSON.stringify(d.blocks||[]).includes(`@doc:${doc.id}`));

function findBlockInDoc(doc, id){
  return (doc.blocks||[]).find(b => b.id===id);
}

function markEditorDirty(){
  editorSaveState = 'dirty';
  const el = document.querySelector('.save-status');
  if(el){
    el.classList.remove('saved','saving');
    document.getElementById('save-text').textContent = '编辑中...';
  }
  clearTimeout(editorSaveTimer);
  editorSaveTimer = setTimeout(()=>{
    editorSaveState = 'saving';
    const el2 = document.querySelector('.save-status');
    if(el2){
      el2.classList.remove('saved');
      el2.classList.add('saving');
      document.getElementById('save-text').textContent = '保存中...';
    }
    setTimeout(()=>{
      const doc = getCurrentDoc(); if(!doc) return;
      doc.updatedAt = Date.now();
      doc.version = (doc.version||1) + 0;   // 自动保存不改 version
      saveState();
      editorSaveState = 'saved';
      const el3 = document.querySelector('.save-status');
      if(el3){
        el3.classList.remove('saving','dirty');
        el3.classList.add('saved');
        document.getElementById('save-text').textContent = '已自动保存';
      }
    }, 250);
  }, 400);
}

function updateBlockFromEditable(el){
  const id = el.dataset.blockId;
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, id); if(!b) return;
  // 文本提取（含 @ 提及转 anchor 形式保留，保存为纯文本 + 引用）
  const field = (el.dataset.blockText === 'label') ? 'label' : 'text';
  b[field] = htmlToTextForSave(el, b.type);
  markEditorDirty();
}

/* ============================================================
   撤销 / 重做：每次结构性变化之前 push 一次当前文档快照
   ============================================================ */
function pushUndo(){
  if(suppressUndoPush) return;
  const doc = getCurrentDoc(); if(!doc) return;
  try{
    const snap = JSON.parse(JSON.stringify({blocks: doc.blocks, defaults: doc.defaults, title: doc.title}));
    editorUndoStack.push(snap);
    if(editorUndoStack.length > UNDO_MAX) editorUndoStack.shift();
    editorRedoStack = [];
  }catch(e){}
}
function editorUndo(){
  if(!editorUndoStack.length){ toast('没有更多可撤销'); return; }
  const doc = getCurrentDoc(); if(!doc) return;
  const cur = JSON.parse(JSON.stringify({blocks: doc.blocks, defaults: doc.defaults, title: doc.title}));
  const prev = editorUndoStack.pop();
  editorRedoStack.push(cur);
  suppressUndoPush = true;
  doc.blocks = prev.blocks; doc.defaults = prev.defaults; doc.title = prev.title;
  suppressUndoPush = false;
  saveState(); renderRoute();
  toast('已撤销');
}
function editorRedo(){
  if(!editorRedoStack.length){ toast('没有更多可重做'); return; }
  const doc = getCurrentDoc(); if(!doc) return;
  const cur = JSON.parse(JSON.stringify({blocks: doc.blocks, defaults: doc.defaults, title: doc.title}));
  const next = editorRedoStack.pop();
  editorUndoStack.push(cur);
  suppressUndoPush = true;
  doc.blocks = next.blocks; doc.defaults = next.defaults; doc.title = next.title;
  suppressUndoPush = false;
  saveState(); renderRoute();
  toast('已重做');
}

// 把 contenteditable 内部 HTML 转为存进 state 的 HTML（保留行内 span 格式）
function htmlToTextForSave(el, type){
  // 行内 span（颜色/粗体/斜体/下划线/字号）保留为 <span style="...">，渲染时直接展示
  // mention 保留
  let out = '';
  const walk = (n) => {
    if(n.nodeType===3){
      out += escapeHtml(n.textContent);
    } else if(n.nodeType===1){
      if(n.tagName==='BR'){ out += '<br>'; return; }
      if(n.dataset?.mentionDoc){
        out += `<span data-mention-doc="${n.dataset.mentionDoc}">@${escapeHtml(n.textContent.replace(/^@/, ''))}</span> `;
        return;
      }
      if(n.tagName==='SPAN' && (n.style.cssText || n.dataset.sel)){
        // 保留行内样式（颜色/字号/粗体/斜体/下划线）
        const style = n.style.cssText || '';
        out += `<span style="${style}">`;
        n.childNodes.forEach(walk);
        out += '</span>';
        return;
      }
      // 其他标签（如浏览器自动包的 <font>、<div>）：递归处理其子节点
      n.childNodes.forEach(walk);
    }
  };
  el.childNodes.forEach(walk);
  return out;
}

function applyBlockFormat(blockId, fmtPatch){
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, blockId); if(!b) return;
  b.fmt = {...(b.fmt||{}), ...fmtPatch};
  markEditorDirty();
  renderRoute();
  // 重新聚焦
  setTimeout(()=>{
    const el = document.querySelector(`[data-block-id="${blockId}"][data-block-text]`);
    if(el){
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el.focus();
    }
  }, 50);
}

function changeBlockType(blockId, newType){
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, blockId); if(!b) return;
  b.type = newType;
  if(newType==='note' && !b.level) b.level = 'tip';
  markEditorDirty();
  renderRoute();
}

function addBlockAfter(blockId, newBlock){
  const doc = getCurrentDoc(); if(!doc) return;
  const idx = doc.blocks.findIndex(b => b.id===blockId);
  if(idx<0) doc.blocks.push(newBlock);
  else doc.blocks.splice(idx+1, 0, newBlock);
  markEditorDirty();
  renderRoute();
  setTimeout(()=>{
    const el = document.querySelector(`[data-block-id="${newBlock.id}"][data-block-text]`) || document.querySelector(`[data-block-id="${newBlock.id}"]`);
    if(el && el.focus) el.focus();
  }, 50);
}

function deleteBlock(blockId){
  const doc = getCurrentDoc(); if(!doc) return;
  doc.blocks = doc.blocks.filter(b => b.id!==blockId);
  markEditorDirty();
  renderRoute();
}

function duplicateBlock(blockId){
  const doc = getCurrentDoc(); if(!doc) return;
  const idx = doc.blocks.findIndex(b => b.id===blockId);
  if(idx<0) return;
  const copy = JSON.parse(JSON.stringify(doc.blocks[idx]));
  copy.id = bid();
  doc.blocks.splice(idx+1, 0, copy);
  markEditorDirty();
  renderRoute();
}

function moveBlock(blockId, dir){
  const doc = getCurrentDoc(); if(!doc) return;
  const idx = doc.blocks.findIndex(b => b.id===blockId);
  if(idx<0) return;
  const ni = dir==='up' ? idx-1 : idx+1;
  if(ni<0 || ni>=doc.blocks.length) return;
  [doc.blocks[idx], doc.blocks[ni]] = [doc.blocks[ni], doc.blocks[idx]];
  markEditorDirty();
  renderRoute();
}

// 课程操作
function newDocInActiveCourse(){
  activeDocId = null;
  const title = prompt('新文档标题：');
  if(!title) return;
  const doc = mkDoc(activeCourse, title.trim(), Date.now(), [
    {type:'h1', text: title.trim()},
    {type:'p', text:''},
  ], []);
  STATE.course[activeCourse] = STATE.course[activeCourse] || [];
  STATE.course[activeCourse].unshift(doc);
  saveState();
  activeDocId = doc.id;
  renderRoute();
  setTimeout(()=>{
    const t = document.getElementById('doc-title');
    if(t){ t.focus(); t.select(); }
  }, 80);
}

function trashCurrentDoc(){
  const doc = getCurrentDoc(); if(!doc) return;
  if(!confirm(`把"${doc.title}"移到回收站？30 天内可恢复。`)) return;
  STATE.courseTrash = STATE.courseTrash || [];
  STATE.courseTrash.unshift({...doc, deletedAt: Date.now()});
  STATE.course[doc.course] = STATE.course[doc.course].filter(d => d.id!==doc.id);
  saveState();
  activeDocId = null;
  renderRoute();
  toast('已移到回收站');
}

function copyCurrentDoc(){
  const doc = getCurrentDoc(); if(!doc) return;
  const title = prompt('复制为：', doc.title + '（副本）');
  if(!title) return;
  const copy = JSON.parse(JSON.stringify(doc));
  copy.id = uid();
  copy.title = title;
  copy.createdAt = Date.now();
  copy.updatedAt = Date.now();
  copy.version = 1;
  copy.history = [];
  copy.blocks = copy.blocks.map(b => ({...b, id: bid()}));
  STATE.course[doc.course].unshift(copy);
  saveState();
  activeDocId = copy.id;
  renderRoute();
  toast('已复制');
}

function saveCurrentVersion(){
  const doc = getCurrentDoc(); if(!doc) return;
  doc.history = doc.history || [];
  doc.history.push({
    version: (doc.history.length || 0) + 1,
    savedAt: Date.now(),
    blocks: JSON.parse(JSON.stringify(doc.blocks)),
    title: doc.title,
  });
  if(doc.history.length > 20) doc.history = doc.history.slice(-20);
  doc.version = (doc.version||1) + 1;
  saveState();
  renderRoute();
  toast('已存为版本 v' + doc.version);
}

function restoreVersion(ver){
  const doc = getCurrentDoc(); if(!doc) return;
  const h = (doc.history||[]).find(x => x.version===ver);
  if(!h) return;
  if(!confirm(`恢复到 v${ver}？当前未保存的修改会丢失。`)) return;
  doc.blocks = JSON.parse(JSON.stringify(h.blocks));
  doc.title = h.title;
  doc.updatedAt = Date.now();
  doc.version = (doc.version||1) + 1;
  saveState();
  renderRoute();
  toast('已恢复到 v' + ver);
}

function exportDocImage(){
  const doc = getCurrentDoc(); if(!doc) return;
  // 用 SVG foreignObject 把文档渲染成 PNG（无需外部库）
  const html = docToHTML(doc);
  const css = `body{font-family:-apple-system,system-ui,"PingFang SC",sans-serif;color:#222;line-height:1.7;font-size:14px;padding:24px;background:#fff;width:760px}
h1{font-size:26px;border-bottom:2px solid #2F6B57;padding-bottom:6px}

h3{font-size:17px;margin-top:14px}
.note{padding:8px 12px;margin:10px 0;border-left:4px solid}
.note-tip{border-color:#2F6B57;background:#F4F8F6}
.note-info{border-color:#3B7DBE;background:#E8F0FA}
.note-warn{border-color:#D88C4A;background:#FBEEDD}
.note-personal{border-color:#C5528E;background:#FBE9F4}
img{max-width:100%}
blockquote{border-left:3px solid #ccc;padding-left:10px;color:#555}
pre{background:#F1E0BE;padding:8px;font-size:12px;white-space:pre-wrap}
hr{border:none;border-top:1px dashed #999;margin:16px 0}
.mention{background:#E8F1EC;padding:1px 5px;border:1px solid #2F6B57;color:#2F6B57;border-radius:3px}`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1200">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml" style=""><style>${css}</style>${html}</div>
</foreignObject></svg>`;
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 820 * 2; canvas.height = 1200 * 2;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `${doc.title||'doc'}.png`;
      a.click();
      setTimeout(()=>{ URL.revokeObjectURL(a.href); URL.revokeObjectURL(url); }, 5000);
      toast('PNG 已下载');
    }, 'image/png');
  };
  img.onerror = () => { toast('图片生成失败'); };
  img.src = url;
}

function docToHTML(doc){
  // 极简 HTML 渲染（用于 PDF/图片导出）
  const esc = escapeHtml;
  return (doc.blocks||[]).map(b => {
    const fmt = b.fmt || {};
    // v3.1 之后颜色走 inline span；fmt 只剩 bold/italic/underline/size 块级
    const inlineStyle = [
      fmt.bold ? 'font-weight:700' : '',
      fmt.italic ? 'font-style:italic' : '',
      fmt.underline ? 'text-decoration:underline' : '',
      fmt.size ? `font-size:${({S:'12px',M:'14px',L:'17px',XL:'22px'})[fmt.size]||'14px'}` : '',
    ].filter(Boolean).join(';');
    // b.text 可能含 <span style="...">，需要 unescape 后让浏览器渲染
    let text = String(b.text||'');
    // 保护链接：把 mention 转 anchor
    text = text.replace(/<span[^>]*data-mention-doc="([^"]+)"[^>]*>@([^<]+)<\/span>/g, (_,id,t)=>{
      const d = getDocById(id);
      return `<a href="#doc-${id}" style="color:#2F6B57;text-decoration:underline">@${esc(t)}</a>`;
    });
    const wrap = (txt, tag='span') => `<${tag}${inlineStyle?' style="'+inlineStyle+'"':''}>${txt}</${tag}>`;
    if(fmt.bold || fmt.italic || fmt.underline || fmt.size){
      // 块级 fmt 时把所有内容包一层
      text = wrap(text);
    }
    if(b.type==='h1') return `<h1>${text}</h1>`;
    if(b.type==='h2') return `<h2>${text}</h2>`;
    if(b.type==='h3') return `<h3>${text}</h3>`;
    if(b.type==='list') return `<p>${b.ordered?'1.':'•'} ${wrap(text,'span')}</p>`;
    if(b.type==='quote') return `<blockquote>${wrap(text,'span')}</blockquote>`;
    if(b.type==='code') return `<pre>${esc(b.text||'')}</pre>`;
    if(b.type==='table' && Array.isArray(b.rows)){
      return '<table>' + b.rows.map((row, ri) => {
        const tag = ri===0?'th':'td';
        return '<tr>' + row.map(c => `<${tag}>${esc(c)}</${tag}>`).join('') + '</tr>';
      }).join('') + '</table>';
    }
    if(b.type==='note'){
      const lvl = b.level || 'tip';
      return `<div class="note note-${esc(lvl)}"><strong>${({tip:'提示',info:'补充',warn:'注意',personal:'备忘'})[lvl]||'提示'}</strong><br>${wrap(text,'span')}</div>`;
    }
    if(b.type==='divider') return `<hr>`;
    if(b.type==='image'){
      if(!b.text) return `<p style="color:#999">[图片占位]</p>`;
      const alt = esc(b.alt||'');
      return `<img src="${esc(b.text)}" alt="${alt}">${b.caption?`<p style="color:#666;font-size:12px">${esc(b.caption)}</p>`:''}`;
    }
    if(b.type==='video') return `<p>▶ 视频：<a href="${esc(b.text)}">${esc(b.text)}</a></p>`;
    if(b.type==='link') return `<p>🔗 <a href="${esc(b.href||b.text)}">${esc(b.text||b.href)}</a></p>`;
    if(b.type==='mention') return `<a class="mention">@${esc(text)}</a>`;
    return `<p>${wrap(text,'span')}</p>`;
  }).join('\n');
}
