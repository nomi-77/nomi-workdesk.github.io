<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>个人 AI 工作台 · 今日</title>
<style>
/* ============================================================
   设计系统
   ============================================================ */
:root{
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --surface-2:#FBFBF9;
  --text:#202124;
  --text-2:#6F7277;
  --text-3:#9AA0A6;
  --border:#E6E7E4;
  --border-2:#F0F0ED;
  --accent:#E8836E;
  --accent-soft:#FFE6DE;
  --yellow:#F4D85A;
  --pink:#F0B6A0;
  --blue:#7BB8C9;
  --green:#7BC59A;
  --red:#D6867A;
  --orange:#F0A85C;
  --wood:#E5D4B0;
  --wood-2:#C0A678;
  --wood-line:#8B6840;
  --wood-dark:#5C4423;

  --r-sm:10px;
  --r:14px;
  --r-lg:20px;
  --r-pill:999px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s10:56px;

  --shadow-sm:0 1px 2px rgba(32,33,36,.04);
  --shadow:0 1px 2px rgba(32,33,36,.04),0 4px 12px rgba(32,33,36,.05);
  --shadow-lg:0 10px 30px rgba(32,33,36,.10);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

  --topbar-h:56px;
  --bnav-h:64px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh;overflow-x:auto}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none;padding:0;margin:0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D9D5;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#C4C6C0}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   通用工具类
   ============================================================ */
.muted{color:var(--text-2)}
.tiny{font-size:12px;color:var(--text-2)}
.row{display:flex;align-items:center;gap:var(--s3)}
.col{display:flex;flex-direction:column;gap:var(--s2)}
.spacer{flex:1}
.hidden{display:none !important}

/* ============================================================
   像素 / 海绵宝宝主题
   ============================================================ */
.icon.pixel{shape-rendering:crispEdges;image-rendering:pixelated;stroke:none !important;fill:currentColor}

/* 木纹背景（比奇堡风：横向木板纹 + 暖光晕） */
body{
  background-color:#FBEED7;
  background-image:
    /* 板缝竖线 */
    repeating-linear-gradient(90deg,
      rgba(139,104,64,0.18) 0px,
      rgba(139,104,64,0.18) 2px,
      transparent 2px,
      transparent 120px),
    /* 横向木纹细线 */
    repeating-linear-gradient(0deg,
      rgba(139,104,64,0.06) 0px,
      rgba(139,104,64,0.06) 1px,
      transparent 1px,
      transparent 18px),
    /* 暖光斑 */
    radial-gradient(circle at 18% 8%, rgba(244,216,90,0.20) 0px, transparent 40%),
    radial-gradient(circle at 82% 82%, rgba(232,131,110,0.16) 0px, transparent 42%),
    /* 整体木色 */
    linear-gradient(180deg,#FAEAD0 0%,#F4E0BC 100%);
  background-attachment:fixed;
}

/* 像素卡片：硬边框 + 无圆角 + 木纹色 */
.pixel-card{
  background:#FFF5E0;
  border:3px solid #2A1810;
  border-radius:0;
  box-shadow:4px 4px 0 0 #2A1810;
  position:relative;
}
.pixel-card:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,
    transparent 0px, transparent 4px,
    rgba(139,69,19,0.02) 4px, rgba(139,69,19,0.02) 5px);
  pointer-events:none;
}
.pixel-card-lg{
  border:4px solid #2A1810;
  box-shadow:5px 5px 0 0 #2A1810;
}

/* 像素按钮：硬边 + 投影 */
.pixel-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;
  background:#F4D85A;
  color:#2A1810;
  border:2px solid #2A1810;
  border-radius:0;
  font-size:13px;font-weight:600;
  cursor:pointer;
  box-shadow:3px 3px 0 0 #2A1810;
  transition:.08s;
  font-family:var(--font);
}
.pixel-btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 0 #2A1810}
.pixel-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 0 #2A1810}
.pixel-btn-primary{background:#2D7A2D;color:#FFF5E0}
.pixel-btn-primary:hover{background:#3D9B3D;color:#FFF5E0}
.pixel-btn-ghost{background:transparent;color:#2A1810;box-shadow:2px 2px 0 0 #2A1810}
.pixel-btn-ghost:hover{background:#FFF5E0}
.pixel-btn-danger{background:#E74C3C;color:#FFF5E0}
.pixel-btn-sm{padding:4px 10px;font-size:12px}

/* 像素标签 */
.pixel-tag{
  display:inline-block;padding:2px 8px;
  background:#F4D85A;color:#2A1810;
  border:2px solid #2A1810;border-radius:0;
  font-size:11px;font-weight:600;
  font-family:var(--font);
}
.pixel-tag.green{background:#5CB85C;color:#FFF5E0}
.pixel-tag.red{background:#E74C3C;color:#FFF5E0}
.pixel-tag.blue{background:#7FB8E8;color:#2A1810}
.pixel-tag.purple{background:#B97AA6;color:#FFF5E0}
.pixel-tag.brown{background:#A0501C;color:#FFF5E0}

/* 像素图标尺寸 */
.px-ic-sm{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.px-ic-md{width:24px;height:24px;display:inline-block;vertical-align:-5px}
.px-ic-lg{width:36px;height:36px;display:inline-block;vertical-align:-7px}
.px-ic-xl{width:48px;height:48px;display:inline-block;vertical-align:-10px}

/* 像素头条（4 个统计 + 头像 + 营业中） —— 透明玻璃 */
.px-topbar{
  display:grid;
  grid-template-columns:repeat(4, 1fr) auto;
  gap:8px;
  padding:12px;
  background:linear-gradient(180deg, rgba(160,80,28,.42) 0%, rgba(123,52,19,.5) 100%);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:2px solid rgba(42,24,16,.85);
  box-shadow:4px 4px 0 0 rgba(42,24,16,.35);
  margin-bottom:14px;
  position:relative;overflow:hidden;
}
.px-topbar::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, transparent 0 18px, rgba(42,24,16,.06) 18px 19px);
  pointer-events:none;
}
.px-topbar-stat{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;
  border:2px solid;
  box-shadow:2px 2px 0 0 #2A1810;
  min-width:0;
}
.px-stat-icon{flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.px-stat-img{width:36px;height:36px;object-fit:contain;display:block}
.px-stat-body{flex:1;min-width:0;overflow:hidden}
.px-stat-num{font-size:18px;font-weight:700;color:#2A1810;line-height:1;letter-spacing:-.02em}
.px-stat-lab{font-size:10px;color:#2A1810;font-weight:700;margin-top:1px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px-topbar-meta{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;background:rgba(255,245,224,.92);
  border:2px solid #2A1810;
  box-shadow:2px 2px 0 0 #2A1810;
  min-width:0;
}
.px-avatar{
  width:36px;height:36px;flex-shrink:0;
  background:#F4D85A;
  border:2px solid #2A1810;
  display:flex;align-items:center;justify-content:center;
  box-shadow:1px 1px 0 0 #2A1810;
}
.px-open-sign{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:#A0501C;border:2px solid #2A1810;
  padding:3px 6px;color:#F4D85A;font-size:10px;font-weight:700;
  box-shadow:1px 1px 0 0 #2A1810;
  line-height:1.1;flex-shrink:0;
}

/* 4 个大统计卡（参考图 1） */
.px-hero-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-bottom:14px;
  overflow:visible;
}
.px-hero{
  position:relative;
  border:3px solid;
  padding:14px 14px 12px;
  box-shadow:4px 4px 0 0 #2A1810;
  min-height:120px;
  display:flex;flex-direction:column;gap:2px;
  overflow:visible;
  z-index:1;
}
.px-hero:hover{z-index:50}
.px-hero-icon{
  position:absolute;top:10px;right:10px;
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
}
.px-hero-icon .px-hero-ic{width:48px;height:48px;display:block}
.px-hero-img{width:48px;height:48px;object-fit:contain;display:block}
.px-hero-name{
  font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:#2A1810;opacity:.6;
}
.px-hero-num{
  font-size:36px;font-weight:800;line-height:1;letter-spacing:-.03em;
  color:#2A1810;
  font-family:Georgia,"Times New Roman",serif;
}
.px-hero-lab{font-size:14px;font-weight:700;color:#2A1810;margin-top:2px}
.px-hero-sub{font-size:11px;color:#2A1810;margin-top:auto;opacity:.75}

/* 课程备课大入口（电脑端用，移动端用 bnav） */
.px-course-cta{
  display:none;
  gap:16px;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:linear-gradient(135deg, rgba(244,216,90,.85) 0%, rgba(233,168,207,.85) 100%);
  border:3px solid #2A1810;
  box-shadow:4px 4px 0 0 #2A1810;
  margin-bottom:14px;
}
@media (min-width:900px){.px-course-cta{display:flex}}
.px-course-cta-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.px-course-cta-img{width:64px;height:64px;object-fit:contain;flex-shrink:0;filter:drop-shadow(2px 2px 0 #2A1810)}
.px-course-cta-eyebrow{font-size:11px;font-weight:700;color:#7B3413;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.px-course-cta-title{font-size:20px;font-weight:800;color:#2A1810;letter-spacing:-.01em;line-height:1.2}
.px-course-cta-sub{font-size:12px;color:#5C2C0F;margin-top:2px}
.px-course-cta-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
@media (max-width:1100px){
  .px-course-cta-img{width:52px;height:52px}
  .px-course-cta-title{font-size:17px}
}

/* hover 抽屉：默认隐藏，hover 拉出 */
.px-hero-drawer{
  position:absolute;
  top:calc(100% + 6px);
  left:0;right:0;
  background:#FFF5E0;
  border:2.5px solid #2A1810;
  box-shadow:6px 6px 0 0 #2A1810;
  padding:10px 12px;
  display:none;
  flex-direction:column;gap:6px;
  z-index:60;
  max-height:280px;overflow-y:auto;
}
.px-hero:hover .px-hero-drawer{display:flex}
.px-hero-drawer::before{
  content:"";position:absolute;top:-7px;left:14px;
  width:12px;height:12px;
  background:#FFF5E0;
  border-left:2.5px solid #2A1810;
  border-top:2.5px solid #2A1810;
  transform:rotate(45deg);
}
.px-hero-drawer-head{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;color:#7B3413;
  letter-spacing:.04em;text-transform:uppercase;
  border-bottom:1.5px dashed #7B3413;padding-bottom:6px;
}
.px-hero-drawer-empty{padding:14px 4px;font-size:12px;color:#7B3413;text-align:center;margin:0}
.px-hero-drawer-item{
  padding:6px 8px;background:rgba(244,216,90,.2);
  border:1.5px solid #2A1810;cursor:pointer;
  transition:.08s;
}
.px-hero-drawer-item:hover{background:#F4D85A;transform:translate(1px,1px)}
.px-hero-drawer-item-title{
  font-size:12.5px;font-weight:700;color:#2A1810;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.px-hero-drawer-item-meta{font-size:10px;color:#7B3413;margin-top:2px}

/* 主体双列 */
.px-main{
  display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start;
}
@media (max-width:900px){.px-main{grid-template-columns:1fr}}
.px-main-left, .px-main-right{display:flex;flex-direction:column;gap:14px}

.px-card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
  background:rgba(42,24,16,.08);
  border-bottom:2px solid #2A1810;
  gap:8px;
}
.px-card-title{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:700;color:#2A1810;
  letter-spacing:.02em;
}
.px-card-meta{font-size:11px;color:#2A1810;opacity:.65;font-weight:600}
.px-card-foot{padding:10px 14px;display:flex;gap:8px;border-top:2px solid #2A1810;background:rgba(42,24,16,.04)}
.px-foot-link{font-size:11.5px;margin-top:10px;color:#7B3413}
.px-foot-link a{color:#2A1810;font-weight:700;cursor:pointer}
.px-empty{padding:18px 14px;font-size:13px;color:#7B3413;text-align:center}

/* 任务列表 */
.px-task-list{padding:8px 14px 12px;display:flex;flex-direction:column;gap:14px}
.px-task-group{display:flex;flex-direction:column;gap:4px}
.px-task-group-title{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 0 4px 0;
  border-bottom:1px dashed currentColor;opacity:.85;
  margin-bottom:4px;
}
.px-task-group-count{
  margin-left:auto;background:#2A1810;color:#F4D85A;
  padding:0 6px;font-size:10px;
  border:1px solid #2A1810;
}
.px-task{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:#FFF5E0;
  border:2px solid #2A1810;cursor:pointer;
  transition:.08s;
  box-shadow:2px 2px 0 0 #2A1810;
  position:relative;
}
.px-task:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810}
.px-task.expanded{box-shadow:2px 2px 0 0 #2A1810, inset 0 0 0 1px #F4D85A}
.px-task.done{opacity:.5}
.px-task.done .px-task-title{text-decoration:line-through}
.px-check{
  width:24px;height:24px;background:#FFF5E0;
  border:0;padding:0;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.px-check:hover{background:#F4D85A}
.px-task-title{flex:1;font-size:13.5px;color:#2A1810;line-height:1.4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-task-arrow{font-size:10px;color:#7B3413;flex-shrink:0;transition:transform .15s;font-weight:700}
.px-task.expanded .px-task-arrow{transform:rotate(90deg);color:#2A1810}
.px-task-detail{
  display:none;
  margin-top:8px;padding:10px 12px;
  background:rgba(244,216,90,.18);
  border:2px dashed #7B5A0A;
  font-size:12.5px;color:#2A1810;line-height:1.6;
}
.px-task.expanded .px-task-detail{display:block}
.px-task-detail-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.px-task-detail-tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;padding:1px 6px;
  border:1.5px solid #2A1810;color:#2A1810;font-weight:700;
  background:#FFF5E0;
}
.px-task-detail-tag.high{background:#E74C3C;color:#FFF5E0;border-color:#7B1414}
.px-task-detail-tag.mid{background:#F4D85A}
.px-task-detail-tag.low{background:#FFF5E0}
.px-task-detail-tag.src{background:#A0501C;color:#F4D85A;border-color:#5C2C0F}

/* 待确认 */
.px-confirm{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:#FFF5E0;
  border:2px dashed #2A1810;margin:0 14px 10px;
}
.px-confirm-text{flex:1;min-width:0}
.px-confirm-text p{margin:0;font-size:13.5px;color:#2A1810;font-weight:500}
.px-confirm-meta{font-size:11px;color:#7B3413;margin-top:2px}
.px-confirm-actions{display:flex;gap:6px;flex-shrink:0}

/* 最近可继续 */
.px-recent-list{padding:8px 14px 14px;display:flex;flex-direction:column;gap:6px}
.px-recent-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:#FFF5E0;
  border:2px solid #2A1810;cursor:pointer;
  transition:.08s;box-shadow:2px 2px 0 0 #2A1810;
}
.px-recent-item:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810}
.px-recent-ic{flex-shrink:0;width:24px;height:24px;background:#A0501C;display:flex;align-items:center;justify-content:center;border:2px solid #2A1810}
.px-recent-body{flex:1;min-width:0}
.px-recent-title{font-size:12.5px;color:#2A1810;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-recent-meta{font-size:10.5px;color:#7B3413;margin-top:1px}

/* 快速记录 */
.px-quick{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.px-quick-row{display:flex;gap:6px;align-items:center}
.px-select, .px-input{
  font-family:inherit;font-size:13px;color:#2A1810;
  padding:6px 8px;background:#FFF5E0;
  border:2px solid #2A1810;border-radius:0;
  outline:0;
}
.px-input{flex:1}
.px-select{flex:0 0 80px}

/* 移动端 */
@media (max-width:900px){
  .px-topbar{grid-template-columns:repeat(2, 1fr)}
  .px-topbar-meta{grid-column:1 / -1}
  .px-topbar-spacer{display:none}
  .px-hero-row{grid-template-columns:repeat(2, 1fr)}
}
@media (max-width:640px){
  .px-topbar{grid-template-columns:repeat(2, 1fr);padding:10px;gap:6px}
  .px-topbar-stat{padding:5px 8px;gap:6px}
  .px-stat-num{font-size:16px}
  .px-stat-icon{width:32px;height:32px}
  .px-topbar-meta{padding:6px 8px;flex-wrap:wrap;gap:6px}
  .px-avatar{width:32px;height:32px}
  .px-open-sign{font-size:9px;padding:2px 5px}
  .px-hero-row{grid-template-columns:repeat(2, 1fr);gap:8px}
  .px-hero{padding:10px 10px 8px;min-height:96px}
  .px-hero-icon{width:32px;height:32px;top:6px;right:6px}
  .px-hero-icon .px-hero-ic{width:32px;height:32px}
  .px-hero-num{font-size:24px}
  .px-hero-lab{font-size:12px}
  .px-hero-sub{font-size:10px}
  .px-card-head{padding:10px 12px}
  .px-task-list{padding:6px 10px 10px;gap:10px}
  .px-task{padding:6px 8px;gap:6px;font-size:12.5px}
}
@media (max-width:380px){
  .px-topbar{grid-template-columns:1fr 1fr}
  .px-hero-row{grid-template-columns:1fr}
  .px-hero-icon{width:36px;height:36px}
  .px-hero-icon .px-hero-ic{width:36px;height:36px}
}

/* ============================================================
   备课文件（今日主区重点块 #1）
   ============================================================ */
.px-course-list{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:12px;padding:12px 14px 14px;
}
.px-course-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;background:#FFFAEC;
  border:2px solid #6F4A28;border-radius:12px;
  cursor:pointer;transition:.12s;
  box-shadow:3px 3px 0 0 #5C4423;
}
.px-course-row:hover{
  background:#FFF1D4;transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 0 #5C4423;
}
.px-course-row:active{
  transform:translate(1px,1px);box-shadow:2px 2px 0 0 #5C4423;
}
.px-course-tag{
  font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;
  flex-shrink:0;
  border:2px solid #5C4423;
  letter-spacing:.02em;
}
.px-course-row-title{
  font-weight:700;color:#3A2511;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;min-width:0;
}
.px-course-row-meta{
  font-size:11px;color:#7B5A0A;flex-shrink:0;
  font-weight:600;
}
.px-course-empty{
  padding:14px;text-align:center;color:var(--text-3);font-size:13px;
}
@media (max-width:640px){
  .px-course-list{grid-template-columns:1fr;padding:8px 10px 10px;gap:8px}
  .px-course-row{padding:8px 10px}
}

/* ============================================================
   Python 刷题
   ============================================================ */
.py-stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--s3);margin-bottom:var(--s5);
}
.py-stat-cell{
  background:#FFFAEC;border:2px solid #D5C9A0;
  border-radius:var(--r);padding:14px 16px;
  box-shadow:2px 2px 0 0 #B9956D;
  display:flex;flex-direction:column;gap:4px;
}
.py-stat-label{font-size:11.5px;color:#7B5A0A;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.py-stat-num{font-size:28px;font-weight:700;color:#3A2511;letter-spacing:-.02em}
.py-stat-num small{font-size:13px;color:var(--text-2);font-weight:500;margin-left:4px}
.py-stat-cell.streak::before,.py-stat-cell.today::before,.py-stat-cell.total::before,.py-stat-cell.weak::before{
  content:"";display:block;height:4px;border-radius:2px;margin-bottom:6px;
}
.py-stat-cell.streak::before{background:linear-gradient(90deg,#FFB199,#E8836E)}
.py-stat-cell.today::before{background:linear-gradient(90deg,#FFE376,#F4D85A)}
.py-stat-cell.total::before{background:linear-gradient(90deg,#9BD0E2,#7BB8C9)}
.py-stat-cell.weak::before{background:linear-gradient(90deg,#E8A8C9,#B97AA6)}
.py-stat-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.py-tag{
  font-size:10.5px;padding:2px 8px;border-radius:var(--r-pill);
  background:#FFE8D8;color:#A0463B;border:1px solid #D5C9A0;font-weight:600;
}
.py-tag em{font-style:normal;color:#E8836E;font-weight:700;margin-left:2px}
.py-tag.empty{background:#F4EFC8;color:#7B5A0A;border-color:#D5C9A0;font-weight:500;font-style:italic}

/* 难度档位 + AI 出题工具栏 */
.py-toolbar{
  display:flex;align-items:center;gap:10px;
  background:#FFFAEC;border:2px solid #D5C9A0;border-radius:var(--r);
  padding:10px 14px;margin-bottom:var(--s4);
  box-shadow:2px 2px 0 0 #B9956D;
  flex-wrap:wrap;
}
.py-toolbar-label{
  font-size:11px;font-weight:700;color:#7B5A0A;
  letter-spacing:.08em;text-transform:uppercase;
  padding-right:8px;border-right:1.5px dashed #B9956D;
}
.py-diff-tabs{display:flex;gap:4px}
.py-diff-tab{
  padding:6px 14px;font-size:13px;font-weight:700;
  background:#FFFAEC;border:2px solid #D5C9A0;border-radius:10px;
  color:#7B5A0A;cursor:pointer;font-family:inherit;
  transition:.12s;
}
.py-diff-tab:hover{background:#FFF1D4;border-color:#B9956D}
.py-diff-tab.active{
  background:linear-gradient(180deg,#FFE376,#F4D85A);
  border-color:#5C4423;color:#3A2511;
  box-shadow:2px 2px 0 0 #5C4423;
}
.py-toolbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.py-toolbar-meta{font-size:12px;color:#7B5A0A;font-weight:600}
.py-btn-ai{
  background:linear-gradient(135deg,#FF9A87,#E8836E);
  color:#FFF5E0;border:2px solid #5C4423;
  padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit;
  box-shadow:2px 2px 0 0 #5C4423;
  transition:.12s;
}
.py-btn-ai:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 #5C4423}

.py-layout{
  display:grid;grid-template-columns:260px 1fr;gap:var(--s4);align-items:start;
}
@media (max-width:900px){.py-layout{grid-template-columns:1fr}}

/* 题目列表 */
.py-list{
  background:#FFFAEC;border:2px solid #D5C9A0;border-radius:var(--r);
  box-shadow:3px 3px 0 0 #B9956D;
  padding:12px;display:flex;flex-direction:column;gap:8px;
}
@media (min-width:901px){
  /* 宽屏：列表左浮动 + sticky */
  .py-list{position:sticky;top:calc(var(--topbar-h) + var(--s3));}
}
.py-list-head{
  font-size:11.5px;font-weight:700;color:#7B5A0A;
  letter-spacing:.08em;text-transform:uppercase;
  border-bottom:2px dashed #B9956D;padding-bottom:6px;
}
.py-problems{display:flex;flex-direction:column;gap:6px}
.py-problem{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:#FFFAEC;
  border:2px solid #D5C9A0;border-radius:10px;
  cursor:pointer;transition:.12s;box-shadow:1px 1px 0 0 #B9956D;
}
.py-problem:hover{
  background:#FFF1D4;transform:translate(-1px,-1px);
  box-shadow:2px 2px 0 0 #B9956D;
}
.py-problem.active{
  background:linear-gradient(180deg,#FFE376,#F4D85A);
  border-color:#5C4423;box-shadow:2px 2px 0 0 #5C4423;
}
.py-problem-idx{
  width:22px;height:22px;border-radius:6px;
  background:#5C4423;color:#FFE376;
  font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.py-problem.active .py-problem-idx{background:#5C4423;color:#FFE376}
.py-problem-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.py-problem-title{
  font-size:13px;font-weight:700;color:#3A2511;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.py-problem-meta{display:flex;gap:4px;flex-wrap:wrap}
.py-mini-tag{
  font-size:9.5px;padding:1px 5px;border-radius:4px;
  background:rgba(255,255,255,.6);color:#5C4423;
  border:1px solid #D5C9A0;font-weight:600;
}
.py-status{
  width:22px;height:22px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;flex-shrink:0;
}
.py-st-pending{background:#F4EFC8;color:#7B5A0A}
.py-st-solved{background:#A8E0B8;color:#2F6B57}
.py-st-failed{background:#F5D5D0;color:#A0463B}
.py-btn-regen{
  margin-top:4px;padding:8px 12px;
  background:#FFFAEC;border:2px dashed #B9956D;border-radius:10px;
  color:#5C4423;font-size:12px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.py-btn-regen:hover{background:#FFE8D8;border-color:#E8836E;color:#A0463B;border-style:solid}

/* 当前题目 */
.py-current{
  background:#FFFAEC;border:2px solid #D5C9A0;border-radius:var(--r);
  box-shadow:3px 3px 0 0 #B9956D;
  padding:18px 20px;display:flex;flex-direction:column;gap:14px;
}
.py-current-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.py-level{
  font-size:11px;font-weight:800;padding:3px 10px;border-radius:8px;
  background:#5C4423;color:#FFE376;border:2px solid #5C4423;
  letter-spacing:.04em;
}
.py-l1{background:#A8E0B8;color:#1F4D2D;border-color:#1F4D2D}
.py-l2{background:#FFE376;color:#5C4423;border-color:#5C4423}
.py-l3{background:#FFB199;color:#5C4423;border-color:#5C4423}
.py-l4{background:#9C7BC9;color:#FFE376;border-color:#5C4423}
.py-l5{background:linear-gradient(135deg,#E8836E,#9C7BC9);color:#FFE376;border-color:#5C4423}
.py-title{font-size:20px;font-weight:700;color:#3A2511;letter-spacing:-.01em;margin:0}
.py-prompt{
  font-size:13.5px;line-height:1.7;color:#3A2511;
  background:#F4EFC8;border:2px dashed #B9956D;border-radius:10px;
  padding:12px 14px;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,Consolas,monospace;
  margin:0;
}
.py-judge-list-head{
  font-size:11.5px;font-weight:700;color:#7B5A0A;
  letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1.5px dashed #B9956D;padding-bottom:4px;
}
.py-judge-list{display:flex;flex-direction:column;gap:6px}
.py-case{
  background:#FFFAEC;border:1.5px solid #D5C9A0;border-radius:8px;
  padding:6px 10px;font-size:12px;color:#5C4423;
  display:flex;flex-direction:column;gap:2px;
}
.py-case.pass{border-color:#A8E0B8;background:#EFFAF2}
.py-case.fail{border-color:#F5B5AA;background:#FBEEEC}
.py-case-name{font-size:11px;font-weight:700;color:#7B5A0A;letter-spacing:.04em;text-transform:uppercase}
.py-case-io{font-size:12px;color:#3A2511;font-family:ui-monospace,Consolas,monospace}
.py-case-io code{background:#F4EFC8;padding:1px 5px;border-radius:4px;color:#5C4423}
.py-case-result{font-size:11px;color:#A0463B;font-family:ui-monospace,Consolas,monospace;display:none}
.py-case.fail .py-case-result{display:block}
.py-case-result::before{content:"你的输出：";font-weight:700;color:#A0463B;margin-right:4px}
.py-case.pass .py-case-result{display:block;color:#5BAE74}
.py-case.pass .py-case-result::before{content:"✓ 通过 · ";font-weight:700}

/* 编辑器 */
.py-editor-shell{
  background:#FFF5E0;border:2px solid #5C4423;border-radius:10px;
  box-shadow:2px 2px 0 0 #5C4423;overflow:hidden;
}
.py-editor-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;background:linear-gradient(180deg,#5C4423,#3A2511);
  color:#FFE376;font-size:11px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;
}
.py-editor-actions{display:flex;gap:4px}
.py-btn-mini{
  font-size:11px;padding:2px 8px;border-radius:5px;
  background:#FFE376;color:#5C4423;border:1px solid #FFE376;
  font-weight:700;cursor:pointer;font-family:inherit;
  transition:.12s;
}
.py-btn-mini:hover{background:#fff;color:#5C4423}
.py-editor{
  width:100%;min-height:240px;max-height:480px;
  font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;
  font-size:13px;line-height:1.55;color:#3A2511;
  padding:12px 14px;background:#FFF5E0;
  border:0;outline:0;resize:vertical;
  tab-size:4;
}
.py-editor:focus{background:#FFFAEC}

.py-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
  border-top:2px dashed #B9956D;padding-top:12px;
}
.py-foot-left{font-size:11.5px;color:#7B5A0A;flex:1;min-width:0}
.py-loading-info{color:#A0463B;font-weight:600}
.py-foot-right{display:flex;gap:8px}
.py-btn-variant{
  background:#FFFAEC;color:#7B5A0A;border:2px dashed #B9956D;
  padding:8px 14px;border-radius:10px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
}
.py-btn-variant:hover{background:#FFE8D8;color:#A0463B;border-color:#A0463B;border-style:solid}

.py-result{
  border-radius:10px;padding:12px 14px;
  font-size:13px;line-height:1.6;display:none;
}
.py-result.show{display:block;animation:flashIn .4s ease}
.py-result.flash{
  box-shadow:0 0 0 4px #FFE376,0 0 12px rgba(244,216,90,.6);
  transition:box-shadow .25s;
}
@keyframes flashIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.py-result-pending{background:#F4EFC8;color:#7B5A0A;border:2px dashed #B9956D}
.py-result-error{background:#FBEEEC;color:#A0463B;border:2px solid #F5B5AA}
.py-result-summary{
  background:linear-gradient(180deg,#FFFAEC,#FFF1D4);
  border:2px solid #D5C9A0;border-radius:10px;
  padding:14px;font-size:13px;
}
.py-result-summary.all-pass{
  background:linear-gradient(180deg,#EAF6ED,#D5EBDC);
  border-color:#7BC59A;
}
.py-result-summary.all-fail{
  background:linear-gradient(180deg,#FBEEEC,#F5D5D0);
  border-color:#F5B5AA;
}
.py-result-headline{
  font-size:15px;font-weight:700;margin-bottom:6px;color:#3A2511;
}
.py-result-summary.all-pass .py-result-headline{color:#2F6B57}
.py-result-summary.all-fail .py-result-headline{color:#A0463B}
.py-result-cases{margin-top:8px;display:flex;flex-direction:column;gap:4px}

.py-answer-pre{
  background:#F4EFC8;border:2px dashed #B9956D;border-radius:10px;
  padding:10px 12px;font-family:ui-monospace,Consolas,monospace;
  font-size:12.5px;line-height:1.6;color:#3A2511;
  white-space:pre-wrap;word-break:break-word;
}

/* ============================================================
   图标系统（统一 SVG 描边图标，1.5px 圆头圆尾）
   ============================================================ */
.icon{width:18px;height:18px;display:inline-block;vertical-align:-3px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon-lg{width:22px;height:22px}
.icon-sm{width:16px;height:16px}

/* ============================================================
   顶栏（电脑端可见，移动端隐藏）
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:30;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:var(--s5);
  padding:0 var(--s6);
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(10px);
  -webkit-backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:600}
.brand-mark{
  width:30px;height:30px;border-radius:10px;
  background:linear-gradient(135deg,#FFB199 0%,#E8836E 100%);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;letter-spacing:-.02em;
  box-shadow:2px 2px 0 0 #B95A48, inset 0 -2px 0 rgba(0,0,0,.08);
}
.brand-name{font-size:15px}
.topnav{display:flex;align-items:center;gap:var(--s2);flex:1;justify-content:center}
.topnav-item{
  padding:6px 12px;border-radius:var(--r-pill);
  color:var(--text-2);font-size:14px;transition:.15s;
  display:flex;align-items:center;gap:6px;
}
.topnav-item:hover{background:var(--surface-2);color:var(--text)}
.topnav-item.active{background:linear-gradient(180deg,#FFE3DD 0%,#FFD0C5 100%);color:#B95A48;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:var(--s1)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:.15s;position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn .badge-dot{
  position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);border:2px solid #fff;
}

/* ============================================================
   侧边栏（电脑端）
   ============================================================ */
.layout{
  display:grid;
  grid-template-columns:240px 1fr;
  max-width:1400px;margin:0 auto;
  min-height:calc(100vh - var(--topbar-h));
}
.sidebar{
  position:sticky;top:var(--topbar-h);align-self:start;
  height:calc(100vh - var(--topbar-h));
  padding:var(--s4) var(--s3);
  overflow-y:auto;
  background-color:#E8D5A8;
  background-image:
    /* 板缝竖线（更粗更明显） */
    repeating-linear-gradient(90deg,
      rgba(92,68,35,0.32) 0px,
      rgba(92,68,35,0.32) 3px,
      transparent 3px,
      transparent 96px),
    /* 木纹横纹 */
    repeating-linear-gradient(0deg,
      rgba(139,104,64,0.10) 0px,
      rgba(139,104,64,0.10) 1px,
      transparent 1px,
      transparent 14px),
    /* 暖光晕 */
    radial-gradient(circle at 50% 0%, rgba(244,216,90,0.20) 0px, transparent 30%),
    /* 整体木色（更深更暖） */
    linear-gradient(180deg,#EBD9AE 0%,#DCC494 50%,#CFB377 100%);
  border-right:4px solid #6F4A28;
  box-shadow:
    inset -2px 0 0 rgba(0,0,0,.10),
    4px 0 0 0 #C9A872,
    8px 0 0 0 rgba(111,74,40,.25);
}
.side-user{
  background:linear-gradient(135deg,#E8C28F 0%,#C49A6A 100%);
  border:2px solid #6F4A28;
  border-radius:16px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:3px 3px 0 0 #5C4423, inset 0 2px 0 rgba(255,255,255,.4);
  display:flex;align-items:center;gap:10px;
  cursor:pointer;
  transition:all .12s;
  position:relative;
}
.side-user:before{
  content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#FFD89A 0%,#A0651F 100%);
  box-shadow:inset 0 -1px 1px rgba(0,0,0,.3);
}
.side-user:hover{
  transform:translate(-1px,-1px);
  box-shadow:4px 4px 0 0 #5C4423, inset 0 2px 0 rgba(255,255,255,.4);
}
.side-avatar{
  width:44px;height:44px;border-radius:50%;
  border:2px solid #6F4A28;
  background:#FFE9B5;flex-shrink:0;
  object-fit:cover;
  box-shadow:0 0 0 2px #fff inset;
}
.side-user-info{flex:1;min-width:0;color:#fff;margin-top:6px}
.side-user-name{
  font-size:14px;font-weight:700;color:#3A2511;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.side-user-role{
  font-size:11px;color:#7B3413;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.side-status{
  cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#FF9A87 0%,#E8836E 60%,#C9583F 100%);
  border:2px solid #6F4A28;
  border-radius:12px;
  padding:7px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
  color:#FFF8EC;font-size:13px;font-weight:700;
  box-shadow:2px 2px 0 0 #5C4423;
  transition:all .12s;
  position:relative;
}
.side-status:hover{
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 0 #5C4423;
}
.side-status.s-resting{
  background:linear-gradient(180deg,#FFE376 0%,#F4D85A 60%,#D8B82E 100%);
  border-color:#6F4A28;color:#5C4423;
}
.side-status.s-resting .side-status-dot{
  background:#fff;box-shadow:0 0 0 2px #6F4A28;
  animation:none;
}
.side-status.s-offline{
  background:linear-gradient(180deg,#C8C2B8 0%,#A8A098 60%,#807870 100%);
  border-color:#5C4423;color:#3A2511;
}
.side-status.s-offline .side-status-dot{
  background:#fff;box-shadow:0 0 0 2px #5C4423;
  animation:none;opacity:.7;
}
.side-status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 2px #6F4A28, 0 0 6px #fff;
  animation:statusPulse 1.8s infinite ease-in-out;
  flex-shrink:0;
}
@keyframes statusPulse{
  0%,100%{box-shadow:0 0 0 2px #6F4A28, 0 0 0 #fff;}
  50%{box-shadow:0 0 0 2px #6F4A28, 0 0 8px rgba(255,255,255,.9);}
}
.side-status-date{font-size:11px;opacity:.85;margin-left:auto;font-weight:500}
.side-section{margin-bottom:var(--s4)}
.side-label{
  font-size:11px;letter-spacing:.1em;
  color:#5C4423;padding:6px 4px 6px;margin-bottom:6px;
  font-weight:700;text-transform:uppercase;
  border-bottom:1px dashed rgba(111,74,40,.4);
}
.side-section ul{list-style:none;margin:0;padding:0}
.side-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:linear-gradient(180deg,#F2DFB6 0%,#E0C895 100%);
  border:2px solid #6F4A28;
  color:#3A2511;font-size:13.5px;font-weight:600;cursor:pointer;
  margin-bottom:6px;
  box-shadow:2px 2px 0 0 #5C4423;
  transition:all .12s;
}
.side-item:hover{
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 0 #5C4423;
  background:linear-gradient(180deg,#F5E2BA 0%,#E5CC9B 100%);
}
.side-item.active{
  background:linear-gradient(180deg,#FFE376 0%,#F4D85A 100%);
  color:#3A2511;
  box-shadow:3px 3px 0 0 #5C4423, inset 0 2px 0 rgba(255,255,255,.5);
  transform:translate(-1px,-1px);
}
.side-item .icon{color:#5C2C0F;flex-shrink:0}
.side-item.active .icon{color:#3A2511}
.side-item .badge{
  margin-left:auto;font-size:11px;
  background:rgba(255,255,255,.5);
  border:1px solid #6F4A28;
  padding:1px 7px;border-radius:var(--r-pill);
  color:#5C2C0F;
}
.side-item.active .badge{background:#fff;border-color:#5C2C0F;color:#5C2C0F}

/* ============================================================
   主体
   ============================================================ */
.main{
  padding:var(--s6) var(--s6) var(--s10);
  max-width:1280px;
  margin:0 auto;
  width:100%;
}
.page-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:var(--s5);gap:var(--s3);
}
.page-title{font-size:28px;letter-spacing:-.02em}
.page-subtitle{color:var(--text-2);font-size:14px;margin-top:2px}
.help-btn{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);background:#fff;
  color:var(--text-2);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;
}
.help-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ============================================================
   卡片
   ============================================================ */
.card{
  background:var(--surface);
  border:2px solid #D5C9A0;
  border-radius:var(--r);
  padding:var(--s5);
  box-shadow:var(--shadow-sm);
  margin-bottom:var(--s4);
}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:var(--s4);gap:var(--s3);
}
.card-title{font-size:17px;font-weight:600}
.card-meta{font-size:12px;color:var(--text-2)}

/* 颜色变体 */
.card--yellow{background:linear-gradient(180deg,#FDF6CF 0%,#FFFFFF 60%);border-color:#F2E7A3}
.card--pink{background:linear-gradient(180deg,#FCE4F0 0%,#FFFFFF 60%);border-color:#EFC9DE}
.card--blue{background:linear-gradient(180deg,#E1ECF8 0%,#FFFFFF 60%);border-color:#C8DAEC}
.card--green{background:linear-gradient(180deg,#E5EED9 0%,#FFFFFF 60%);border-color:#CFDDC0}

/* ============================================================
   今日页 · 概览
   ============================================================ */
.greeting{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:var(--s5);gap:var(--s4);
  flex-wrap:wrap;
}
.greeting-text h1{font-size:32px;letter-spacing:-.025em}
.greeting-text p{color:var(--text-2);margin-top:6px}
.stat-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--s3);margin-bottom:var(--s5);
}
.stat-card{
  background:#FFFAEC;border:2px solid #D5C9A0;
  border-radius:var(--r);padding:var(--s4) var(--s4);
  display:flex;flex-direction:column;gap:6px;
  position:relative;overflow:hidden;
  box-shadow:2px 2px 0 0 #B9956D;
}
.stat-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--accent);
}
.stat-card.yl::before{background:var(--yellow)}
.stat-card.pk::before{background:var(--pink)}
.stat-card.bl::before{background:var(--blue)}
.stat-card.gn::before{background:var(--green)}
.stat-label{font-size:12px;color:var(--text-2)}
.stat-value{font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat-foot{font-size:11px;color:var(--text-3);margin-top:auto}

/* 任务列表 */
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{
  display:flex;align-items:center;gap:var(--s3);
  padding:10px var(--s3);border-radius:12px;
  border:2px solid #E0CFA0;
  background:#FFFAEC;
  transition:.12s;cursor:pointer;
  box-shadow:1px 1px 0 0 #B9956D;
}
.task-item:hover{border-color:#B9956D;background:#FFF1D4}
.task-item.done{opacity:.55}
.task-item.done .task-title{text-decoration:line-through;text-decoration-color:var(--text-2)}
.priority{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.priority-high{background:var(--red)}
.priority-mid{background:var(--orange)}
.priority-low{background:var(--text-3)}
.task-check{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--border);background:#fff;
  margin-left:auto;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:transparent;transition:.12s;
}
.task-check:hover{border-color:var(--accent)}
.task-item.done .task-check{background:var(--accent);border-color:var(--accent);color:#fff}
.task-source{
  font-size:11px;color:var(--text-2);
  background:#fff;border:1px solid var(--border);
  padding:1px 8px;border-radius:var(--r-pill);flex-shrink:0;
}
.task-title{flex:1;font-size:14px;line-height:1.4}
.task-action{
  color:var(--text-3);padding:4px;border-radius:6px;
  display:flex;align-items:center;transition:.12s;
}
.task-action:hover{color:var(--text);background:var(--bg)}

/* 任务分组 */
.task-group{
  display:flex;flex-direction:column;gap:6px;
  border-left:2px solid var(--border);
  padding-left:var(--s4);
  margin-left:6px;
}
.task-group-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-2);margin-bottom:var(--s2);margin-top:var(--s3);
  display:flex;align-items:center;gap:6px;
}
.task-group-title .icon{width:14px;height:14px}

/* ============================================================
   待确认
   ============================================================ */
.confirm-item{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) var(--s3);
  border:1px dashed var(--border);
  border-radius:10px;
  background:var(--surface-2);
}
.confirm-text{flex:1}
.confirm-text p{font-size:14px}
.confirm-text .confirm-meta{font-size:12px;color:var(--text-2);margin-top:2px}
.confirm-actions{display:flex;gap:var(--s2)}

/* ============================================================
   快速记录
   ============================================================ */
.quick-add{
  display:flex;gap:var(--s2);align-items:center;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:6px 6px 6px var(--s3);
  transition:.12s;
}
.quick-add:focus-within{border-color:var(--accent);background:#fff}
.quick-add input{
  flex:1;background:transparent;border:0;outline:0;
  font-size:14px;padding:8px 0;
}
.quick-add select{
  border:0;background:transparent;color:var(--text-2);
  font-size:12px;padding:6px;border-radius:6px;outline:0;
  cursor:pointer;
}

/* ============================================================
   按钮
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:.12s;border:2px solid transparent;
  white-space:nowrap;
}
.btn-primary{background:linear-gradient(180deg,#FF9A87 0%,#E8836E 60%,#D16752 100%);color:#fff;border-color:#B95A48;box-shadow:2px 2px 0 0 #5C4423}
.btn-primary:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 #5C4423}
.btn-ghost{background:#FFFAEC;color:var(--text-2);border-color:#D5C9A0}
.btn-ghost:hover{color:var(--text);background:#FFF1D4;border-color:#B9956D}
.btn-danger{background:transparent;color:var(--red)}
.btn-danger:hover{background:#FBEEEC}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-lg{padding:11px 20px;font-size:15px}
.btn-block{display:flex;width:100%}

/* ============================================================
   空状态
   ============================================================ */
.empty-state{
  text-align:center;padding:var(--s8) var(--s5);
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:var(--r);
}
.empty-icon{
  width:48px;height:48px;border-radius:14px;
  background:var(--surface-2);color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:var(--s3);
}
.empty-state h3{font-size:16px;margin-bottom:6px}
.empty-state p{color:var(--text-2);font-size:13.5px;max-width:420px;margin:0 auto 4px}
.empty-state .planned{margin-top:var(--s4);text-align:left;display:inline-block;max-width:480px}
.empty-state .planned li{
  font-size:13px;color:var(--text-2);
  padding:4px 0;display:flex;align-items:flex-start;gap:8px;
}
.empty-state .planned li::before{
  content:"";width:4px;height:4px;border-radius:50%;
  background:var(--accent);margin-top:8px;flex-shrink:0;
}

/* ============================================================
   设置页 / 表单
   ============================================================ */
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4)}
.form-row label{font-size:13px;color:var(--text-2);font-weight:500}
.form-row .hint{font-size:12px;color:var(--text-3);margin-top:2px}
.input, .select, .textarea{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  font-size:14px;
  outline:0;
  transition:.12s;
}
.input:focus, .select:focus, .textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(47,107,87,.12);
}
.textarea{resize:vertical;min-height:90px;line-height:1.55}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media (max-width:640px){.field-grid{grid-template-columns:1fr}}

.toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
  background:var(--text);color:#fff;font-size:13px;
  padding:8px 14px;border-radius:var(--r-pill);
  box-shadow:var(--shadow-lg);z-index:100;
  opacity:0;pointer-events:none;transition:.2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ============================================================
   抽屉 / 弹窗
   ============================================================ */
.drawer-mask{
  position:fixed;inset:0;background:rgba(32,33,36,.35);
  z-index:80;opacity:0;pointer-events:none;transition:.2s;
}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:420px;max-width:100vw;background:#fff;
  border-left:1px solid var(--border);
  z-index:81;transform:translateX(100%);
  transition:.25s ease;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.drawer.show{transform:translateX(0)}
.drawer-head{
  height:var(--topbar-h);display:flex;align-items:center;gap:var(--s3);
  padding:0 var(--s5);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.drawer-title{font-size:15px;font-weight:600;flex:1}
.drawer-body{
  flex:1;overflow-y:auto;padding:var(--s5);
}
.drawer-foot{
  padding:var(--s3) var(--s5);
  border-top:1px solid var(--border);
  display:flex;gap:var(--s2);justify-content:flex-end;
  flex-shrink:0;
}

.help-popover{
  position:fixed;z-index:90;
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r);
  box-shadow:var(--shadow-lg);
  padding:var(--s4);width:320px;max-width:calc(100vw - 32px);
  display:none;
}
.help-popover.show{display:block}
.help-popover h4{font-size:14px;margin-bottom:6px}
.help-popover p{font-size:13px;color:var(--text-2);margin-bottom:6px;line-height:1.6}
.help-popover .pop-foot{
  margin-top:var(--s3);padding-top:var(--s3);
  border-top:1px solid var(--border-2);
  font-size:11px;color:var(--text-3);display:flex;justify-content:space-between;
}
.help-popover .pop-close{
  position:absolute;top:8px;right:8px;
  width:24px;height:24px;border-radius:6px;
  color:var(--text-3);display:flex;align-items:center;justify-content:center;
}
.help-popover .pop-close:hover{background:var(--surface-2);color:var(--text)}

/* ============================================================
   收集箱 / 搜索结果
   ============================================================ */
.inbox-list{display:flex;flex-direction:column;gap:8px}
.inbox-item{
  display:flex;align-items:center;gap:var(--s3);
  padding:12px var(--s3);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
}
.inbox-icon{
  width:32px;height:32px;border-radius:8px;
  background:var(--surface-2);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.inbox-text{flex:1;min-width:0}
.inbox-text p{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inbox-text .inbox-meta{font-size:11.5px;color:var(--text-3);margin-top:2px}
.inbox-actions{display:flex;gap:6px;flex-shrink:0}
.inbox-status{
  font-size:11px;padding:1px 8px;border-radius:var(--r-pill);
  background:var(--bg);color:var(--text-2);
}
.inbox-status.confirmed{background:var(--accent-soft);color:var(--accent)}
.inbox-status.discarded{background:#FBEEEC;color:var(--red)}

.search-input{
  width:100%;padding:12px 14px 12px 40px;
  border:1px solid var(--border);border-radius:var(--r);
  background:#fff;font-size:14px;outline:0;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,87,.12)}
.search-wrap{position:relative;margin-bottom:var(--s4)}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-2)}

/* ============================================================
   AI 帮手
   ============================================================ */
.ai-thread{
  display:flex;flex-direction:column;gap:var(--s3);
  margin-bottom:var(--s4);
}
.ai-msg{
  padding:10px 14px;border-radius:var(--r);
  font-size:14px;line-height:1.6;max-width:88%;
  white-space:pre-wrap;word-break:break-word;
}
.ai-msg.user{background:var(--accent-soft);align-self:flex-end;color:var(--text)}
.ai-msg.bot{background:var(--surface-2);align-self:flex-start;border:1px solid var(--border)}
.ai-msg.error{background:#FBEEEC;color:var(--red);border:1px solid #F3C5BD}
.ai-msg .ai-label{font-size:11px;color:var(--text-3);margin-bottom:4px;display:block}

.ai-suggest{
  background:#fff;border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-top:8px;
  font-size:13px;display:flex;align-items:center;gap:8px;
}
.ai-suggest .icon{color:var(--accent)}
.ai-suggest .spacer{flex:1}

.ai-input{
  display:flex;gap:8px;align-items:flex-end;
  padding:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r);
}
.ai-input textarea{
  flex:1;border:0;background:transparent;outline:0;
  resize:none;min-height:24px;max-height:140px;
  font-size:14px;line-height:1.5;padding:6px;
}
.ai-quick-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.ai-quick{
  font-size:12px;padding:5px 10px;border-radius:var(--r-pill);
  background:#fff;border:1px solid var(--border);color:var(--text-2);
  cursor:pointer;transition:.12s;
}
.ai-quick:hover{border-color:var(--accent);color:var(--accent)}

/* ============================================================
   使用说明 / 更新日志
   ============================================================ */
.kb-group{margin-bottom:var(--s5)}
.kb-group h3{
  font-size:13px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-2);margin-bottom:var(--s3);
}
.kb-q{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;margin-bottom:6px;
}
.kb-q summary{
  font-size:14px;font-weight:500;cursor:pointer;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
}
.kb-q summary::-webkit-details-marker{display:none}
.kb-q summary::after{
  content:"";width:8px;height:8px;border-right:1.5px solid var(--text-2);
  border-bottom:1.5px solid var(--text-2);
  transform:rotate(-45deg);transition:.15s;
}
.kb-q[open] summary::after{transform:rotate(45deg)}
.kb-q p{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.7}

.changelog-item{
  display:flex;gap:var(--s4);
  padding:var(--s4) 0;border-bottom:1px solid var(--border-2);
}
.changelog-item:last-child{border-bottom:0}
.changelog-date{
  flex-shrink:0;width:96px;font-size:12px;color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
.changelog-body h4{font-size:14px;margin-bottom:6px}
.changelog-body ul{font-size:13px;color:var(--text-2);padding-left:18px;list-style:disc}
.changelog-body ul li{margin-bottom:2px}
.changelog-body .scope{font-size:11px;color:var(--text-3);margin-top:6px}

/* ============================================================
   底部导航（移动端）
   ============================================================ */
.bottom-nav{
  display:none;
  position:fixed;left:0;right:0;bottom:0;
  height:calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(10px);
  -webkit-backdrop-filter:saturate(180%) blur(10px);
  border-top:1px solid var(--border);
  z-index:40;
}
.bnav-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  height:100%;
}
.bnav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:11px;color:var(--text-2);
  transition:.12s;
}
.bnav-item.active{color:var(--accent);font-weight:500}
.bnav-item .icon{width:22px;height:22px}

/* ============================================================
   响应式
   ============================================================ */

/* 平板 */
@media (max-width:1024px){
  .layout{grid-template-columns:200px 1fr}
  .topnav{display:none}
  .topbar{padding:0 var(--s4)}
  .brand-name{display:none}
  .main{padding:var(--s5) var(--s4)}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .sidebar{padding:var(--s3) var(--s2)}
  .side-user{padding:10px}
  .side-user-name{font-size:13px}
  .side-item{padding:9px 10px;font-size:13px}
}

/* 手机 */
@media (max-width:640px){
  .topbar{padding:0 var(--s3);height:52px}
  :root{--topbar-h:52px}
  .main{padding:var(--s4) var(--s3)}
  .page-title{font-size:24px}
  .greeting-text h1{font-size:26px}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:var(--s2)}
  .stat-card{padding:var(--s3)}
  .stat-value{font-size:22px}
  .card{padding:var(--s4)}
  .task-source{display:none}
  .task-item{padding:10px;border-radius:8px}
  .drawer{width:100vw;max-width:100vw}
  .bottom-nav{display:none}             /* 侧栏常驻 → 不用底导 */
  .topbar-right .icon-btn[data-action="search"]{display:none}
  .topbar-right .icon-btn[data-action="ai"]{display:flex}
  .layout{grid-template-columns:160px 1fr;min-height:auto}
  .sidebar{padding:var(--s2) var(--s1)}
  .side-user{padding:8px;gap:7px}
  .side-avatar{width:32px;height:32px}
  .side-user-name{font-size:12px}
  .side-user-role{font-size:10px}
  .side-status{padding:4px 8px;font-size:11px}
  .side-label{font-size:10px;padding:4px 2px}
  .side-item{padding:7px 8px;font-size:11.5px;gap:7px}
  .side-item .badge{font-size:10px;padding:0 5px}
  .fab{display:none}                    /* 侧栏常驻 → 不用 fab AI 浮动 */
}

/* 极窄屏（360 宽） */
@media (max-width:380px){
  .stat-row{grid-template-columns:1fr 1fr;gap:8px}
  .stat-value{font-size:20px}
  .greeting-text h1{font-size:22px}
  .page-title{font-size:22px}
  .card{padding:14px}
  .bnav-item{font-size:10.5px}
  .bnav-item .icon{width:20px;height:20px}
}

/* ============================================================
   工具：开关
   ============================================================ */
.switch{position:relative;width:38px;height:22px;background:var(--border);border-radius:11px;cursor:pointer;transition:.15s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:.15s}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px}

.divider{height:1px;background:var(--border-2);margin:var(--s4) 0}

/* ============================================================
   浮动帮助按钮（右下角）
   ============================================================ */
.fab{
  position:fixed;right:24px;bottom:24px;
  width:48px;height:48px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(47,107,87,.35);
  z-index:35;transition:.15s;
}
.fab:hover{transform:translateY(-2px)}
@media (max-width:640px){
  .fab{bottom:calc(var(--bnav-h) + env(safe-area-inset-bottom, 0px) + 16px);right:16px}
}

/* ============================================================
   课程备课 · 块编辑器
   ============================================================ */
.course-tabs{
  display:flex;gap:8px;margin-bottom:var(--s4);
  border-bottom:2px solid #B9956D;padding-bottom:8px;
  overflow-x:auto;scrollbar-width:none;
}
.course-tabs::-webkit-scrollbar{display:none}
.course-tab{
  padding:7px 16px;border-radius:var(--r-pill);
  color:var(--text-2);font-size:13px;cursor:pointer;
  white-space:nowrap;transition:.12s;display:flex;align-items:center;gap:6px;
  border:2px solid transparent;
}
.course-tab:hover{background:var(--surface-2);color:var(--text)}
.course-tab.active{
  background:var(--tab-color,var(--accent-soft));
  color:#3A2511;font-weight:700;
  border:2px solid #5C4423;
  box-shadow:2px 2px 0 0 #5C4423;
}
.course-tab .count{font-size:11px;color:var(--text-3);background:#fff;padding:0 6px;border-radius:var(--r-pill);border:1px solid var(--border);font-weight:600}
.course-tab.active .count{background:#fff;color:#3A2511;border-color:#5C4423}
.course-tab-add{
  background:#FFFAEC;color:#5C4423;
  border:2px dashed #B9956D;
  font-weight:700;
}
.course-tab-add:hover{
  background:#FFE8D8;color:#C9583F;
  border-color:#C9583F;
  border-style:solid;
}
.course-tab-del{
  margin-left:4px;font-size:13px;font-weight:800;
  padding:0 6px;border-radius:6px;color:var(--text-3);
  cursor:pointer;line-height:1.1;transition:.12s;
}
.course-tab-del:hover{background:rgba(214,134,122,.22);color:#A0463B}

.course-toolbar-row{
  display:flex;gap:8px;align-items:center;margin-bottom:var(--s4);flex-wrap:wrap;
}
.course-search{flex:1;min-width:200px;margin:0}

.doc-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:var(--s3);
}
.doc-card{
  background:#FFFAEC;border:2px solid #D5C9A0;
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:.12s;
  display:flex;flex-direction:column;gap:8px;
  position:relative;box-shadow:2px 2px 0 0 #B9956D;
}
.doc-card:hover{border-color:#E8836E;box-shadow:3px 3px 0 0 #B9956D;background:#FFF1D4}
.doc-card-title{
  font-size:15px;font-weight:700;line-height:1.4;color:#3A2511;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.doc-card-meta{
  font-size:11.5px;color:#7B5A0A;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;
}
.doc-card-preview{
  font-size:12.5px;color:var(--text-2);
  line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.doc-card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.doc-tag{
  font-size:10.5px;padding:2px 8px;border-radius:var(--r-pill);
  background:#FFE8D8;color:#A0463B;border:1px solid #D5C9A0;
}

/* ====== 课程文档 · 多选模式 ====== */
.multi-toolbar{
  display:flex;align-items:center;gap:10px;
  background:#FFF5E0;border:2px solid #2A1810;border-radius:14px;
  padding:10px 14px;margin-bottom:14px;
  box-shadow:3px 3px 0 0 #2A1810;
  flex-wrap:wrap;
}
.multi-toolbar-info{font-weight:700;color:#3A2511;font-size:14px;display:flex;align-items:center;gap:6px}
.multi-toolbar-info .badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 8px;
  background:#E8836E;color:#fff;border-radius:12px;font-size:13px;
}
.multi-toolbar-spacer{flex:1}
.multi-toolbar .btn{font-size:12.5px;padding:5px 12px}

.doc-card-check{
  position:absolute;top:8px;left:8px;
  width:26px;height:26px;
  background:#FFF5E0;border:2px solid #2A1810;
  display:none;
  align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;font-weight:700;color:#2A1810;
  user-select:none;
  box-shadow:1px 1px 0 0 #2A1810;
  border-radius:6px;
  z-index:2;
}
.doc-grid-multi-mode .doc-card-check{display:flex}
.doc-grid-multi-mode .doc-card.selected{
  background:#FFE8D5;border-color:#E8836E;
  box-shadow:3px 3px 0 0 #E8836E;
}
.doc-grid-multi-mode .doc-card.selected .doc-card-check{
  background:#E8836E;color:#fff;border-color:#2A1810;
}
.doc-grid-multi-mode .doc-card{cursor:pointer}
.doc-grid-multi-mode .doc-card-title{padding-left:32px}

/* 文档编辑器 */
.editor-shell{
  background:#FFFAEC;border:2px solid #D5C9A0;
  border-radius:var(--r);
  box-shadow:3px 3px 0 0 #B9956D;
  /* overflow 不能 hidden，否则 .editor-toolbar 的 sticky 被屏蔽 */
}
.editor-head{
  padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--border-2);
}
.doc-title-input{
  width:100%;border:0;outline:0;
  font-size:22px;font-weight:600;
  background:transparent;color:var(--text);
  padding:6px 0;
  font-family:inherit;
}
.doc-title-input::placeholder{color:var(--text-3);font-weight:400}
.doc-meta-row{
  display:flex;align-items:center;gap:var(--s3);
  margin-top:8px;font-size:12px;color:var(--text-2);
  flex-wrap:wrap;
}
.save-status{display:flex;align-items:center;gap:5px}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.save-status.saved .dot{background:var(--green)}
.save-status.saving .dot{background:var(--orange);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* 工具栏 */
.editor-toolbar{
  display:flex;align-items:center;gap:2px;
  padding:6px var(--s4);
  background:var(--surface-2);
  border-bottom:1px solid var(--border-2);
  overflow-x:auto;scrollbar-width:none;
  position:sticky;top:var(--topbar-h);z-index:5;
}
.editor-toolbar::-webkit-scrollbar{display:none}
.tb-group{display:flex;align-items:center;gap:1px;padding:0 4px;border-right:1px solid var(--border);flex-shrink:0}
.tb-group:last-child{border-right:0}
.tb-btn{
  width:30px;height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:.1s;flex-shrink:0;
}
.tb-btn:hover{background:#fff;color:var(--text)}
.tb-btn.active{background:#fff;color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tb-btn .icon{width:16px;height:16px}
.tb-select{
  height:30px;border:0;background:transparent;
  font-size:12px;color:var(--text-2);padding:0 8px;
  border-radius:6px;cursor:pointer;outline:0;
}
.tb-select:hover{background:#fff;color:var(--text)}
.tb-color-row{display:flex;gap:3px;padding:0 4px;align-items:center}
.tb-color{
  width:20px;height:20px;border-radius:4px;cursor:pointer;
  border:1.5px solid transparent;transition:.1s;flex-shrink:0;
}
.tb-color:hover{transform:scale(1.1)}
.tb-color.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
.tb-color-custom{
  width:20px;height:20px;border-radius:4px;cursor:pointer;
  border:1.5px dashed #888;background:#fff !important;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#888;font-weight:600;
}
.tb-color-custom:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.1)}
.tb-hl{
  width:20px;height:20px;border-radius:4px;cursor:pointer;
  border:1.5px solid transparent;transition:.1s;flex-shrink:0;
  position:relative;
}
.tb-hl:hover{transform:scale(1.1)}
.tb-hl.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
.tb-hl-none{
  background:#fff !important;border:1.5px dashed #aaa;color:#aaa;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.tb-hl-none:hover{border-color:var(--accent);color:var(--accent)}

/* 块 */
.editor-body{
  padding:var(--s5) var(--s5) var(--s10);
  min-height:400px;
  max-width:780px;margin:0 auto;
}
.block-row{
  display:flex;align-items:flex-start;gap:4px;
  position:relative;
  margin:0 -36px;
  padding:0 36px;
}
.block-row:hover .block-gutter{opacity:1}
.block-gutter{
  position:absolute;left:0;top:2px;
  display:flex;gap:1px;opacity:0;transition:.12s;
}
.block-gutter button{
  width:22px;height:22px;border-radius:4px;
  color:var(--text-3);display:flex;align-items:center;justify-content:center;
}
.block-gutter button:hover{background:var(--surface-2);color:var(--text)}
.block-gutter .icon{width:14px;height:14px}

.block{
  flex:1;min-width:0;
  padding:4px 0;
  outline:0;
  word-break:break-word;
  position:relative;
}
.block[contenteditable]:empty:before{
  content:attr(data-placeholder);
  color:var(--text-3);pointer-events:none;
}
.block-h1{font-size:26px;font-weight:600;line-height:1.3}
.block-h2{font-size:21px;font-weight:600;line-height:1.35}
.block-h3{font-size:17px;font-weight:600;line-height:1.4}
.block-p{font-size:15px;line-height:1.7}
.block-quote{
  border-left:3px solid var(--accent);
  padding:6px 0 6px 14px;color:var(--text-2);
  font-style:italic;
}
.block-code{
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:8px;padding:10px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
  white-space:pre-wrap;
}
.block-list{display:flex;align-items:flex-start;gap:8px}
.block-list .bullet{color:var(--text-2);user-select:none;flex-shrink:0;margin-top:1px}

/* 表格块（Markdown 导入） */
.block-table-wrap{margin:6px 0;overflow-x:auto}
.block-table{
  width:100%;border-collapse:collapse;
  font-size:13.5px;border:2px solid #D5C9A0;
  background:#FFFAEC;
}
.block-table th,.block-table td{
  border:1px solid #D5C9A0;padding:6px 10px;
  text-align:left;min-width:60px;
  vertical-align:top;
}
.block-table th{
  background:#F4EFC8;font-weight:700;color:#3A2511;
}
.block-table tr:nth-child(even) td{background:#FFF1D4}

.block-img,.block-video{
  margin:8px 0;
  border-radius:10px;overflow:hidden;
  border:1px solid var(--border);
  background:var(--surface-2);
}
.block-img img,.block-video video{
  display:block;max-width:100%;height:auto;
  margin:0 auto;
}
.block-img .img-caption,.block-video .vid-caption{
  font-size:12px;color:var(--text-2);
  padding:6px 12px;text-align:center;
  background:#fff;border-top:1px solid var(--border-2);
}
.block-video .vid-embed{
  position:relative;padding-bottom:56.25%;height:0;
}
.block-video .vid-embed iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
}

.block-link{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;margin:6px 0;
  background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:10px;text-decoration:none;color:inherit;
  transition:.12s;
}
.block-link:hover{border-color:var(--accent);background:#fff}
.block-link .icon{color:var(--accent);flex-shrink:0}
.block-link-text{flex:1;min-width:0}
.block-link-text .link-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-link-text .link-url{font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 注释块 - 4 个等级 */
.note-block{
  margin:8px 0;padding:12px 14px;
  border-radius:10px;
  border-left:4px solid;
  display:flex;gap:10px;align-items:flex-start;
}
.note-block .note-icon{
  width:24px;height:24px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.note-block .note-body{flex:1;min-width:0}
.note-block .note-label{
  font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px;
}
.note-block .note-content{
  font-size:14px;line-height:1.6;outline:0;
}
.note-block .note-content:empty:before{
  content:attr(data-placeholder);color:var(--text-3);
}

/* 行内备注高亮（在正文中选中后加的 inline note） */
.inline-note{cursor:help;transition:.12s}
.inline-note:hover{box-shadow:0 0 0 2px rgba(197,82,62,.18);border-radius:2px}

/* 备注弹窗（点工具栏"备注"按钮给选区加备注） */
.note-popover{
  position:fixed;z-index:200;
  background:#FFF5E0;border:2px solid #2A1810;
  border-radius:10px;
  box-shadow:4px 4px 0 0 #2A1810;
  padding:12px;width:280px;
  font-family:var(--font);
}
.note-popover-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:600;color:#2A1810;margin-bottom:8px;
}
.note-popover-head button{
  background:transparent;border:0;cursor:pointer;font-size:18px;color:#7B3413;padding:0 4px;
}
.note-popover-level{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;
  font-size:12px;color:#2A1810;
}
.note-popover-level label{display:flex;align-items:center;gap:3px;cursor:pointer;padding:2px 6px;border:1px solid #C2A181;border-radius:5px;background:#FFFAEB}
.note-popover-level input{accent-color:var(--accent)}
.note-popover textarea{
  width:100%;padding:6px 8px;border:1.5px solid #2A1810;border-radius:6px;
  font:inherit;font-size:13px;background:#FFF5E0;resize:vertical;
  box-sizing:border-box;
}
.note-popover-actions{
  display:flex;gap:6px;justify-content:flex-end;margin-top:8px;
}
.note-popover .btn-primary{background:linear-gradient(180deg,#FF9A87 0%,#E8836E 100%);color:#FFF5E0;border:2px solid #B95A48}
.note-popover .btn-primary:hover{background:linear-gradient(180deg,#FFB199 0%,#E8836E 100%)}
.note-tip{background:#F0F7F1;border-color:#5C9D75;color:#244733}
.note-tip .note-icon{background:#5C9D75;color:#fff}
.note-info{background:#EAF1F8;border-color:#6B91BC;color:#1F3A5F}
.note-info .note-icon{background:#6B91BC;color:#fff}
.note-warn{background:#FBF1E5;border-color:#D88C4A;color:#7A4A1B}
.note-warn .note-icon{background:#D88C4A;color:#fff}
.note-personal{background:#F8EEF5;border-color:#B97AA6;color:#6B2D55}
.note-personal .note-icon{background:#B97AA6;color:#fff}

/* 自定义颜色/高亮色 弹窗 */
.popover.cpp{
  background:#FFFAEB;border:2px solid #2A1810;border-radius:12px;
  box-shadow:4px 4px 0 0 #2A1810;padding:14px;width:300px;
  font-family:inherit;color:var(--text);z-index:120;
}
.popover.cpp .cpp-title{
  font-weight:700;font-size:14px;margin-bottom:10px;color:var(--accent);
}
/* RGB 调色盘：显眼的大按钮，点击调出系统色盘（H/S 调色区 + R/G/B 滑块） */
.popover.cpp .cpp-palette{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;height:64px;border-radius:10px;border:2px solid #2A1810;
  padding:8px 12px;cursor:pointer;
  box-shadow:2px 2px 0 0 #2A1810;
  font-family:inherit;font-size:12px;
  transition:transform .12s, box-shadow .12s;
  margin-bottom:10px;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.popover.cpp .cpp-palette:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 #2A1810}
.popover.cpp .cpp-palette:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810}
.popover.cpp .cpp-palette-label{
  font-weight:700;letter-spacing:.5px;font-size:12.5px;
  background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px;
}
.popover.cpp .cpp-palette-hex{
  font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.85);color:#2A1810;
  padding:3px 8px;border-radius:6px;letter-spacing:1px;
}
/* 系统 color input：保留在 DOM，但调色盘按钮代理点击它 */
.popover.cpp #cpp-native{
  position:absolute;width:0;height:0;opacity:0;pointer-events:none;
  left:-9999px;top:-9999px;
}
.popover.cpp .cpp-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.popover.cpp .cpp-row label{font-size:12px;color:var(--text-2);min-width:36px;font-weight:600}
.popover.cpp #cpp-hex{
  flex:1;padding:6px 10px;font:13px ui-monospace,Consolas,monospace;
  border:2px solid #2A1810;border-radius:8px;background:#fff;color:var(--text);
  letter-spacing:1px;text-transform:uppercase;
}
.popover.cpp #cpp-hex:focus{outline:none;border-color:var(--accent);background:#FFF5E0}
/* RGB 三通道：每通道 [-] [输入框 R 197] [+] 可调 */
.popover.cpp .cpp-rgb-row{
  display:flex;gap:6px;margin-bottom:10px;
}
.popover.cpp .cpp-rgb-chip{
  flex:1;display:flex;align-items:center;gap:2px;
  padding:3px 4px;border:2px solid #2A1810;border-radius:8px;background:#fff;
}
.popover.cpp .cpp-rgb-chip.r label{color:#C5523E}
.popover.cpp .cpp-rgb-chip.g label{color:#2F6B57}
.popover.cpp .cpp-rgb-chip.b label{color:#3B6BB0}
.popover.cpp .cpp-rgb-chip label{
  font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;
  flex-shrink:0;
}
.popover.cpp .cpp-rgb-chip input[type="number"]{
  flex:1;min-width:30px;width:100%;
  padding:3px 2px;font:600 12px ui-monospace,Consolas,monospace;
  border:none;background:transparent;color:var(--text);text-align:center;
  -moz-appearance:textfield;
}
.popover.cpp .cpp-rgb-chip input[type="number"]::-webkit-outer-spin-button,
.popover.cpp .cpp-rgb-chip input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}
.popover.cpp .cpp-rgb-chip input[type="number"]:focus{
  outline:none;background:#FFF5E0;border-radius:4px;
}
.popover.cpp .cpp-rgb-step{
  flex-shrink:0;width:20px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font:700 14px ui-monospace,Consolas,monospace;
  background:#FFFAEB;border:1.5px solid #2A1810;border-radius:5px;
  cursor:pointer;color:var(--text);padding:0;
  transition:all .12s;
}
.popover.cpp .cpp-rgb-step:hover{background:#F4D85A}
.popover.cpp .cpp-rgb-step:active{transform:scale(.85)}
.popover.cpp .cpp-recent-title{font-size:11px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.popover.cpp .cpp-recent{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.popover.cpp .cpp-recent-swatch{
  width:24px;height:24px;border-radius:6px;border:1.5px solid #2A1810;
  cursor:pointer;transition:transform .12s;
}
.popover.cpp .cpp-recent-swatch:hover{transform:scale(1.12)}
.popover.cpp .cpp-actions{display:flex;gap:8px;justify-content:flex-end}
.popover.cpp .cpp-btn{
  padding:7px 14px;font-size:13px;font-weight:600;
  border:2px solid #2A1810;border-radius:8px;cursor:pointer;
  font-family:inherit;transition:all .12s;
}
.popover.cpp .cpp-cancel{background:#fff;color:var(--text)}
.popover.cpp .cpp-cancel:hover{background:#F0EDE5}
.popover.cpp .cpp-apply{background:linear-gradient(180deg,#FF9A87 0%,#E8836E 100%);color:#FFF5E0;box-shadow:2px 2px 0 0 #2A1810;border:2px solid #5C4423}
.popover.cpp .cpp-apply:hover{background:linear-gradient(180deg,#FFB199 0%,#E8836E 100%);transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 #2A1810}
.popover.cpp .cpp-apply:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810}

/* 块操作菜单 */

/* 插入块选择器 */

  font-weight:700;cursor:pointer;color:var(--text);font-family:inherit;
  transition:all .12s;
}
.period-step:hover{background:#F4D85A}

.period-cycle-num{

}

.period-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}

}
.period-cell.is-pred{

}

.period-legend{

.period-legend .dot-pred{
  background:#F5DBEA;border-color:#E9A8CF;

}

.period-history{display:flex;flex-direction:column;gap:8px}
.period-row{
  display:flex;align-items:center;gap:10px;

  background:var(--surface-2);
}
.period-row-main{flex:1;min-width:0}
.period-row-date{
  font:600 13px ui-monospace,Consolas,monospace;color:var(--text);
}

}

.period-row-actions .btn-icon{

}
.period-row-actions .btn-icon:hover{background:#F0EDE5}
.period-row-actions .btn-icon:active{transform:scale(.95)}

/* 浮动 + 按钮 */
.fab-add{

}

}

.popover.period-editor .cpp-btn{

}
.popover.period-editor .cpp-cancel{background:#fff;color:var(--text)}
.popover.period-editor .cpp-cancel:hover{background:#F0EDE5}
.popover.period-editor .cpp-apply{
  background:#E9A8CF;color:#5C2842;box-shadow:2px 2px 0 0 #2A1810;
}
.popover.period-editor .cpp-apply:hover{background:#C77BAA;color:#fff;
  transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 #2A1810}
.popover.period-editor .cpp-apply:active{transform:translate(1px,1px);box-shadow:1px 1px 0 0 #2A1810}

/* ============================================================
   存钱账本

}

}

}

}

}

.fin-summary{

}
.fin-sum-cell{

}
.fin-sum-cell.in{border-color:rgba(91,174,116,.25);background:#EAF6ED}
.fin-sum-cell.out{border-color:rgba(214,134,122,.25);background:#FBEEEC}

.fin-sum-num{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fin-sum-cell.in  .fin-sum-num{color:#5BAE74}
.fin-sum-cell.out .fin-sum-num{color:#A06A5C}
.fin-sum-cell.net .fin-sum-num{color:#8A6A12}

.fin-list{display:flex;flex-direction:column;gap:6px}
.fin-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:#FBFBF9;border-radius:10px;
  border:1px solid var(--border-2);
}
.fin-row:hover{background:#F4F2EC}
.fin-tag{
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;

}
.fin-tag.in{background:#E7F4EA;color:#5BAE74;border:1px solid #B7D8C2}
.fin-tag.out{background:#F5E6E1;color:#A06A5C;border:1px solid #DDB7AC}
.fin-row-main{flex:1;min-width:0}
.fin-row-line1{
  display:flex;align-items:baseline;gap:8px;
}
.fin-row-cat{font-weight:600;color:var(--text);font-size:14px}
.fin-row-amount{
  font-weight:700;font-size:14px;

}

.fin-row-amount.out{color:#A06A5C}
.fin-row-line2{

}

.fin-row-actions{display:flex;gap:4px;flex-shrink:0}
.fin-row-actions .btn-icon{

  display:flex;align-items:center;justify-content:center;
}
.fin-row-actions .btn-icon:hover{background:#E8E5DC;color:var(--text)}

.fin-cat-strip{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;
}
.fin-cat-chip{
  font-size:11px;padding:3px 8px;border-radius:6px;
  background:#FBFBF9;border:1px solid var(--border-2);
  color:var(--text-2);font-weight:500;
}

.popover.fin-editor .cpp-type{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-radius:10px;overflow:hidden;margin-bottom:12px;
  border:1px solid var(--border-2);
}
.popover.fin-editor .cpp-type-btn{
  padding:8px 10px;font-size:13px;font-weight:600;
  background:#FBFBF9;color:var(--text-2);

}
.popover.fin-editor .cpp-type-btn.in.on{
  background:#E7F4EA;color:#5BAE74;
  box-shadow:inset 0 -3px 0 #5BAE74;
}
.popover.fin-editor .cpp-type-btn.out.on{
  background:#F5E6E1;color:#A06A5C;
  box-shadow:inset 0 -3px 0 #A06A5C;
}
.popover.fin-editor .cpp-amount-input{
  width:100%;font-size:22px;font-weight:700;
  text-align:right;padding:8px 10px;border-radius:8px;
