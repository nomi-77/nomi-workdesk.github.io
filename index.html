function docToMarkdown(doc){
  let md = `# ${doc.title}\n\n`;
  if(doc.tags?.length) md += `**标签**：${doc.tags.map(t=>`\`${t}\``).join(' ')}\n\n`;
  // 行内 span -> markdown：粗体 **、斜体 *、下划线 <u>、其他（颜色/字号）保留文本
  const htmlToMd = (s) => {
    if(!s) return '';
    let out = '';
    const walk = (n) => {
      if(n.nodeType===3){ out += n.textContent; return; }
      if(n.nodeType===1){
        if(n.tagName==='BR'){ out += '  \n'; return; }
        const style = n.style || {};
        const fw = style.fontWeight;
        const fs = style.fontStyle;
        const td = style.textDecoration;
        const openMarks = [];
        const closeMarks = [];
        // bold
        if(fw==='bold' || fw==='700' || fw==='600'){ openMarks.push('**'); closeMarks.unshift('**'); }
        // italic
        if(fs==='italic'){ openMarks.push('*'); closeMarks.unshift('*'); }
        // underline (markdown 不原生支持，用 HTML)
        if(td && td.includes('underline')){ openMarks.push('<u>'); closeMarks.unshift('</u>'); }
        // 颜色 / 字号：HTML 标 span（导出 HTML 时识别）
        if(style.color){
          const c = style.color.replace(/"/g,'');
          openMarks.unshift(`<span style="color:${c}">`);
          closeMarks.push('</span>');
        }
        if(style.fontSize){
          const fs2 = style.fontSize.replace(/"/g,'');
          openMarks.unshift(`<span style="font-size:${fs2}">`);
          closeMarks.push('</span>');
        }
        if(n.dataset?.mentionDoc){
          // mention：在 markdown 转 [title](#doc-id)
          const d = getDocById(n.dataset.mentionDoc);
          if(d) out += `[${d.title}](#doc-${n.dataset.mentionDoc})`;
          else out += '@已删除';
          return;
        }
        out += openMarks.join('');
        n.childNodes.forEach(walk);
        out += closeMarks.join('');
      }
    };
    // 把字符串转成 DOM 再走 walker
    const wrap = document.createElement('div');
    wrap.innerHTML = s;
    wrap.childNodes.forEach(walk);
    return out;
  };
  (doc.blocks||[]).forEach(b => {
    const t = htmlToMd(b.text||'').replace(/@doc:([\w-]+)/g, (_,id) => {
      const d = getDocById(id); return d ? `[${d.title}](#doc-${id})` : '@已删除';
    });
    if(b.type==='h1') md += `# ${t}\n\n`;
    else if(b.type==='h2') md += `## ${t}\n\n`;
    else if(b.type==='h3') md += `### ${t}\n\n`;
    else if(b.type==='list') md += `- ${t}\n`;
    else if(b.type==='quote') md += `> ${t}\n\n`;
    else if(b.type==='code') md += '```\n' + t + '\n```\n\n';
    else if(b.type==='table' && Array.isArray(b.rows)){
      b.rows.forEach((row, ri) => {
        md += '| ' + row.join(' | ') + ' |\n';
        if(ri === 0) md += '| ' + row.map(()=>'---').join(' | ') + ' |\n';
      });
      md += '\n';
    }
    else if(b.type==='note'){
      const lvl = b.level || 'tip';
      const tag = {tip:'教学提示',info:'补充信息',warn:'易错提醒',personal:'个人备忘'}[lvl];
      md += `> **${tag}**：${t}\n\n`;
    }
    else if(b.type==='image') md += b.src ? `![${b.alt||''}](${b.src})\n\n` : '';
    else if(b.type==='video') md += b.url ? `[视频](${b.url})\n\n` : '';
    else if(b.type==='link') md += b.url ? `[${b.title||b.url}](${b.url})\n\n` : '';
    else if(b.type==='divider') md += `---\n\n`;
    else if(b.type==='p') md += t + '\n\n';
  });
  return md.trim() + '\n';
}

// @mention 自动完成（两个 tab：文档列表 / 全文搜索）
function openMention(anchorBlockId, rect){
  closeMention();
  const docs = getAllCourseDocs();
  const pop = document.createElement('div');
  pop.className = 'mention-pop show';
  pop.id = 'mention-pop-active';
  pop.innerHTML = `
    <div class="mention-tabs">
      <button class="mention-tab active" data-mtab="docs">文档 (${docs.length})</button>
      <button class="mention-tab" data-mtab="search">全文搜索</button>
    </div>
    <div class="mention-tab-pane" id="mention-pane-docs">
      ${docs.map((d,i) => `
        <div class="mention-item ${i===0?'active':''}" data-mention-id="${d.id}" data-mention-idx="${i}">
          ${icon(getCourseMeta(d.course).icon,'icon-sm')}
          <span>${escapeHtml(d.title)}</span>
          <span class="muted" style="font-size:11px;margin-left:auto">${d.course}</span>
        </div>
      `).join('') || '<div class="mention-item" style="color:var(--text-3)">没有可关联的文档</div>'}
    </div>
    <div class="mention-tab-pane" id="mention-pane-search" style="display:none">
      <input class="mention-search-input" id="mention-search-input" placeholder="搜关键词（匹配文档内任意段落）"/>
      <div class="mention-search-results" id="mention-search-results">
        <div class="mention-item" style="color:var(--text-3)">输入关键词搜索笔记内容</div>
      </div>
    </div>
  `;
  pop.style.left = rect.left + 'px';
  pop.style.top  = (rect.bottom + 4) + 'px';
  pop.style.minWidth = '320px';
  pop.style.maxWidth = '480px';
  document.body.appendChild(pop);
  currentMention = {anchorBlockId, items: docs, index: 0, pop, mode: 'docs'};
  // tab 切换
  pop.querySelectorAll('.mention-tab').forEach(t => {
    t.onclick = () => {
      pop.querySelectorAll('.mention-tab').forEach(x => x.classList.toggle('active', x===t));
      const mode = t.dataset.mtab;
      currentMention.mode = mode;
      document.getElementById('mention-pane-docs').style.display = mode==='docs' ? '' : 'none';
      document.getElementById('mention-pane-search').style.display = mode==='search' ? '' : 'none';
      if(mode==='search'){
        const inp = document.getElementById('mention-search-input');
        if(inp) setTimeout(()=>inp.focus(), 30);
      }
    };
  });
  // 文档列表点击
  pop.querySelectorAll('[data-mention-id]').forEach(it => {
    it.onclick = () => {
      const id = it.dataset.mentionId;
      const blockId = it.dataset.mentionBlockId || null;
      if(id) insertMention(id, blockId);
    };
  });
  // 全文搜索输入
  const searchInput = pop.querySelector('#mention-search-input');
  if(searchInput){
    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim();
      renderMentionSearchResults(q);
    });
  }
}
function renderMentionSearchResults(q){
  const pop = document.getElementById('mention-pop-active');
  if(!pop) return;
  const out = document.getElementById('mention-search-results');
  if(!q){ out.innerHTML = '<div class="mention-item" style="color:var(--text-3)">输入关键词搜索笔记内容</div>'; return; }
  const docs = getAllCourseDocs();
  const ql = q.toLowerCase();
  const hits = [];
  docs.forEach(d => {
    (d.blocks||[]).forEach(b => {
      const txt = String(b.text||'').replace(/<[^>]+>/g,' ').replace(/@doc:[\w-]+/g,'').trim();
      const idx = txt.toLowerCase().indexOf(ql);
      if(idx < 0) return;
      // 截取上下文（关键词前后各 30 字）
      const start = Math.max(0, idx - 30);
      const end   = Math.min(txt.length, idx + q.length + 30);
      const before = (start > 0 ? '…' : '') + txt.slice(start, idx);
      const match  = txt.slice(idx, idx + q.length);
      const after  = txt.slice(idx + q.length, end) + (end < txt.length ? '…' : '');
      hits.push({
        docId: d.id, docTitle: d.title, blockId: b.id, blockType: b.type,
        before, match, after
      });
      if(hits.length >= 30) return;
    });
  });
  if(hits.length === 0){
    out.innerHTML = `<div class="mention-item" style="color:var(--text-3)">没找到包含 "${escapeHtml(q)}" 的段落</div>`;
    return;
  }
  out.innerHTML = hits.map((h, i) => `
    <div class="mention-item ${i===0?'active':''}" data-mention-id="${h.docId}" data-mention-block-id="${h.blockId}">
      <span class="mention-snippet-icon">${icon(COURSE_META[getDocById(h.docId)?.course||'EV3']?.icon||'book','icon-sm')}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;color:var(--text)">${escapeHtml(h.docTitle)} <span style="color:var(--text-3);font-size:11px">· ${h.blockType}</span></div>
        <div style="font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.4;word-break:break-word">${escapeHtml(h.before)}<mark style="background:#FFF2A8;color:#2A1810;padding:0 1px">${escapeHtml(h.match)}</mark>${escapeHtml(h.after)}</div>
      </div>
    </div>
  `).join('');
  // 重新绑定点击
  out.querySelectorAll('[data-mention-id]').forEach(it => {
    it.onclick = () => {
      const id = it.dataset.mentionId;
      const blockId = it.dataset.mentionBlockId || null;
      if(id) insertMention(id, blockId);
    };
  });
}
function closeMention(){
  const p = document.getElementById('mention-pop-active');
  if(p) p.remove();
  currentMention = null;
}
function insertMention(docId, blockId){
  const doc = getCurrentDoc();
  if(!doc || !currentMention) return;
  const target = getDocById(docId);
  if(!target) return;
  const anchorBlockId = currentMention.anchorBlockId;
  const b = findBlockInDoc(doc, anchorBlockId);
  if(!b) return;
  // 段落级 mention：用 @doc:<id>#b:<blockId>，文档级用 @doc:<id>
  const mentionTag = blockId ? `@doc:${docId}#b:${blockId}` : `@doc:${docId}`;
  const refTitle = blockId ? `${target.title}·段落` : target.title;
  const mentionText = `@${refTitle}`;
  b.text = (b.text || '') + ' ' + mentionText + ' ';
  addBlockAfter(anchorBlockId, {type:'p', text:''});
  closeMention();
  renderRoute();
}

// 工具栏按钮
function handleToolbar(cmd, btn){
  const doc = getCurrentDoc(); if(!doc) return;
  const sel = window.getSelection();
  let blockEl = null;
  if(sel.rangeCount){
    let n = sel.anchorNode;
    while(n && n!==document.body){
      if(n.nodeType===1 && n.dataset?.blockId){ blockEl = n; break; }
      n = n.parentNode;
    }
  }
  const blockId = blockEl?.dataset?.blockId;

  switch(cmd){
    case 'h1': case 'h2': case 'h3': case 'p': case 'list': case 'quote': case 'code':
      if(blockId) changeBlockType(blockId, cmd);
      break;
    case 'bold': case 'italic': case 'underline':
      document.execCommand(cmd);
      if(blockId) {
        const b = findBlockInDoc(doc, blockId);
        if(b){
          b.fmt = b.fmt || {};
          b.fmt[cmd] = !b.fmt[cmd];
          markEditorDirty();
        }
      }
      break;
    case 'size':{
      const v = btn?.value;
      if(v && blockId) applyBlockFormat(blockId, {size:v});
      break;
    }
    case 'color':{
      const k = btn?.dataset?.color;
      if(k && blockId) applyBlockFormat(blockId, {color:k});
      break;
    }
    case 'img': insertImageAfter(blockId); break;
    case 'video': insertVideoAfter(blockId); break;
    case 'link': insertLinkAfter(blockId); break;
    case 'note': insertNoteAfter(blockId); break;
    case 'mention': openMentionPicker(); break;
    case 'divider':{
      const newB = {id:bid(), type:'divider'};
      if(blockId) addBlockAfter(blockId, newB);
      else { doc.blocks.push(newB); markEditorDirty(); renderRoute(); }
      break;
    }
    case 'ul':
      if(blockId) changeBlockType(blockId, 'list');
      break;
    case 'ol':
      if(blockId){
        const b = findBlockInDoc(doc, blockId);
        b.fmt = b.fmt || {};
        b.fmt.ol = !b.fmt.ol;
        changeBlockType(blockId, 'list');
      }
      break;
    case 'undo': document.execCommand('undo'); break;
    case 'redo': document.execCommand('redo'); break;
  }
}

function openMentionPicker(){
  const doc = getCurrentDoc(); if(!doc) return;
  // 把光标定位到当前块末尾
  const sel = window.getSelection();
  let blockEl = null;
  if(sel.rangeCount){
    let n = sel.anchorNode;
    while(n && n!==document.body){
      if(n.nodeType===1 && n.dataset?.blockId){ blockEl = n; break; }
      n = n.parentNode;
    }
  }
  if(!blockEl){
    // 默认追加到末尾
    const last = doc.blocks[doc.blocks.length-1];
    if(last) blockEl = document.querySelector(`[data-block-id="${last.id}"]`);
  }
  if(!blockEl){ toast('先把光标放到一个文本块里'); return; }
  openMention(blockEl.dataset.blockId, blockEl.getBoundingClientRect());
}

function insertImageAfter(blockId){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 5*1024*1024){ toast('图片不能超过 5MB'); return; }
    const r = new FileReader();
    r.onload = ev => {
      const newB = {id:bid(), type:'image', src: ev.target.result, alt: f.name};
      if(blockId) addBlockAfter(blockId, newB);
      else {
        const doc = getCurrentDoc();
        doc.blocks.push(newB);
        markEditorDirty(); renderRoute();
      }
    };
    r.readAsDataURL(f);
  };
  input.click();
}

function insertVideoAfter(blockId){
  const url = prompt('视频链接（YouTube / B 站 / 腾讯视频 / 或本地 .mp4 路径）：');
  if(!url) return;
  const newB = {id:bid(), type:'video', url: url.trim(), caption: ''};
  if(blockId) addBlockAfter(blockId, newB);
  else {
    const doc = getCurrentDoc();
    doc.blocks.push(newB);
    markEditorDirty(); renderRoute();
  }
}

function insertLinkAfter(blockId){
  const url = prompt('链接 URL：', 'https://');
  if(!url) return;
  const title = prompt('链接标题（留空用 URL）：', '') || url;
  const newB = {id:bid(), type:'link', url: url.trim(), title};
  if(blockId) addBlockAfter(blockId, newB);
  else {
    const doc = getCurrentDoc();
    doc.blocks.push(newB);
    markEditorDirty(); renderRoute();
  }
}

function insertNoteAfter(blockId){
  const lvl = prompt('备注等级：1=教学提示  2=补充信息  3=易错提醒  4=个人备忘', '1');
  const map = {'1':'tip','2':'info','3':'warn','4':'personal'};
  const level = map[lvl] || 'tip';
  const newB = {id:bid(), type:'note', level, text:''};
  if(blockId) addBlockAfter(blockId, newB);
  else {
    const doc = getCurrentDoc();
    doc.blocks.push(newB);
    markEditorDirty(); renderRoute();
  }
}

function cycleNoteLevel(blockId){
  const order = ['tip','info','warn','personal'];
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, blockId); if(!b) return;
  const i = order.indexOf(b.level||'tip');
  b.level = order[(i+1) % order.length];
  markEditorDirty(); renderRoute();
}

function setDocDefaults(patch){
  const doc = getCurrentDoc(); if(!doc) return;
  doc.defaults = {...(doc.defaults||{}), ...patch};
  markEditorDirty();
  renderRoute();
}

// 搜索过滤
function filterCourseDocs(q){
  const docs = STATE.course[activeCourse] || [];
  if(!q) return docs;
  const lower = q.toLowerCase();
  return docs.filter(d => {
    if((d.title||'').toLowerCase().includes(lower)) return true;
    if((d.tags||[]).some(t => t.toLowerCase().includes(lower))) return true;
    return (d.blocks||[]).some(b => (b.text||'').toLowerCase().includes(lower));
  });
}

function restoreTrash(id){
  const idx = (STATE.courseTrash||[]).findIndex(d => d.id===id);
  if(idx<0) return;
  const d = STATE.courseTrash[idx];
  STATE.courseTrash.splice(idx,1);
  d.updatedAt = Date.now();
  delete d.deletedAt;
  STATE.course[d.course] = STATE.course[d.course] || [];
  STATE.course[d.course].unshift(d);
  saveState();
  renderRoute();
  toast('已恢复');
}
function purgeTrash(id){
  if(!confirm('永久删除？此操作不可撤销。')) return;
  STATE.courseTrash = (STATE.courseTrash||[]).filter(d => d.id!==id);
  saveState(); renderRoute(); toast('已永久删除');
}

   主渲染
   ============================================================ */
function renderRoute(){
  const r = currentRoute;
  let html = '';
  if(r==='today') html = renderToday();
  else if(r==='more') html = renderMore();
  else if(r==='settings') html = renderSettings();
  else if(r==='usage') html = renderUsage();
  else if(r==='changelog') html = renderChangelog();
  else if(r==='period') html = renderPeriod();
  else if(r==='finance') html = renderFinance();
  else if(r==='python'){
    // 默认 _activeIdx 设为今天第一个未完成
    const t = pyTodayProgress();
    if(typeof t._activeIdx !== 'number'){
      const first = t.results.findIndex(r => r.status === 'pending');
      t._activeIdx = first >= 0 ? first : 0;
    }
    html = renderPython();
  }
  else if(r==='course'){
    if(window._courseTrashView) html = showTrashView();
    else html = renderCourse();
  }
  else if(ROUTES[r]) html = renderModuleShell(r);
  else html = `<section class="page"><div class="empty-state"><h3>页面不存在</h3></div></section>`;

  main().innerHTML = html;
  highlightNav();
}

/* ============================================================
   AI 调用（DeepSeek / 通义 / OpenAI 兼容）
   ============================================================ */
async function callAI(messages){
  const s = STATE.settings;
  if(!s.apiKey) throw new Error('请先在设置里填 API Key');
  const r = await fetch(s.baseUrl, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + s.apiKey,
    },
    body: JSON.stringify({
      model: s.model,
      messages,
      temperature: 0.5,
      max_tokens: 1500,
    })
  });
  if(!r.ok){
    const t = await r.text().catch(()=>'');
    throw new Error('API ' + r.status + ' · ' + (t.slice(0,200) || r.statusText));
  }
  const j = await r.json();
  return j.choices?.[0]?.message?.content || '(空响应)';
}
async function sendAI(text){
  const thread = document.getElementById('ai-thread');
  thread.insertAdjacentHTML('beforeend', `
    <div class="ai-msg user">${escapeHtml(text)}</div>
    <div class="ai-msg bot" id="ai-loading"><span class="ai-label">AI 帮手</span>正在思考...</div>
  `);
  thread.scrollTop = thread.scrollHeight;
  try{
    const sys = {role:'system', content:`你是糯米的个人 AI 工作台助手。她是少儿编程教师（教 EV3/Scratch/Mixly/Python）。回答简洁（3-6 行），重要操作先列步骤让她点头。中文回复。`};
    const reply = await callAI([sys, {role:'user', content:text}]);
    const ld = document.getElementById('ai-loading');
    if(ld) ld.outerHTML = `<div class="ai-msg bot"><span class="ai-label">AI 帮手</span>${escapeHtml(reply)}</div>`;
    thread.scrollTop = thread.scrollHeight;
  }catch(e){
    const ld = document.getElementById('ai-loading');
    if(ld) ld.outerHTML = `<div class="ai-msg error">调用失败：${escapeHtml(e.message)}</div>`;
  }
}

document.addEventListener('click', e=>{
  // 关闭 popover
  if(!e.target.closest('#help-popover') && !e.target.closest('[data-help]')){
    hidePopover();
  }

  const t = e.target.closest('[data-route]');
  if(t){
    const r = t.dataset.route;
    if(r==='search'){ openDrawer('search'); return; }
    if(r==='ai'){ openDrawer('ai'); return; }
    currentRoute = r;
    closeAllDrawers();
    renderRoute();
    window.scrollTo(0,0);
    return;
  }

  const actBtn = e.target.closest('[data-action]');
  if(actBtn) handleAction(actBtn.dataset.action, actBtn, e);

  const helpEl = e.target.closest('[data-help]');
  if(helpEl){
    e.stopPropagation();
    showPopover(helpEl, helpEl.dataset.help);
    return;
  }
});

function handleAction(name, btn, e){
  switch(name){
    case 'toggle-task':{
      e?.stopPropagation();
      const id = btn.dataset.id;
      const t = STATE.today.tasks.find(x=>x.id===id);
      if(t){ t.done = !t.done; t.doneAt = t.done?Date.now():null; saveState(); renderRoute(); }
      break;
    }
    case 'expand-task':{
      const li = btn.closest('.px-task');
      if(!li) return;
      const wasOpen = li.classList.contains('expanded');
      // 关闭其他展开
      document.querySelectorAll('.px-task.expanded').forEach(x=>x.classList.remove('expanded'));
      if(!wasOpen) li.classList.add('expanded');
      break;
    }
    case 'edit-task':{
      e?.stopPropagation();
      const id = btn.dataset.id;
      const t = STATE.today.tasks.find(x=>x.id===id);
      if(!t) return;
      const newTitle = prompt('编辑任务标题', t.title);
      if(newTitle && newTitle.trim()){ t.title = newTitle.trim(); saveState(); renderRoute(); }
      break;
    }
    case 'add-task':{
      const title = prompt('新任务标题（留空取消）');
      if(!title) return;
      STATE.today.tasks.unshift({id:uid(),title,source:'todo',priority:'mid',done:false});
      saveState(); renderRoute();
      toast('已加入今日');
      break;
    }
    case 'open-profile':{
      openDrawer('profile');
      break;
    }
    case 'cycle-status':{
      const cur = (STATE.profile && STATE.profile.status) || '工作中';
      const idx = STATUS_CYCLE.indexOf(cur);
      const next = STATUS_CYCLE[(idx+1) % STATUS_CYCLE.length];
      STATE.profile = STATE.profile || {};
      STATE.profile.status = next;
      saveState();
      renderNav();
      toast('已切到 ' + next);
      break;
    }
    case 'add-course':{
      openAddCoursePop();
      break;
    }
    case 'delete-course':{
      const code = btn.dataset.course;
      const m = getCourseMeta(code);
      if(!m.custom){ toast('默认分类不能删'); return; }
      openDeleteCoursePop(code);
      break;
    }
    case 'purge-all-course-docs':{
      e?.stopPropagation();
      openPurgeAllCoursePop();
      break;
    }
    case 'edit-profile':{
      e?.stopPropagation();
      openDrawer('profile');
      break;
    }
    case 'profile-save':{
      const nick = document.getElementById('prof-nick').value.trim() || '糯米';
      const role = document.getElementById('prof-role').value.trim() || '';
      const sig  = document.getElementById('prof-sig').value.trim();
      const avatarData = window.__profileAvatarData || (STATE.profile&&STATE.profile.avatar) || './assets/char-sponge.png';
      STATE.profile = STATE.profile || {};
      STATE.profile.nickname = nick;
      STATE.profile.role = role;
      STATE.profile.signature = sig;
      STATE.profile.avatar = avatarData;
      saveState();
      closeAllDrawers();
      window.__profileAvatarData = null;
      renderRoute();
      toast('已保存到本地');
      break;
    }
    case 'profile-pick-avatar':{

function openBlockMenu(blockId, btn){
  closeBlockMenu();
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, blockId); if(!b) return;
  const menu = document.createElement('div');
  menu.className = 'block-menu show';
  menu.id = 'block-menu-active';
  menu.innerHTML = `
    <div class="menu-label">块操作</div>
    <button data-bm="up">${icon('up','icon-sm')} 上移</button>
    <button data-bm="down">${icon('down','icon-sm')} 下移</button>
    <button data-bm="dup">${icon('copy','icon-sm')} 复制</button>
    <div class="menu-divider"></div>
    <div class="menu-label">转为</div>
    <button data-bm="type:p">${icon('doc','icon-sm')} 正文</button>
    <button data-bm="type:h1">${icon('h1','icon-sm')} 一级标题</button>
    <button data-bm="type:h2">${icon('h2','icon-sm')} 二级标题</button>
    <button data-bm="type:h3">${icon('h3','icon-sm')} 三级标题</button>
    <button data-bm="type:list">${icon('listUl','icon-sm')} 列表</button>
    <button data-bm="type:quote">${icon('quote','icon-sm')} 引用</button>
    <button data-bm="type:code">${icon('code','icon-sm')} 代码</button>
    <div class="menu-divider"></div>
    <button data-bm="del" style="color:var(--red)">${icon('trash2','icon-sm')} 删除</button>
  `;
  const r = btn.getBoundingClientRect();
  menu.style.left = r.right + 4 + 'px';
  menu.style.top = r.top + 'px';
  document.body.appendChild(menu);
  menu.addEventListener('click', e => {
    const t = e.target.closest('[data-bm]');
    if(!t) return;
    const cmd = t.dataset.bm;
    if(cmd==='up') moveBlock(blockId, 'up');
    else if(cmd==='down') moveBlock(blockId, 'down');
    else if(cmd==='dup') duplicateBlock(blockId);
    else if(cmd==='del') {
      if(confirm('删除这块？')) deleteBlock(blockId);
    }
    else if(cmd.startsWith('type:')) changeBlockType(blockId, cmd.slice(5));
    closeBlockMenu();
  });
  setTimeout(()=>{
    const close = () => { closeBlockMenu(); document.removeEventListener('click', close); };
    document.addEventListener('click', close);
  }, 0);
}

  const m = document.getElementById('block-menu-active');

/* ============================================================
   课程备课 · 工具栏按钮（H1/字号/颜色/列表/图片/视频/...）
   ============================================================ */
function getActiveBlockEl(){
  // 优先取当前 selection 所在的 block；否则取最后一个 focus 的 block
  const sel = window.getSelection();
  if(sel && sel.rangeCount && isSelectionInCurrentDoc()){
    let n = sel.anchorNode;
    while(n && n.nodeType === 3) n = n.parentNode;
    while(n && !n.dataset?.blockId){
      n = n.parentNode;
      if(n && n.tagName === 'HTML') break;
    }
    if(n && n.dataset?.blockId) return n;
  }
  // 退而求其次：当前激活（lastFocused）的块
  return document.querySelector('.block[data-active="1"]') ||
         document.querySelector('.block:focus') ||
         document.querySelector('.block[data-block-focus]');
}

// 检查当前 selection 是否在已打开文档的 [data-block-id] 元素内
// 用于跨文档切换时避免旧 selection 干扰
function isSelectionInCurrentDoc(){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount) return false;
  let n = sel.anchorNode;
  if(!n) return false;
  while(n && n.nodeType === 3) n = n.parentNode;
  while(n && n !== document.body){
    if(n.dataset && n.dataset.blockId !== undefined){
      // 找到 blockId → 检查这是否在当前打开的文档里
      const doc = getCurrentDoc();
      if(doc && findBlockInDoc(doc, n.dataset.blockId)) return true;
      return false;
    }
    n = n.parentNode;
  }
  return false;
}

function ensureBlockFmt(b){
  if(!b.fmt) b.fmt = {};
  return b.fmt;
}

function applyToolbar(cmd, value, btn){
  const doc = getCurrentDoc();
  // undo / redo 不需要当前 doc 一定有 block focus——只要求有打开的文档
  if(cmd === 'undo'){
    if(!doc){ toast('先打开一份文档'); return; }
    if(!editorUndoStack.length){ toast('没有更多可撤销'); return; }
    editorUndo();
    return;
  }
  if(cmd === 'redo'){
    if(!doc){ toast('先打开一份文档'); return; }
    if(!editorRedoStack.length){ toast('没有更多可重做'); return; }
    editorRedo();
    return;
  }
  if(!doc){ toast('先打开一份文档'); return; }
  // 颜色/粗体/斜体/下划线/字号/高亮：统一走选区格式化路径
  // 没选区 或 selection在旧文档 → 把当前块的全部内容 selectNodeContents
  if(['color','highlight','bold','italic','underline','size'].includes(cmd)){
    const sel = window.getSelection();
    let hasRealSel = sel && sel.rangeCount && !sel.isCollapsed && isSelectionInCurrentDoc();
    if(!hasRealSel){
      const el = getActiveBlockEl();
      if(el){
        const editEl = el.querySelector('[data-block-text]') || el;
        try{
          const r = document.createRange();
          r.selectNodeContents(editEl);
          sel.removeAllRanges();
          sel.addRange(r);
          hasRealSel = true;
        }catch(e){}
      }
    }
    if(hasRealSel && applySelectionFormat(cmd, value)){
      markEditorDirty(); saveState(); renderRoute();
      toast(cmd==='highlight'?'已高亮':'已应用');
      return;
    }
  }
  // 块级命令（h1/h2/h3/p/ul/ol/quote/code/img/video/link/mention/divider）
  const el = getActiveBlockEl();
  if(!el){ toast('鼠标先在文档里点一下'); return; }
  const id = el.dataset.blockId;
  const b = findBlockInDoc(doc, id); if(!b) return;
  // 备注特殊：如有选区给选区加 inline 高亮 + 弹窗；没选区就在当前块后插 note 块
  if(cmd==='note'){
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed && sel.rangeCount){
      const r = sel.getRangeAt(0);
      let n = r.commonAncestorContainer;
      while(n && n.nodeType===3) n = n.parentNode;
      if(n && n.dataset?.blockId === id){
        // 弹窗让用户写备注内容
        openNotePopover(id, r);
        return;
      }
    }
    pushUndo();
    insertBlockAfter(b, {type:'note', level:'tip', text:''});
    markEditorDirty(); saveState(); renderRoute();
    toast('已插入备注块');
    return;
  }
  pushUndo();
  const fmt = ensureBlockFmt(b);
  switch(cmd){
    case 'h1': b.type='h1'; break;
    case 'h2': b.type='h2'; break;
    case 'h3': b.type='h3'; break;
    case 'p':  b.type='p';  break;
    case 'bold':       fmt.bold = !fmt.bold; break;
    case 'italic':     fmt.italic = !fmt.italic; break;
    case 'underline':  fmt.underline = !fmt.underline; break;
    case 'size':       fmt.size = value; break;
    case 'ul':         b.type='list'; b.ordered=false; break;
    case 'ol':         b.type='list'; b.ordered=true;  break;
    case 'quote':      b.type='quote'; break;
    case 'code':       b.type='code';  break;
    case 'img':        insertBlockAfter(b, {type:'image', text:''}); break;
    case 'video':      insertBlockAfter(b, {type:'video', text:''}); break;
    case 'link':       insertBlockAfter(b, {type:'link', text:'', href:''}); break;
    case 'mention':    insertBlockAfter(b, {type:'mention', text:''}); break;
    case 'divider':    insertBlockAfter(b, {type:'divider'}); break;
    case 'undo': editorUndo(); return;
    case 'redo': editorRedo(); return;
  }
  markEditorDirty(); saveState(); renderRoute();
  toast('已应用');
}

// 给选中的内容加一个 inline 备注高亮（黄色底 + data-note-id），并弹窗写备注内容
function openNotePopover(blockId, range){
  const doc = getCurrentDoc(); if(!doc) return;
  const b = findBlockInDoc(doc, blockId); if(!b) return;
  // 包一个高亮 span
  const noteId = 'n_' + Math.random().toString(36).slice(2,8);
  const span = document.createElement('span');
  span.className = 'inline-note';
  span.dataset.noteId = noteId;
  span.style.background = '#FFF2A8';
  span.style.borderBottom = '2px solid #C5523E';
  span.style.padding = '0 1px';
  span.appendChild(range.extractContents());
  range.insertNode(span);
  // 同步回 b.text + 写 notes 数组
  const blockEl = document.querySelector(`[data-block-id="${blockId}"][data-block-text]`);
  if(blockEl) b.text = blockEl.innerHTML;
  b.notes = b.notes || [];
  b.notes.push({id: noteId, level:'tip', content:''});
  pushUndo();
  markEditorDirty(); saveState();
  // 弹窗让用户写备注
  closeNotePopover();
  const pop = document.createElement('div');
  pop.id = 'note-popover-active';
  pop.className = 'note-popover';
  pop.innerHTML = `
    <div class="note-popover-head">
      <span>给选中的内容加备注</span>
      <button data-action="close-note-popover" title="关闭">×</button>
    </div>
    <div class="note-popover-level">
      <label><input type="radio" name="note-lv" value="tip" checked> 教学提示</label>
      <label><input type="radio" name="note-lv" value="info"> 补充信息</label>
      <label><input type="radio" name="note-lv" value="warn"> 易错提醒</label>
      <label><input type="radio" name="note-lv" value="personal"> 个人备忘</label>
    </div>
    <textarea id="note-popover-text" placeholder="备注内容..." rows="3"></textarea>
    <div class="note-popover-actions">
      <button class="btn btn-ghost btn-sm" data-action="cancel-note-popover">取消</button>
      <button class="btn btn-primary btn-sm" data-action="save-note-popover">保存</button>
    </div>
  `;
  // 定位（智能翻转：下方空间不够则向上弹；位置会被拖动覆盖）
  const rect = range.getBoundingClientRect();
  pop.style.visibility = 'hidden';
  pop.style.left = '0px'; pop.style.top = '0px';
  document.body.appendChild(pop);
  // 测量弹窗尺寸
  const popW = pop.offsetWidth || 280;
  const popH = pop.offsetHeight || 220;
  let left = Math.min(window.innerWidth - popW - 8, Math.max(8, rect.left));
  let top;
  // 优先在选区下方；空间不够则向上
  if(rect.bottom + 8 + popH < window.innerHeight){
    top = rect.bottom + 8;
  } else if(rect.top - popH - 8 > 0){
    top = rect.top - popH - 8;
  } else {
    // 都不够：取屏幕中部偏上
    top = Math.max(8, Math.min(window.innerHeight - popH - 8, 60));
  }
  pop.style.left = left + 'px';
  pop.style.top  = top + 'px';
  pop.style.visibility = 'visible';
  // 拖动支持：按住 head 可以拖
  const head = pop.querySelector('.note-popover-head');
  let dragOff = null;
  head.style.cursor = 'move';
  head.onmousedown = (ev) => {
    if(ev.target.tagName==='BUTTON') return;  // 不要拦截关闭按钮
    ev.preventDefault();
    const r = pop.getBoundingClientRect();
    dragOff = {x: ev.clientX - r.left, y: ev.clientY - r.top};
    const move = (e) => {
      if(!dragOff) return;
      const nl = Math.max(0, Math.min(window.innerWidth - popW, e.clientX - dragOff.x));
      const nt = Math.max(0, Math.min(window.innerHeight - 30,  e.clientY - dragOff.y));
      pop.style.left = nl + 'px';
      pop.style.top  = nt + 'px';
    };
    const up = () => {
      dragOff = null;
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  pop.querySelector('[data-action="close-note-popover"]').onclick = closeNotePopover;
  pop.querySelector('[data-action="cancel-note-popover"]').onclick = () => {
    // 取消：移除刚加的 span
    const s = document.querySelector(`[data-note-id="${noteId}"]`);
    if(s){
      const parent = s.parentNode;
      while(s.firstChild) parent.insertBefore(s.firstChild, s);
      parent.removeChild(s);
      if(blockEl) b.text = blockEl.innerHTML;
      b.notes = (b.notes||[]).filter(n => n.id !== noteId);
      markEditorDirty(); saveState(); renderRoute();
    }
    closeNotePopover();
  };
  pop.querySelector('[data-action="save-note-popover"]').onclick = () => {
    const txt = pop.querySelector('#note-popover-text').value.trim();
    const lv = pop.querySelector('input[name="note-lv"]:checked').value;
    const note = (b.notes||[]).find(n => n.id===noteId);
    if(note){ note.content = txt; note.level = lv; }
    // 改高亮 span 颜色按等级
    const s = document.querySelector(`[data-note-id="${noteId}"]`);
    if(s){
      const lvColor = {tip:'#FFF2A8',info:'#D6E8FF',warn:'#FFD8C8',personal:'#EAD8FF'}[lv];
      s.style.background = lvColor;
    }
    if(blockEl) b.text = blockEl.innerHTML;
    markEditorDirty(); saveState(); renderRoute();
    closeNotePopover();
    toast(txt ? '备注已加' : '已标记高亮（备注为空）');
  };
  setTimeout(()=>pop.querySelector('#note-popover-text').focus(), 50);
}
function closeNotePopover(){
  const p = document.getElementById('note-popover-active');
  if(p) p.remove();
}

// ===== 自定义颜色 / 高亮色弹窗（带"应用"按钮）=====
// type: 'color' 或 'highlight'
// 跟踪当前的"外部点击关闭"处理器，便于关闭时反注册
let _cppOutsideHandler = null;
function openColorPickerPopover(type, defaultHex, anchorEl){
  // 已有就关掉
  closeColorPickerPopover();
  const isHL = type === 'highlight';

  // 关键：在打开弹窗前把当前 selection 存下来，避免选区丢失
  // （因为工具栏 mousedown preventDefault + 弹窗 focus 转移会让选区 collapse/丢失）
  const savedSel = window.getSelection();
  let savedRange = null;
  if(savedSel && savedSel.rangeCount && !savedSel.isCollapsed){
    savedRange = savedSel.getRangeAt(0).cloneRange();
  }

  const pop = document.createElement('div');
  pop.id = 'color-picker-pop-active';
  pop.className = 'popover cpp';
  // 最近用过的自定义色（来自 state）
  const recent = (STATE.settings && STATE.settings.customColors) || [];
  const recentList = (isHL ? recent.highlight : recent.color) || [];
  pop.innerHTML = `
    <div class="cpp-title">${isHL ? '自定义高亮色' : '自定义字体颜色'}</div>
    <!-- RGB 调色盘：大色块，点击调出系统色盘（H/S 调色区 + 下方 RGB 滑块） -->
    <button type="button" class="cpp-palette" id="cpp-palette" style="background:${defaultHex}" title="点击调出 RGB 调色盘">
      <span class="cpp-palette-label">🎨 RGB 调色盘 · 点击选色</span>
      <span class="cpp-palette-hex" id="cpp-palette-hex">${defaultHex.toUpperCase()}</span>
    </button>
    <input type="color" id="cpp-native" value="${defaultHex}" />
    <!-- HEX 手动输入 -->
    <div class="cpp-row">
      <label>HEX</label>
      <input type="text" id="cpp-hex" maxlength="7" value="${defaultHex.toUpperCase()}" placeholder="#RRGGBB" />
    </div>
    <!-- RGB 三通道（可点击 / 输入修改，0-255） -->
    <div class="cpp-rgb-row" id="cpp-rgb-row">
      <div class="cpp-rgb-chip r" data-ch="R">
        <button type="button" class="cpp-rgb-step" data-delta="-10">−</button>
        <label>R</label>
        <input type="number" id="cpp-rgb-r" min="0" max="255" step="1" />
        <button type="button" class="cpp-rgb-step" data-delta="10">+</button>
      </div>
      <div class="cpp-rgb-chip g" data-ch="G">
        <button type="button" class="cpp-rgb-step" data-delta="-10">−</button>
        <label>G</label>
        <input type="number" id="cpp-rgb-g" min="0" max="255" step="1" />
        <button type="button" class="cpp-rgb-step" data-delta="10">+</button>
      </div>
      <div class="cpp-rgb-chip b" data-ch="B">
        <button type="button" class="cpp-rgb-step" data-delta="-10">−</button>
        <label>B</label>
        <input type="number" id="cpp-rgb-b" min="0" max="255" step="1" />
        <button type="button" class="cpp-rgb-step" data-delta="10">+</button>
      </div>
    </div>
    ${recentList.length ? `
      <div class="cpp-recent-title">最近用过的</div>
      <div class="cpp-recent">
        ${recentList.slice(0, 8).map(c => `<div class="cpp-recent-swatch" style="background:${c}" data-c="${c}" title="${c}"></div>`).join('')}
      </div>
    ` : ''}
    <div class="cpp-actions">
      <button class="cpp-btn cpp-cancel" id="cpp-cancel">取消</button>
      <button class="cpp-btn cpp-apply" id="cpp-apply">${isHL ? '应用高亮' : '应用此颜色'}</button>
    </div>
  `;
  document.body.appendChild(pop);

  // 定位
  const r = anchorEl.getBoundingClientRect();
  pop.style.position = 'fixed';
  const popW = 300;
  let left = r.left;
  if(left + popW > window.innerWidth - 16) left = window.innerWidth - popW - 16;
  if(left < 16) left = 16;
  let top = r.bottom + 6;
  // 下方空间不够就往上弹
  const popH = 260;
  if(top + popH > window.innerHeight - 16) top = r.top - popH - 6;
  if(top < 16) top = 16;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';

  // 元素引用
  const paletteEl  = pop.querySelector('#cpp-palette');
  const paletteHex = pop.querySelector('#cpp-palette-hex');
  const nativeEl   = pop.querySelector('#cpp-native');
  const hexEl      = pop.querySelector('#cpp-hex');
  const rgbREl     = pop.querySelector('#cpp-rgb-r');
  const rgbGEl     = pop.querySelector('#cpp-rgb-g');
  const rgbBEl     = pop.querySelector('#cpp-rgb-b');
  const applyBtn   = pop.querySelector('#cpp-apply');
  const cancelBtn  = pop.querySelector('#cpp-cancel');

  // hex → {r,g,b}
  const hexToRgb = (hex) => {
    const m = /^#([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})([0-9A-Fa-f]{2})$/.exec(hex);
    if(!m) return null;
    return [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)];
  };
  // {r,g,b} → hex
  const rgbToHex = (r,g,b) => '#' + [r,g,b].map(n => Math.max(0,Math.min(255,n|0)).toString(16).padStart(2,'0')).join('').toUpperCase();

  // 把 RGB 数值同步到 hex / palette / native
  const setHex = (v) => {
    paletteEl.style.background = v;
    paletteHex.textContent = v.toUpperCase();
    nativeEl.value = v;
    hexEl.value = v.toUpperCase();
    const rgb = hexToRgb(v);
    if(rgb){
      rgbREl.value = rgb[0];
      rgbGEl.value = rgb[1];
      rgbBEl.value = rgb[2];
    }
  };
  // 从 RGB 输入框采集并校验
  const applyFromRgb = () => {
    const r = Math.max(0, Math.min(255, parseInt(rgbREl.value)||0));
    const g = Math.max(0, Math.min(255, parseInt(rgbGEl.value)||0));
    const b = Math.max(0, Math.min(255, parseInt(rgbBEl.value)||0));
    setHex(rgbToHex(r,g,b));
  };

  // HEX 输入 → 同步
  const syncFromHex = () => {
    let v = hexEl.value.trim();
    if(!v.startsWith('#')) v = '#' + v;
    if(!/^#[0-9A-Fa-f]{6}$/.test(v)) return;
    setHex(v);
  };
  // Native picker → 同步
  const syncFromNative = () => setHex(nativeEl.value);
  hexEl.addEventListener('input', syncFromHex);
  nativeEl.addEventListener('input', syncFromNative);

  // RGB 输入框：input 事件实时同步；Enter 直接应用；blur 校正超界值
  [rgbREl, rgbGEl, rgbBEl].forEach(inp => {
    inp.addEventListener('input', () => {
      // 实时同步（即使未 blur 也能预览）
      const r = parseInt(rgbREl.value);
      const g = parseInt(rgbGEl.value);
      const b = parseInt(rgbBEl.value);
      if(!isNaN(r) && !isNaN(g) && !isNaN(b)){
        setHex(rgbToHex(r,g,b));
      }
    });
    inp.addEventListener('blur', () => {
      // 失焦时把值钳到 0-255
      const ch = parseInt(inp.value);
      const v = isNaN(ch) ? 0 : Math.max(0, Math.min(255, ch));
      inp.value = v;
      applyFromRgb();
    });
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); applyFromRgb(); }
      // ↑↓ 数字键快速微调
      if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        const delta = e.key === 'ArrowUp' ? step : -step;
        const v = Math.max(0, Math.min(255, (parseInt(inp.value)||0) + delta));
        inp.value = v;
        applyFromRgb();
      }
    });
  });

  // +/- 按钮：调整当前 chip 对应通道 ±10
  pop.querySelectorAll('.cpp-rgb-step').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const delta = parseInt(btn.dataset.delta);
      const chip = btn.closest('.cpp-rgb-chip');
      const inp = chip.querySelector('input');
      const v = Math.max(0, Math.min(255, (parseInt(inp.value)||0) + delta));
      inp.value = v;
      applyFromRgb();
      // 短动画反馈
      btn.style.transform = 'scale(.85)';
      setTimeout(()=>{ btn.style.transform = ''; }, 120);
    });
  });

  // 初始化 RGB 显示
  setHex(defaultHex);

  // RGB 调色盘按钮 = 触发系统 picker（弹出标准 RGB 色盘面板：H/S + R/G/B 滑块）
  paletteEl.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    nativeEl.click();
  });

  // 点最近用过的色 → 填进 hex + preview
  pop.querySelectorAll('.cpp-recent-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      setHex(sw.dataset.c);
    });
  });

  // 应用
  const doApply = () => {
    let v = hexEl.value.trim();
    if(!v.startsWith('#')) v = '#' + v;
    if(!/^#[0-9A-Fa-f]{6}$/.test(v)){
      toast('颜色格式不对，要 #RRGGBB');
      return;
    }
    // 记到最近用
    if(!STATE.settings.customColors) STATE.settings.customColors = {color:[], highlight:[]};
    const arr = isHL ? STATE.settings.customColors.highlight : STATE.settings.customColors.color;
    const idx = arr.indexOf(v);
    if(idx >= 0) arr.splice(idx, 1);
    arr.unshift(v);
    if(arr.length > 8) arr.length = 8;
    saveState();

    // 还原之前的选区（如果丢了）
    if(savedRange){
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }

    // 真正套到选区
    applyToolbar(isHL ? 'highlight' : 'color', 'custom:' + v, anchorEl);
    closeColorPickerPopover();
  };
  applyBtn.addEventListener('click', doApply);
  cancelBtn.addEventListener('click', closeColorPickerPopover);

  // Enter 直接应用，Esc 取消
  hexEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); doApply(); }
    if(e.key === 'Escape'){ e.preventDefault(); closeColorPickerPopover(); }
  });

  // 点弹窗外关掉（mousedown capture 阶段；弹窗内点击一律放过；toolbar + 按钮也放过让 openColorPickerPopover 自己处理）
  function closeOnOutside(e){
    // 弹窗已不在 DOM（被关掉了）→ 这个 listener 也该失效
    if(!document.getElementById('color-picker-pop-active')) return;
    // 弹窗内点击 → 放过（包括 RGB +/-、HEX、palette、最近用过的、按钮行）
    if(pop.contains(e.target)) return;
    // toolbar 上的 + 按钮：让它自己开新弹窗（这里不关旧的）
    if(e.target.closest('[data-color-picker],[data-hl-picker]')) return;
    if(e.target === nativeEl) return;
    // 真的在外面点
    closeColorPickerPopover();
  }
  // 保存引用，关闭时反注册（避免累积 listener）
  _cppOutsideHandler = closeOnOutside;
  document.addEventListener('mousedown', closeOnOutside, true);
  // 不自动 focus 到 hex 输入，避免抢 contenteditable 的 selection 焦点
  // 用户需要输入 hex 时自己点 hex 输入框
}
function closeColorPickerPopover(){
  const p = document.getElementById('color-picker-pop-active');
  if(p) p.remove();
  // 反注册上一次保存的 outside 监听
  if(_cppOutsideHandler){
    document.removeEventListener('mousedown', _cppOutsideHandler, true);
    _cppOutsideHandler = null;
  }
}

function insertBlockAfter(b, partial){
  const doc = getCurrentDoc(); if(!doc) return;
  const idx = doc.blocks.findIndex(x=>x.id===b.id);
  if(idx<0) return;
  const nb = {id:'b_'+Math.random().toString(36).slice(2,8), ...partial};
  doc.blocks.splice(idx+1, 0, nb);
}

function applySelectionFormat(cmd, value){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  // 必须在某个 block 内
  let n = range.commonAncestorContainer;
  while(n && n.nodeType === 3) n = n.parentNode;
  while(n && !n.dataset?.blockId){
    n = n.parentNode;
    if(n && n.tagName === 'HTML') return false;
  }
  if(!n || !n.dataset?.blockId) return false;
  // 找到"内容容器"：data-block-text（contenteditable 内容区）或 data-block-text="label"（label 区）
  const blockId = n.dataset.blockId;
  let contentEl = null;     // 当前内容容器
  let fieldName = 'text';   // 同步到 b.text 还是 b.label
  // 向上找最近 [data-block-text]
  let probe = n;
  while(probe && probe.dataset?.blockId === blockId){
    if(probe.dataset.blockText !== undefined){
      contentEl = probe;
      fieldName = probe.dataset.blockText === 'label' ? 'label' : 'text';
      break;
    }
    probe = probe.parentNode;
  }
  if(!contentEl){
    contentEl = document.querySelector(`[data-block-id="${blockId}"][data-block-text]`);
    if(!contentEl) contentEl = n;
  }
  const doc = getCurrentDoc(); if(!doc) return false;
  const b = findBlockInDoc(doc, blockId);
  if(!b) return false;
  pushUndo();

  // === 特殊：清除高亮（去掉选区内所有 background-color，包括嵌套/重叠）===
  if(cmd==='highlight' && value==='none'){
    try{
      // 1) 扩展 range 让其覆盖所有含 backgroundColor 的祖先 span
      //    循环处理：先找最近的含 bg 的祖包整个元素，再继续往上找
      let workRange = range.cloneRange();
      let expanded = true;
      let safety = 0;
      while(expanded && safety++ < 20){
        expanded = false;
        let probe = workRange.commonAncestorContainer;
        if(probe.nodeType === 3) probe = probe.parentNode;
        // 向上找最近的含 backgroundColor 的祖先
        let found = null;
        let p = probe;
        while(p && p !== contentEl){
          const bg = p.style && p.style.backgroundColor;
          if(bg && bg !== ''){
            found = p;
            break;
          }
          p = p.parentNode;
        }
        if(found){
          // probe 在 workRange 内吗？检查 startContainer/found 的关系
          // 简化：直接 selectNode(found)
          try{
            const nr = document.createRange();
            nr.selectNode(found);
            workRange = nr;
            expanded = true;
          }catch(e){}
        }
      }
      // 2) extract + walkStripStyle + 插回
      const frag = workRange.extractContents();
      const wrap = document.createElement('span');
      wrap.appendChild(frag);
      walkStripStyle(wrap, 'backgroundColor');
      // 注意：clearHighlight 有个问题——嵌套 span 的外层去掉 bg 后，内层 span 如果还有 bg 会保留
      // walkStripStyle 递归处理所有子节点的 backgroundColor，所以嵌套 span 也会被去掉 ✅
      workRange.insertNode(wrap);
      const parent = wrap.parentNode;
      while(wrap.firstChild) parent.insertBefore(wrap.firstChild, wrap);
      parent.removeChild(wrap);
    }catch(e){ console.error('[clear hl]', e); return false; }
    b[fieldName] = contentEl.innerHTML;
    sel.removeAllRanges();
    return true;
  }

  // === 一般：包 span ===
  const propForCmd = {color:'color', highlight:'backgroundColor', bold:'fontWeight', italic:'fontStyle', underline:'textDecoration', size:'fontSize'}[cmd];
  // 把 palette key（red/org/grn/blu/pnk/mute）翻译成 hex 值；
  // 否则浏览器把非法 CSS color 名当无效值静默忽略 → "已应用" 但看不到效果
  const resolveColorValue = (cmd, v) => {
    if(typeof v === 'string' && v.startsWith('custom:')) return v.slice(7);
    if(cmd === 'highlight') return HL_COLORS[v] || v;
    if(cmd === 'color'){
      const found = COLOR_PALETTE.find(c => c.k === v);
      return found ? found.v : v;
    }
    return v;
  };
  const newValue = resolveColorValue(cmd, value);

  // 取消样式：value 是 text/default 或空
  if(value === 'text' || value === 'default'){
    try{
      const frag = range.extractContents();
      const wrap = document.createElement('span');
      wrap.appendChild(frag);
      walkStripStyle(wrap, propForCmd);
      range.insertNode(wrap);
      const parent = wrap.parentNode;
      while(wrap.firstChild) parent.insertBefore(wrap.firstChild, wrap);
      parent.removeChild(wrap);
    }catch(e){ return false; }
    b[fieldName] = contentEl.innerHTML;
    sel.removeAllRanges();
    return true;
  }

  let span = document.createElement('span');
  span.dataset.sel = '1';
  if(cmd==='color'){ span.style.color = newValue; }
  if(cmd==='highlight'){ span.style.backgroundColor = newValue; }
  if(cmd==='bold'){ span.style.fontWeight = '700'; }
  if(cmd==='italic'){ span.style.fontStyle = 'italic'; }
  if(cmd==='underline'){ span.style.textDecoration = 'underline'; }
  if(cmd==='size'){ span.style.fontSize = ({S:'12px',M:'14px',L:'17px',XL:'22px'})[value] || '14px'; }
  try{
    const frag = range.extractContents();
    if(propForCmd) walkStripStyle(frag, propForCmd);
    span.appendChild(frag);
    range.insertNode(span);
  }catch(e){ console.error('[apply sel]', e); return false; }
  b[fieldName] = contentEl.innerHTML;
  sel.removeAllRanges();
  return true;
}

// 递归去掉指定 style 属性（用于取消样式 + 避免嵌套覆盖）
function walkStripStyle(el, prop){
  if(el.nodeType===1){
    if(el.style && el.style[prop] !== undefined && el.style[prop] !== ''){
      el.style[prop] = '';
    }
    Array.from(el.childNodes).forEach(c => walkStripStyle(c, prop));
  }
}

// walkStripStyle 统一处理（在上面 applySelectionFormat 里）

// 工具栏按钮统一事件
// 关键：mousedown 时 preventDefault，避免 contenteditable 失焦（保 selection）
document.addEventListener('mousedown', e => {
  const tbBtn = e.target.closest('[data-tb]');
  if(!tbBtn) return;
  e.preventDefault();
});
document.addEventListener('click', e => {
  const tbBtn = e.target.closest('[data-tb]');
  if(!tbBtn) return;
  // 颜色按钮在 tb-color-row 里，data-color 在子元素上
  const colorEl = e.target.closest('[data-color]');
  if(colorEl){
    e.preventDefault(); e.stopPropagation();
    applyToolbar('color', colorEl.dataset.color, colorEl);
    return;
  }
  // 高亮色（背景色）
  const hlEl = e.target.closest('[data-highlight]');
  if(hlEl){
    e.preventDefault(); e.stopPropagation();
    applyToolbar('highlight', hlEl.dataset.highlight, hlEl);
    return;
  }
  // 自定义颜色按钮 → 弹窗（带应用按钮）
  const cpEl = e.target.closest('[data-color-picker]');
  if(cpEl){
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    openColorPickerPopover('color', cpEl.dataset.colorPicker || '#C5523E', cpEl);
    return;
  }
  // 自定义高亮色 → 弹窗
  const chlEl = e.target.closest('[data-hl-picker]');
  if(chlEl){
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    openColorPickerPopover('highlight', chlEl.dataset.hlPicker || '#FFF2A8', chlEl);
    return;
  }
  e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
  const cmd = tbBtn.dataset.tb;
  applyToolbar(cmd, null, tbBtn);
});
// 字号下拉框
document.addEventListener('change', e => {
  if(e.target.matches?.('[data-tb="size"]')){
    applyToolbar('size', e.target.value, e.target);
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='import-file'){
    const f = e.target.files[0]; if(f) importData(f);
    e.target.value='';
  }
});
document.addEventListener('click', e=>{
  const q = e.target.closest('[data-ai-quick]');
  if(q){
    document.getElementById('ai-input').value = q.dataset.aiQuick;
    document.querySelector('[data-action="ai-send"]')?.click();
  }
});

/* ============================================================
   课程备课 · 额外事件（input/keydown）
   ============================================================ */
document.addEventListener('input', e => {
  const t = e.target;
  // 文档标题
  if(t.id === 'doc-title'){
    const doc = getCurrentDoc(); if(!doc) return;
    doc.title = t.value;
    markEditorDirty();
    return;
  }
  // 块文本
  if(t.dataset && (t.dataset.blockText !== undefined || t.dataset.codeContent !== undefined || t.dataset.capField)){
    const id = t.dataset.blockId;
    const doc = getCurrentDoc(); if(!doc) return;
    const b = findBlockInDoc(doc, id); if(!b) return;
    if(t.dataset.capField){
      if(t.dataset.capField === 'alt') b.alt = t.innerText;
      if(t.dataset.capField === 'caption') b.caption = t.innerText;
    } else if(t.dataset.codeContent){
      b.text = t.innerText;
    } else {
      b.text = t.innerText;
    }
    markEditorDirty();
    return;
  }
  // 备注内容
  if(t.classList && t.classList.contains('note-content')){
    const id = t.dataset.blockId;
    const doc = getCurrentDoc(); if(!doc) return;
    const b = findBlockInDoc(doc, id); if(!b) return;
    b.text = t.innerText;
    markEditorDirty();
    return;
  }
  // 课程搜索
  if(t.id === 'course-search'){
    const q = t.value.trim();
    const filtered = filterCourseDocs(q);
    const grid = document.getElementById('course-doc-grid');
    if(grid) grid.innerHTML = renderCourseDocGrid(filtered);
    return;
  }
  // 标签输入
  if(t.id === 'tag-input'){
    if(e.inputType === 'insertLineBreak' || (t.value.endsWith('\n'))){
      const v = t.value.replace(/\n/g,'').trim();
      if(v){
        const doc = getCurrentDoc(); if(!doc) return;
        doc.tags = doc.tags || [];
        if(!doc.tags.includes(v)) doc.tags.push(v);
        saveState();
        renderRoute();
      }
    }
  }
});

// 标签输入的回车
document.addEventListener('keydown', e => {
  if(e.target.id === 'tag-input' && e.key === 'Enter'){
    e.preventDefault();
    const v = e.target.value.trim();
    if(!v) return;
    const doc = getCurrentDoc(); if(!doc) return;
    doc.tags = doc.tags || [];
    if(!doc.tags.includes(v)) doc.tags.push(v);
    e.target.value = '';
    saveState();
    renderRoute();
  }
});

// 工具栏事件
document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tb]');
  if(!tb) return;
  const cmd = tb.dataset.tb;
  if(cmd === 'size') return;   // select 用 change 事件
  if(cmd === 'color') return;  // color 用 click 但在 tb-color 上
  if(cmd === 'undo' || cmd === 'redo') return;  // 走 applyToolbar（用 editorUndo 栈，不用 document.execCommand）
  handleToolbar(cmd, tb);
});

// 颜色 / 字号
document.addEventListener('click', e => {
  const c = e.target.closest('[data-color]');
  if(c) { handleToolbar('color', c); return; }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-tb="size"]')) handleToolbar('size', e.target);
  if(e.target.matches('[data-doc-default="size"]')) setDocDefaults({size: e.target.value});
  if(e.target.matches('[data-doc-default]') && e.target.dataset.docDefault === 'size') {
    setDocDefaults({size: e.target.value});
  }
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-doc-default-color]');
  if(c){ setDocDefaults({color: c.dataset.docDefaultColor}); return; }
  const s = e.target.closest('[data-doc-default-bold]');
  if(s){
    const doc = getCurrentDoc(); if(!doc) return;
    setDocDefaults({bold: !doc.defaults?.bold});
    return;
  }
});

// 备注图片块拖拽上传
document.addEventListener('dragover', e => {
  if(e.target.closest('[data-block-type="image"]')) e.preventDefault();
});
document.addEventListener('drop', e => {
  const blockEl = e.target.closest('[data-block-type="image"]');
  if(!blockEl) return;
  e.preventDefault();
  const id = blockEl.dataset.blockId;
  const f = e.dataTransfer.files[0];
  if(!f || !f.type.startsWith('image/')) return;
  if(f.size > 5*1024*1024){ toast('图片不能超过 5MB'); return; }
  const r = new FileReader();
  r.onload = ev => {
    const doc = getCurrentDoc(); if(!doc) return;
    const b = findBlockInDoc(doc, id); if(b){
      b.src = ev.target.result; b.alt = f.name;
      markEditorDirty(); renderRoute();
    }
  };
  r.readAsDataURL(f);
});

// 块内键盘快捷键
document.addEventListener('keydown', e => {
  // Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z → 撤销/重做（全局生效，不需先 focus 进块）
  if((e.ctrlKey || e.metaKey) && !e.altKey){
    const k = e.key.toLowerCase();
    if(k === 'z' && !e.shiftKey){
      e.preventDefault();
      if(!editorUndoStack.length){ toast('没有更多可撤销'); return; }
      editorUndo();
      return;
    }
    if(k === 'y' || (k === 'z' && e.shiftKey)){
      e.preventDefault();
      if(!editorRedoStack.length){ toast('没有更多可重做'); return; }
      editorRedo();
      return;
    }
  }
  // 块菜单：Ctrl+/ 触发
  if(e.key === '/' && e.ctrlKey && e.target.dataset?.blockText !== undefined){
    e.preventDefault();
    openBlockMenu(e.target.dataset.blockId, e.target);
  }
  // mention 弹窗的键盘上下
  if(currentMention && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    e.preventDefault();
    const items = currentMention.pop.querySelectorAll('.mention-item');
    currentMention.index = (currentMention.index + (e.key==='ArrowDown'?1:-1) + items.length) % items.length;
    items.forEach((it,i) => it.classList.toggle('active', i===currentMention.index));
    return;
  }
  if(currentMention && e.key === 'Enter'){
    e.preventDefault();
    const items = currentMention.pop.querySelectorAll('.mention-item');
    const it = items[currentMention.index];
    if(it) it.click();
    return;
  }
  if(currentMention && e.key === 'Escape'){
    e.preventDefault(); closeMention();
  }
  // Enter 在文本块中：新建段落
  if(e.key === 'Enter' && !e.shiftKey && e.target.dataset?.blockText !== undefined){
    e.preventDefault();
    const id = e.target.dataset.blockId;
    const doc = getCurrentDoc(); if(!doc) return;
    addBlockAfter(id, {type:'p', text:''});
    return;
  }
  // Backspace 在空文本块：删除
  if(e.key === 'Backspace' && e.target.dataset?.blockText !== undefined && e.target.innerText.trim() === ''){
    const doc = getCurrentDoc(); if(!doc) return;
    const idx = doc.blocks.findIndex(b => b.id === e.target.dataset.blockId);
    if(idx > 0){
      e.preventDefault();
      const prevId = doc.blocks[idx-1].id;
      doc.blocks.splice(idx, 1);
      markEditorDirty(); renderRoute();
      setTimeout(()=>{
        const el = document.querySelector(`[data-block-id="${prevId}"][data-block-text]`);
        if(el){ el.focus(); }
      }, 50);
    }
  }
});

/* ============================================================
   启动
   ============================================================ */
loadState();
renderAll();

// 路由 hash
window.addEventListener('hashchange', ()=>{
  const h = location.hash.slice(2);
  if(ROUTES[h]){ currentRoute = h; renderRoute(); }
});
if(location.hash.startsWith('#/')){
  const h = location.hash.slice(2);
  if(ROUTES[h]) currentRoute = h;
}
renderRoute();  // 再 render 一次让 hash 生效

// URL 参数 ?open=docId  直接打开某文档（方便测试和书签）
// 支持 ?open=first 自动打开第一份文档
const _openDoc = new URLSearchParams(location.search).get('open');
if(_openDoc){
  let targetId = _openDoc;
  if(_openDoc === 'first'){
    const first = getAllCourseDocs()[0];
    if(first) targetId = first.id;
  }
  const d = getDocById(targetId);
  if(d){
    activeCourse = d.course;
    activeDocId = d.id;
    currentRoute = 'course';
  }
}
renderRoute();
</script>
